  }
}

class ExplosionFX {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color || "#ffe600";
    this.fxType = Math.floor(Math.random() * 6);
    this.life = 1.0;
    this.decay = 2.4 + Math.random() * 1.2;
    this.particles = [];
    for (let i = 0; i < 10; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 2 + Math.random() * 5.5;
      this.particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 2 + Math.random() * 3 });
    }
  }
  update(dt) {
    this.life -= this.decay * dt;
    this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; });
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.strokeStyle = this.color;
    ctx.fillStyle = this.color;

    if (this.fxType === 0) {
      this.particles.forEach(p => ctx.fillRect(p.x - 2, p.y - 2, 4, 4));
    } else if (this.fxType === 1) {
      const ringR = (1.0 - this.life) * 48;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(this.x, this.y, ringR, 0, Math.PI * 2); ctx.stroke();
    } else if (this.fxType === 2) {
      const len = (1.0 - this.life) * 35 + 10;
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.moveTo(this.x - len, this.y); ctx.lineTo(this.x + len, this.y);
      ctx.moveTo(this.x, this.y - len); ctx.lineTo(this.x, this.y + len);
      ctx.stroke();
    } else if (this.fxType === 3) {
      this.particles.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      });
    } else if (this.fxType === 4) {
      const size = (1.0 - this.life) * 26;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.life * 5);
      ctx.strokeRect(-size / 2, -size / 2, size, size);
      ctx.restore();
    } else {
      const r1 = (1.0 - this.life) * 32;
      const r2 = (1.0 - this.life) * 54;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(this.x, this.y, r1, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(this.x, this.y, r2, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }
}

// [추가] 트윈 비행기 전용 번개 구체 클래스
class LightningBolt {
  constructor(x, y, radius) {
    this.x = x;
    this.y = y;
    this.radius = radius;
    this.life = 1.8;
    this.totalLife = 1.8;
  }
  update(dt, enemiesList) {
    this.life -= dt;
    // 보스 및 혜성을 제외한 닿는 모든 적(일반, 보호막, 단단한 암석) 일격 파괴
    for (let ei = enemiesList.length - 1; ei >= 0; ei--) {
      const e = enemiesList[ei];
      if (e.isDead || e.hp <= 0) continue;
      const dSq = (e.x - this.x) * (e.x - this.x) + (e.y - this.y) * (e.y - this.y);
      const hitR = this.radius + e.radius;
      if (dSq <= hitR * hitR) {
        e.hasShield = false;
        safeKillEnemy(e, "#00f5ff");
        playExplosionSound();
      }
    }
  }
  draw() {
    if (this.life <= 0) return;
    const alpha = Math.max(0, this.life / this.totalLife);
    ctx.save();
    ctx.globalAlpha = alpha;

    // 1. 내부 플라즈마 오라 코어
    const pGrad = ctx.createRadialGradient(this.x, this.y, 2, this.x, this.y, this.radius);
    pGrad.addColorStop(0, "rgba(255, 255, 255, 0.95)");
    pGrad.addColorStop(0.3, "rgba(0, 245, 255, 0.45)");
    pGrad.addColorStop(0.7, "rgba(0, 150, 255, 0.22)");
    pGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = pGrad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();

    // 2. 외곽 네온 충격파 링 (30% 더 투명하게 rgba 0.7 적용)
    ctx.strokeStyle = "rgba(0, 245, 255, 0.7)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // 3. 지그재그 전격 아크 (6갈래)

    // 3. 지그재그 전격 아크 (6갈래)
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.8;
    for (let k = 0; k < 6; k++) {
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      let cx = this.x, cy = this.y;
      for (let s = 0; s < 5; s++) {
        cx += (Math.random() - 0.5) * (this.radius * 0.8);
        cy += (Math.random() - 0.5) * (this.radius * 0.8);
        ctx.lineTo(cx, cy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
}

let playerDeathCinematic = {
  active: false,
  timer: 0.0,
  shards: []
};

function triggerPlayerCinematicDeath(hitSourceX, hitSourceY) {
  if (playerDeathCinematic.active || !player) return;
  finalSurvivedSec = Math.floor(inGameElapsedTime || 0);
  player.isAlive = false;  playerDeathCinematic.active = true;
  playerDeathCinematic.timer = 0.0;

  const pCol = player.pType === 4 ? "#ffd700" : (player.pType === 1 ? "#ff2244" : (player.pType === 2 ? "#00ff66" : "#00f5ff"));
  playerDeathCinematic.shards = Array.from({ length: 24 }, (_, idx) => {
    const ang = Math.random() * Math.PI * 2;
    const spd = 4.0 + Math.random() * 6.0;
    return {
      x: player.x, y: player.y,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      w: 4 + Math.random() * 8,
      h: 2 + Math.random() * 6,
      rot: Math.random() * Math.PI,
      rotSpd: (Math.random() - 0.5) * 12,
      color: idx % 3 === 0 ? "#ffffff" : pCol
    };
  });

  explosions.push(new ExplosionFX(player.x, player.y, pCol));
  playExplosionSound();
}

function updateAndDrawPlayerCinematic(dt) {
  if (!playerDeathCinematic.active) return;
  playerDeathCinematic.timer += dt;
  const elapsed = playerDeathCinematic.timer;

  ctx.save();
  ctx.globalAlpha = Math.max(0, 1.0 - elapsed / 0.4);
  playerDeathCinematic.shards.forEach(s => {
    s.x += s.vx * (dt * 60);
    s.y += s.vy * (dt * 60);
    s.rot += s.rotSpd * dt;

    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.fillStyle = s.color;
    ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
    ctx.restore();
  });
  ctx.restore();

  if (elapsed >= 0.4) {
    playerDeathCinematic.active = false;
    handleGameOver(); // 정상적으로 게임오버 창 및 랭킹 등록 호출
  }
}

class Bullet {
  constructor(x, y, vx, vy, dmg, radius=4.5, bulletType="DEFAULT", isBlackHoleTrigger=false) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.dmg = dmg; this.radius = radius;
    this.bulletType = bulletType;
    this.isBlackHoleTrigger = isBlackHoleTrigger;
    this.lightningVariant = Math.floor(Math.random() * 5); // 0~4번 꺾임 형태 랜덤 지정
  }
  update(dt) { this.x += this.vx * (dt * 60); this.y += this.vy * (dt * 60); }
  draw() {
    if (this.bulletType === "DEFAULT") {
      ctx.fillStyle = "#ffe600";
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.bulletType === "TWIN") {
      // 5가지 꺾임 강도 프리셋 (세그먼트 수, 좌우 꺾임폭)
      const variants = [
        { seg: 5, disp: 7 },
        { seg: 6, disp: 9 },
        { seg: 6, disp: 11 },
        { seg: 7, disp: 13 },
        { seg: 7, disp: 15 }
      ];
      const v = variants[this.lightningVariant || 0];
      const pts = createLightningPoints(this.x, this.y + 13, this.x, this.y - 13, v.seg, v.disp);
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.strokeStyle = "rgba(0, 245, 255, 0.45)";
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let p = 1; p < pts.length; p++) ctx.lineTo(pts[p].x, pts[p].y);
      ctx.stroke();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.0;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let p = 1; p < pts.length; p++) ctx.lineTo(pts[p].x, pts[p].y);
      ctx.stroke();
      ctx.restore();

    } else if (this.bulletType === "POWER") {
      // 3. 파워 탄환: 사전 캐싱된 Gradient를 사용하며 절대 좌표로 직접 드로잉
      } else if (this.bulletType === "POWER") {
      const rKey = Math.round(this.radius);
      if (!window.cachedPowerBulletGrads) window.cachedPowerBulletGrads = new Map();
      let grad = window.cachedPowerBulletGrads.get(rKey);
      if (!grad) {
        grad = ctx.createRadialGradient(0, 0, 1, 0, 0, rKey);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.3, "#ffe600");
        grad.addColorStop(1, "#ff2244");
        window.cachedPowerBulletGrads.set(rKey, grad);
      }
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

    } else if (this.bulletType === "BLACK_HOLE") {
      // 4. 블랙홀 탄환: 절대 좌표에 원 및 외곽선 스트로크 직접 드로잉
      ctx.fillStyle = "#1e0033";
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#bf00ff";
      ctx.lineWidth = 2.2;
      ctx.stroke();

    } else if (this.bulletType === "LEGEND") {
      // 5. 레전드 화살촉 폴리곤 탄환
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = "#ffd700";
      ctx.beginPath();
      ctx.moveTo(0, -14); ctx.lineTo(5, 6); ctx.lineTo(0, 3); ctx.lineTo(-5, 6);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(0, -4, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

class BossDropItem {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.radius = 16; this.speed = 2.2;
    this.spawnTime = performance.now() / 1000;
    this.startIndex = Math.floor(Math.random() * 3);
  }
  getType(curTime) {
    const elapsed = curTime - this.spawnTime;
    const shift = Math.floor(elapsed / 1.2);
    const idx = (this.startIndex + shift) % 3;
    return ["P", "M", "D"][idx];
  }
  update(dt) { this.y += this.speed * (dt * 60); }
  draw(curTime) {
    const type = this.getType(curTime);
    const themeCol = type === "P" ? "#ff0080" : (type === "M" ? "#00f5ff" : "#ffe600");
    const pulseR = this.radius + Math.sin(curTime * 12) * 3;

    ctx.save();
    ctx.strokeStyle = themeCol;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(this.x, this.y, pulseR, 0, Math.PI * 2); ctx.stroke();

    ctx.fillStyle = themeCol;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.0; ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = `bold 14px ${FONT_FAMILY}`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(type, this.x, this.y);
    ctx.restore();
  }
}

class Enemy {
  constructor(maxHp, baseSpeed, designId, hasShield=false, isHeavy=false, customX=null) {
    this.originX = (customX !== null) ? customX : (40 + Math.random() * (LOGICAL_WIDTH - 80));
    this.x = this.originX;
    this.y = -40;
    this.vx = 0;
    this.maxHp = maxHp;
    this.hp = maxHp;
    this.aliveTime = 0.0; // 화면 노출 경과 시간 (초)
    this.speed = isHeavy ? baseSpeed : baseSpeed * (0.75 + Math.random() * 0.7);
    this.patternType = isHeavy ? "STRAIGHT" : ["STRAIGHT", "SINE", "SMOOTH_CURVE", "DIVE", "ZIGZAG"][Math.floor(Math.random() * 5)];
    this.sinePhase = Math.random() * Math.PI * 2;
    this.sineAmp = (55 + Math.random() * 65) * 0.7;
    this.sineFreq = 2.5 + Math.random() * 2.3;
    this.curveVx = (Math.random() < 0.5 ? -1 : 1) * (2.2 + Math.random() * 2.0);
    this.curveTimer = 0.4 + Math.random() * 0.6;
    this.diveTriggered = false;
    this.designId = (designId !== undefined && !isNaN(designId)) ? designId : 0;
    this.radius = isHeavy ? 18 : (maxHp <= 8 ? 20 : (maxHp <= 18 ? 25 : 30));
    this.hasShield = hasShield;
    this.shieldHits = 0;
    this.freezeTimer = 0.0;
    this.isHeavy = isHeavy;
    this.rotDir = Math.random() < 0.5 ? 1 : -1;
    this.colorIdx = Math.floor(Math.random() * 5);
    this.isDead = false;
    this.isBeingSucked = false;
    this.lastMissileLaserTick = 0;
    this.lastGeneralLaserTick = 0;
  }
  update(dt, elapsed, speedScale=1.0, widthScale=1.0) {
    if (this.isBeingSucked) return;
    this.aliveTime += dt; // 노출 시간 누적
    if (this.freezeTimer > 0) {
      this.freezeTimer -= dt;
      this.vx = 0;
      return;
    }

    const effSpeed = this.speed * speedScale;
    const step = dt * 60 * speedScale;
    this.x += this.vx * (dt * 60);
    this.vx *= 0.92;

    if (this.patternType === "DIVE") {
      if (!this.diveTriggered && this.y > 180) { this.diveTriggered = true; this.speed *= 1.8; }
      this.y += effSpeed * (dt * 60);
      this.x += Math.sin(elapsed * 5.0) * (1.5 * step * widthScale * 0.7); // 30% 감소
    } else if (this.patternType === "ZIGZAG") {
      this.y += (effSpeed * 0.9) * (dt * 60);
      this.x += (this.curveVx * widthScale) * step * 0.7; // 30% 감소
      if (this.x <= this.radius + 5 || this.x >= LOGICAL_WIDTH - this.radius - 5) this.curveVx *= -1;
    } else if (this.patternType === "SINE") {
      this.y += effSpeed * (dt * 60);
      this.x = this.originX + Math.sin(elapsed * this.sineFreq + this.sinePhase) * (this.sineAmp * widthScale); // sineAmp 자체를 0.7배로 축소 적용
    } else if (this.patternType === "SMOOTH_CURVE") {
      this.y += effSpeed * (dt * 60);
      this.curveTimer -= dt;
      if (this.curveTimer <= 0) { this.curveVx = ((Math.random() * 7) - 3.5) * 0.7; this.curveTimer = 0.5 + Math.random() * 0.7; } // 30% 감소
      this.x += (this.curveVx * widthScale) * step;
    } else {
      this.y += (effSpeed * 1.15) * (dt * 60);
    }
    this.x = Math.max(this.radius, Math.min(LOGICAL_WIDTH - this.radius, this.x));
  }
  draw(curTime) {
    ctx.save();
    ctx.translate(this.x, this.y);
    drawVectorEnemy(ctx, this.designId, this.isHeavy, this.rotDir, this.colorIdx, curTime);
    ctx.restore();

    if (this.hasShield) {
      ctx.save();
      const isDamaged = (this.shieldHits >= 10);
      if (isDamaged) ctx.globalAlpha = 0.5;
      ctx.strokeStyle = "#00f5ff";
      ctx.lineWidth = 2.0;

      const r = this.radius + 8;
      ctx.beginPath();
      if (!isDamaged) {
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
      } else {
        const waveCount = 12;
        for (let i = 0; i <= waveCount; i++) {
          const theta = (i / waveCount) * Math.PI * 2;
          const waveR = r + Math.sin(theta * 6 + curTime * 10) * 3.5;
          const px = this.x + Math.cos(theta) * waveR;
          const py = this.y + Math.sin(theta) * waveR;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
      }
      ctx.stroke();
      ctx.restore();
    } else if (!this.isHeavy) {
      const barW = Math.floor(this.radius * 1.4);
      const hpW = Math.floor(barW * Math.max(0, this.hp / this.maxHp));
      ctx.fillStyle = "#505064";
      ctx.fillRect(this.x - barW / 2, this.y - this.radius - 8, barW, 3);
      ctx.fillStyle = "#32ff78";
      ctx.fillRect(this.x - barW / 2, this.y - this.radius - 8, hpW, 3);
    }
  }
}

function safeKillEnemy(e, customColor="#ffe600", isHedgehogKill=false) {
  if (!e || e.isDead) return false;
  e.isDead = true;
  e.hp = 0;
  const addScore = e.isHeavy ? 5 : 1;
  score = Math.max(0, Math.floor(score + addScore));

  if (!isHedgehogKill) {
    const isBuffActive = (player && (player.shieldRemain > 0 || player.laserWeaponTimer > 0 || player.clonePlaneTimer > 0));
    
    // [기능 2] 180초부터 매 30초마다 10%씩 게이지 충전량 감소 (3~6분 구간 20% 추가 감축)
    let penaltyMultiplier = 1.0;
    if (typeof inGameElapsedTime === "number" && inGameElapsedTime >= 180.0) {
      const step = Math.floor((inGameElapsedTime - 180.0) / 30.0) + 1;
      penaltyMultiplier = Math.max(0.1, 1.0 - step * 0.10); // 최대 90% 감소 제한

      // 3~6분(180초~360초) 구간 충전 횟수 20% 감소 (0.8배)
      if (inGameElapsedTime <= 360.0) {
        penaltyMultiplier *= 0.8;
      }
    }

    const baseGain = isBuffActive ? (CONFIG.BASE_GAUGE_PER_KILL * 0.3) : CONFIG.BASE_GAUGE_PER_KILL;
    const effectiveGauge = baseGain * penaltyMultiplier;
    skillGauge = Math.min(CONFIG.MAX_SKILL_GAUGE, skillGauge + effectiveGauge);
  }

  if (!e.isBeingSucked) {
    if (e.isHeavy) {
      if (rockDebrisList.length < 20) rockDebrisList.push(new RockDebrisFX(e.x, e.y));
    } else {
      if (explosions.length < 35) explosions.push(new ExplosionFX(e.x, e.y, customColor));
    }
  }

  const idx = enemies.indexOf(e);
  if (idx !== -1) enemies.splice(idx, 1);
  return true;
}

function applyDamageToEnemy(e, dmg, bType="DEFAULT", isLaserShards=false) {
  if (hitImpacts.length < 30) hitImpacts.push(new BulletHitImpactFX(e.x, e.y, bType));

  const curHitTime = performance.now() / 1000;

  // 1. 회색 돌맹이: 연속 피격 4초 누적 시 파괴
  if (e.isHeavy) {
    if (e.lastHeavyHitTime) {
      const timeDelta = curHitTime - e.lastHeavyHitTime;
      if (timeDelta > 0 && timeDelta <= 1.0) {
        e.heavyBurnedTime = (e.heavyBurnedTime || 0) + timeDelta;
      }
    }
    e.lastHeavyHitTime = curHitTime;

    if (explosions.length < 35) explosions.push(new ExplosionFX(e.x, e.y, "#cbd5e1"));
    playTone(600, 0.05, "sawtooth", -100, 0.08);

    if ((e.heavyBurnedTime || 0) >= 4) {
      safeKillEnemy(e, "#cbd5e1");
    }
    return;
  }

  // 2. 보호막 비행기: 연속 피격 2.5초 누적 시 파괴
  if (e.hasShield) {
    if (e.lastShieldHitTime) {
      const timeDelta = curHitTime - e.lastShieldHitTime;
      if (timeDelta > 0 && timeDelta <= 1.0) {
        e.shieldBurnedTime = (e.shieldBurnedTime || 0) + timeDelta;
      }
    }
    e.lastShieldHitTime = curHitTime;

    e.freezeTimer = 0.07;
    e.vx = 0;
    if (explosions.length < 35) explosions.push(new ExplosionFX(e.x, e.y, "#00f5ff"));
    playTone(820, 0.05, "triangle", 0, 0.06);

    if ((e.shieldBurnedTime || 0) >= 2.5) {
      safeKillEnemy(e);
    }
  } else {
    e.hp -= dmg;
    if (e.hp <= 0) safeKillEnemy(e);
    else if (explosions.length < 35) explosions.push(new ExplosionFX(e.x, e.y, "#ff007f"));
  }
}

class BossEnemy {
  constructor() {
    this.x = LOGICAL_WIDTH / 2;
    this.y = -80;
    this.targetY = 110;
    this.maxHp = 40;
    this.hp = 40;
    this.radius = 58;
    this.isFullyEntered = false;
    this.vx = 2.4;
    this.lastFireTime = 0.0;
    this.spawnTime = performance.now() / 1000;
    this.lastDescendStepTime = 0;
  }
  update(dt, curTime, missiles) {
    if (!this.isFullyEntered) {
      this.y += 1.8 * (dt * 60);
      if (this.y >= this.targetY) {
        this.y = this.targetY;
        this.isFullyEntered = true;
        this.lastFireTime = curTime;
        this.lastDescendStepTime = curTime;
      }
    } else {
      this.x += this.vx * (dt * 60);
      const minX = this.radius + 15;
      const maxX = LOGICAL_WIDTH - this.radius - 15;
      if (this.x <= minX) {
        this.x = minX;
        this.vx = Math.abs(this.vx);
      } else if (this.x >= maxX) {
        this.x = maxX;
        this.vx = -Math.abs(this.vx);
      }

      const aliveDuration = curTime - this.spawnTime;
      const maxBossY = LOGICAL_HEIGHT * 0.55;
      if (aliveDuration >= 60.0) {
        if (curTime - this.lastDescendStepTime >= 3.0) {
          this.lastDescendStepTime = curTime;
          if (this.targetY < maxBossY) {
            this.targetY = Math.min(maxBossY, this.targetY + this.radius * 2);
            playTone(220, 0.25, "sawtooth", -80, 0.15);
          }
        }
      }

      if (this.y < this.targetY) {
        this.y = Math.min(this.targetY, this.y + 1.2 * (dt * 60));
      }

      if (curTime - this.lastFireTime >= 3.0) {
        this.lastFireTime = curTime;
        missiles.push(new Bullet(this.x - 22, this.y + 45, -0.6, 5.5, 1, 6, "DEFAULT"));
        missiles.push(new Bullet(this.x + 22, this.y + 45, 0.6, 5.5, 1, 6, "DEFAULT"));
        playTone(300, 0.15, "sawtooth", -150, 0.08);
      }
    }
  }

  draw(curTime) {
    ctx.save();
    ctx.translate(this.x, this.y);
    drawVectorBoss(ctx, curTime);
    ctx.restore();

    const barW = 180;
    const hpW = Math.floor(barW * Math.max(0, this.hp / this.maxHp));
    ctx.fillStyle = "#303045";
    ctx.fillRect(this.x - barW / 2, this.y - this.radius - 18, barW, 6);
    ctx.fillStyle = "#ff2d2d";
    ctx.fillRect(this.x - barW / 2, this.y - this.radius - 18, hpW, 6);
  }
}

let hedgehogLauncher = {
  active: false,

  flashAlpha: 0,

};

function drawHedgehogLauncher(c, curTime) {
  if (!hedgehogLauncher.active) return;
  const wanderX = hedgehogLauncher.x + Math.sin(curTime * 1.8) * 18;
  const wanderY = hedgehogLauncher.y + Math.cos(curTime * 2.4) * 8;

  hedgehogLauncher.centerX = wanderX;
  hedgehogLauncher.centerY = wanderY;

  c.save();
  c.translate(wanderX, wanderY);
  c.scale(0.7, 0.7);

  const auraPulse = Math.sin(curTime * 16.0) * 4 + 18;
  c.strokeStyle = "rgba(0, 245, 255, 0.6)";
  c.lineWidth = 2.0;
  c.beginPath(); c.arc(0, 0, auraPulse + 4, 0, Math.PI * 2); c.stroke();

  const barrelCount = 10;
  for (let i = 0; i < barrelCount; i++) {
    const ang = (-160 + i * (140 / (barrelCount - 1))) * (Math.PI / 180);
    const blen = 22;
    const bx = Math.cos(ang) * blen;
    const by = Math.sin(ang) * blen;

    c.strokeStyle = "#475569";
    c.lineWidth = 3.5;
    c.beginPath();
    c.moveTo(0, 0);
    c.lineTo(bx, by);
    c.stroke();

    c.fillStyle = "#00f5ff";
    c.beginPath();
    c.arc(bx, by, 2, 0, Math.PI * 2);
    c.fill();

    const chargePulse = Math.sin(curTime * 25.0 + i) * 2 + 3;
    c.fillStyle = (i % 2 === 0) ? "#ffe600" : "#ff007f";
    c.beginPath();
    c.arc(bx, by, chargePulse, 0, Math.PI * 2);
    c.fill();
  }

  c.fillStyle = "#0f172a";
  c.strokeStyle = "#00f5ff";
  c.lineWidth = 3.0;
  c.beginPath();
  c.arc(0, 0, 18, 0, Math.PI * 2);
  c.fill();
  c.stroke();

  const pulseR = 7 + Math.sin(curTime * 15.0) * 2.5;
  c.fillStyle = "#ffe600";
  c.beginPath();
  c.arc(0, 0, pulseR, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

function triggerSlotSequence() {
  if (isNukingTransition) return;
  isNukingTransition = true;
  hedgehogLauncher.isExecutingNuke = true;
  hedgehogLauncher.flashAlpha = 1.0;
  hedgehogLauncher.timeStopTimer = 2.0;

  bullets = [];
  bossMissiles = [];
  homingMissiles = [];
  stationaryLasers = [];
  activeLasers = [];

  playTone(800, 0.35, "sawtooth", -300, 0.15);

  let validTargets = [];
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (!e.isDead && e.hp > 0 && e.y >= -20) validTargets.push({ type: "ENEMY", obj: e, x: e.x, y: e.y });
  }

  validTargets.sort((a, b) => b.y - a.y);
  const colors = ["#00f5ff", "#ff007f", "#39ff14", "#ffe600", "#bf00ff", "#ff5500", "#ffffff"];

  if (validTargets.length === 0) {
    setTimeout(finishNukeSequence, 1500);
    return;
  }

  const totalFireDuration = 1.0;
  const batchSize = Math.min(4, Math.max(1, Math.ceil(validTargets.length / 8)));
  const totalBatches = Math.ceil(validTargets.length / batchSize);
  const batchInterval = totalFireDuration / totalBatches;

  for (let b = 0; b < totalBatches; b++) {
    const currentBatch = validTargets.slice(b * batchSize, (b + 1) * batchSize);
    setTimeout(() => {
      const now = performance.now() / 1000;
      currentBatch.forEach((tgt, subIdx) => {
        const c = colors[(b * batchSize + subIdx) % colors.length];
        nukeBeamBeams.push({
          sx: hedgehogLauncher.centerX || hedgehogLauncher.x,
          sy: hedgehogLauncher.centerY || hedgehogLauncher.y,
          tx: tgt.x, ty: tgt.y,
          color: c, startTime: now, duration: 0.21
        });

        if (tgt.type === "ENEMY") {
          const e = tgt.obj;
          e.hasShield = false;
          safeKillEnemy(e, c, true); // 고슴도치 처치 플래그 true 전달 (게이지 미충전)
        }

        playTone(950 + ((b + subIdx) % 5) * 80, 0.12, "sawtooth", -350, 0.14);
      });
    }, b * (batchInterval * 1000));
  }

  setTimeout(finishNukeSequence, 1600);
}

function finishNukeSequence() {
  enemies = enemies.filter(e => !e.isDead && e.hp > 0);
  meteorManager.meteors = meteorManager.meteors.filter(m => m.active);
  nukeBeamBeams = [];
  isNukingTransition = false;
  hedgehogLauncher.active = false;
  hedgehogLauncher.isExecutingNuke = false;

}

function getCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  if (!rect || rect.width <= 0 || rect.height <= 0) return { x: LOGICAL_WIDTH / 2, y: LOGICAL_HEIGHT / 2 };
  const scaleX = LOGICAL_WIDTH / rect.width;
  const scaleY = LOGICAL_HEIGHT / rect.height;
  const rawX = (clientX - rect.left) * scaleX;
  const rawY = (clientY - rect.top) * scaleY;
  const x = Number.isFinite(rawX) ? Math.max(10, Math.min(LOGICAL_WIDTH - 10, rawX)) : LOGICAL_WIDTH / 2;
  const y = Number.isFinite(rawY) ? Math.max(10, Math.min(LOGICAL_HEIGHT - 10, rawY)) : LOGICAL_HEIGHT / 2;
  return { x, y };
}

      randomPickResult = {

}

function getPerimeterPoint(box, progress) {
  const total = (box.w + box.h) * 2;
  let d = ((progress % 1.0) + 1.0) % 1.0 * total;

  if (d <= box.w) return { x: box.x + d, y: box.y };
  d -= box.w;
  if (d <= box.h) return { x: box.x + box.w, y: box.y + d };
  d -= box.h;
  if (d <= box.w) return { x: box.x + box.w - d, y: box.y + box.h };
  d -= box.w;
  return { x: box.x, y: box.y + box.h - d };
}

function getWeightedMultiplierItem() {
  const types = [
    { type: "PWR", labelPrefix: "POWER", col: "#ff0080" },
    { type: "MSL", labelPrefix: "MISSILE", col: "#00f5ff" },
    { type: "RATE", labelPrefix: "RATE", col: "#ffe600" }
  ];
  const t = types[Math.floor(Math.random() * types.length)];
  const r = Math.random();
  let val = 1;
  if (r < 0.50) val = 1;
  else if (r < 0.80) val = 2;
  else val = 3;
  const multText = val > 1 ? ` (x${val})` : "";
  return { type: t.type, val: val, label: `${t.labelPrefix} +${val}${multText}`, col: t.col };
}

function generateWeightedRoulettePool(length = 24) {
  const pool = [];
  for (let i = 0; i < length; i++) {
    let item;
    let attempts = 0;
    do {
      item = getWeightedMultiplierItem();
      attempts++;
    } while (pool.length > 0 && pool[pool.length - 1].label === item.label && attempts < 10);
    pool.push(item);
  }
  return pool;
}

  try {

      if (activeCount < 3 && Math.random() < 0.45) {
        for (let i = 0; i < comets.length; i++) {
          if (!comets[i].active) { comets[i].spawn(); break; }
        }
      }
    }
    for (let i = 0; i < comets.length; i++) { comets[i].update(dt); comets[i].draw(); }

    for (let i = explosions.length - 1; i >= 0; i--) {
      explosions[i].update(dt);
      if (explosions[i].life <= 0) explosions.splice(i, 1);
    }
    for (let i = rockDebrisList.length - 1; i >= 0; i--) {
      rockDebrisList[i].update(dt);
      if (rockDebrisList[i].life <= 0) rockDebrisList.splice(i, 1);
    }
    for (let i = missileShadows.length - 1; i >= 0; i--) {
      missileShadows[i].update(dt);
      if (missileShadows[i].life <= 0) missileShadows.splice(i, 1);
    }
    for (let i = hitImpacts.length - 1; i >= 0; i--) {
      hitImpacts[i].update(dt);
      if (hitImpacts[i].life <= 0) hitImpacts.splice(i, 1);
    }
    for (let i = suckingEntities.length - 1; i >= 0; i--) {

      if (suckingEntities[i].life <= 0) suckingEntities.splice(i, 1);
    }
    for (let i = blackHoles.length - 1; i >= 0; i--) {

          ctx.fillStyle = "#00f5ff";
          ctx.fillText(c.sub, 115, c.y + 35);

          const maxVal = Math.max(c.p, c.m, c.r);
          const isMaxP = (c.p === maxVal);
          const isMaxM = (c.m === maxVal && !isMaxP);
          const isMaxR = (c.r === maxVal && !isMaxP && !isMaxM);

          let xOffset = 115;
          const renderStat = (label, val, isHigh) => {
            ctx.font = isHigh ? `bold 14px ${FONT_FAMILY}` : `12px ${FONT_FAMILY}`;
            ctx.fillStyle = isHigh ? "#ffe600" : "#a0b0c8";
            const txtStr = `${label} ${val}`;
            ctx.fillText(txtStr, xOffset, c.y + 58);
            xOffset += ctx.measureText(txtStr).width + 8;
            ctx.font = `12px ${FONT_FAMILY}`;
            ctx.fillStyle = "#4a5a70";
            ctx.fillText("|", xOffset, c.y + 58);
            xOffset += 10;
          };

          renderStat("PWR", c.p, isMaxP);
          renderStat("MSL", c.m, isMaxM);
          ctx.font = isMaxR ? `bold 14px ${FONT_FAMILY}` : `12px ${FONT_FAMILY}`;
          ctx.fillStyle = isMaxR ? "#ffe600" : "#a0b0c8";
          ctx.fillText(`RATE ${c.r}`, xOffset, c.y + 58);
          ctx.restore();
        }

        // 1. 글로벌 탑 10 랭킹 보드 (위로 이동, Y: 480 ~ 665)
        const t10Y = 480;
        ctx.save();
        ctx.fillStyle = "rgba(10, 15, 32, 0.85)";
        drawRoundRect(ctx, 35, t10Y, LOGICAL_WIDTH - 70, 185, 10);
        ctx.fill();
        ctx.strokeStyle = "#00f5ff";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = "#00f5ff";
        ctx.font = `bold 13px ${FONT_FAMILY}`;
        ctx.textAlign = "center";
        ctx.fillText("★ GLOBAL TOP 10 PLAYERS ★", LOGICAL_WIDTH / 2, t10Y + 18);

        ctx.font = `bold 12px ${FONT_FAMILY}`;
        if (top10List.length === 0) {
          ctx.fillStyle = "#a0b0c8";
          ctx.fillText("WAITING FOR RECORDS...", LOGICAL_WIDTH / 2, t10Y + 90);
        } else {
          const showLen = Math.min(10, top10List.length);
          for (let idx = 0; idx < showLen; idx++) {
            const item = top10List[idx];
            const rowY = Math.round(t10Y + 34 + idx * 15);
            
            ctx.textAlign = "left";
            ctx.fillStyle = idx === 0 ? "#ffe600" : (idx < 3 ? "#00f5ff" : "#ffffff");
            ctx.fillText(`${idx + 1}. [${item.country}] ${item.name}`, 44, rowY);
            
            ctx.textAlign = "right";
            const shipLabel = item.ship ? `${item.ship}  ` : "";
            ctx.fillText(`${shipLabel}${item.score} PTS`, LOGICAL_WIDTH - 44, rowY);
          }
        }
        ctx.restore();

        // 2. 최근 5일간 일일 플레이 횟수 표 (탑 10 아래로 이동, Y: 675 ~ 729)
        const statsBoxY = 675;
        ctx.save();
        ctx.fillStyle = "rgba(10, 16, 32, 0.88)";
        drawRoundRect(ctx, 35, statsBoxY, LOGICAL_WIDTH - 70, 54, 8);
        ctx.fill();
        ctx.strokeStyle = "rgba(0, 245, 255, 0.4)";
        ctx.lineWidth = 1.0;
        ctx.stroke();

        ctx.textAlign = "left";
        ctx.fillStyle = "#00f5ff";
        ctx.font = `bold 10px ${FONT_FAMILY}`;
        ctx.fillText("RECENT 7 DAYS PLAY COUNT", 45, statsBoxY + 16);

        // 7분할 열 (그리드 구분선 및 데이터)
        const colW = (LOGICAL_WIDTH - 70) / 7;
        const days = dailyPlayCounts5;

        for (let di = 0; di < 7; di++) {
          const cx = 35 + colW * di + colW / 2;
          const curData = (days && days[di]) ? days[di] : { date: "-", count: 0 };
          ctx.textAlign = "center";
          
          // 날짜 레이블 (오늘: #ffe600, 이전: #94a3b8) - 폰트 한 단계 확대 (8.5px -> 10px)
          ctx.fillStyle = (di === 6) ? "#ffe600" : "#94a3b8";
          ctx.font = `bold 10px ${FONT_FAMILY}`;
          ctx.fillText(curData.date || "-", cx, statsBoxY + 31);
          
          // 횟수 - 폰트 한 단계 확대 (10px -> 11.5px)
          ctx.fillStyle = (di === 6) ? "#00f5ff" : "#ffffff";
          ctx.font = `bold 11.5px ${FONT_FAMILY}`;
          ctx.fillText(`${curData.count}회`, cx, statsBoxY + 46);

          if (di < 6) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
            ctx.beginPath();
            ctx.moveTo(35 + colW * (di + 1), statsBoxY + 22);
            ctx.lineTo(35 + colW * (di + 1), statsBoxY + 48);
            ctx.stroke();
          }
        }
        ctx.restore();

        // 3. 실시간 플레이 인원 문구 (최근 5일 표 오른쪽 아래 화면 최하단, Y: 745)
        ctx.save();
        ctx.textAlign = "right";
        ctx.fillStyle = "#00f5ff";
        ctx.font = `bold 12px ${FONT_FAMILY}`;
        ctx.fillText(`PLAYING NOW: ${activePlayerCount} PILOT${activePlayerCount > 1 ? "S" : ""}`, LOGICAL_WIDTH - 35, statsBoxY + 70);
        ctx.restore();

        ctx.textAlign = "left";
        ctx.fillStyle = "#70809b";
        ctx.font = `bold 11px ${FONT_FAMILY}`;
        ctx.fillText(VERSION_STR, 10, LOGICAL_HEIGHT - 12);
      } else if (gameState === 4) {
      const elapsedShowcase = curTime - legendShowcaseStartTime;
      const remainSec = Math.max(0, (3.0 - elapsedShowcase).toFixed(1));
      const cx = LOGICAL_WIDTH / 2;
      const cy = LOGICAL_HEIGHT / 2 - 40;

      ctx.save();
      ctx.translate(cx, cy);
      drawVectorPlayer(ctx, 4, "#ffd700", 2.2);
      ctx.restore();

      ctx.textAlign = "center";
      ctx.fillStyle = "#ffd700";
      ctx.font = `bold 20px ${FONT_FAMILY}`;
      ctx.fillText("CONGRATULATIONS!", cx, cy + 100);
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold 16px ${FONT_FAMILY}`;
      ctx.fillText("LEGEND SHIP UNLOCKED!", cx, cy + 130);
      ctx.fillStyle = "#00f5ff";
      ctx.font = `14px ${FONT_FAMILY}`;
      ctx.fillText(`GAME STARTS IN ${remainSec}s`, cx, cy + 170);

      if (elapsedShowcase >= 3.0) initBattleState();

    } else if (gameState === 1) {
      // [Stop 일시정지 로직 처리]
    if (isGameStopped) {
      // 완전 정지 상태 렌더링 유지 (업데이트 스킵)
      drawDynamicDeepSpaceBackground(ctx, 0);
      // ... 아래 렌더링 코드로 직행
    }

    if (stopResumeCountdown > 0) {
      stopResumeCountdown = Math.max(0, stopResumeCountdown - dt);
      if (stopResumeCountdown <= 0) {
        stopResumeCountdown = 0.0;
        isGameStopped = false; // 정지 상태 완전 해제 (재시작 확정)
        stopSpeedRestoreTimer = 3.0; // 3초간 50% -> 100% 점진 회복 시작
      }
    }

    // 복귀 시 50% 시작 -> 3초간 100%로 점진 회복 배율 계산
    let resumeSpeedScale = 1.0;
    if (stopSpeedRestoreTimer > 0) {
      stopSpeedRestoreTimer = Math.max(0, stopSpeedRestoreTimer - dt);
      const restoreProgress = 1.0 - (stopSpeedRestoreTimer / 3.0); // 0.0 -> 1.0
      resumeSpeedScale = 0.50 + restoreProgress * 0.50; // 0.5 -> 1.0
    }

    const effectiveDt = (isGameStopped || stopResumeCountdown > 0) ? 0 : (dt * resumeSpeedScale);

    // Stop 게이지 충전 (게임 진행 중에만 20초 동안 충전)
    if (!isGameStopped && stopResumeCountdown <= 0 && stopGaugeTime < STOP_GAUGE_MAX) {
      stopGaugeTime = Math.min(STOP_GAUGE_MAX, stopGaugeTime + dt);
    }

    const isFrozen = (hedgehogLauncher.timeStopTimer > 0 || isGameStopped || stopResumeCountdown > 0);
    if (hedgehogLauncher.timeStopTimer > 0) {
      hedgehogLauncher.timeStopTimer = Math.max(0, hedgehogLauncher.timeStopTimer - dt);
    } else if (!isGameStopped && stopResumeCountdown <= 0) {
      inGameElapsedTime += effectiveDt;
    }
    const elapsed = inGameElapsedTime;

      if (player && player.isAlive && !isFrozen && !playerDeathCinematic.active) {
        let kx = 0, ky = 0;
        if (keysPressed["arrowleft"] || keysPressed["a"] || keysPressed["keya"]) kx -= 1;
        if (keysPressed["arrowright"] || keysPressed["d"] || keysPressed["keyd"]) kx += 1;
        if (keysPressed["arrowup"] || keysPressed["w"] || keysPressed["keyw"]) ky -= 1;
        if (keysPressed["arrowdown"] || keysPressed["s"] || keysPressed["keys"]) ky += 1;

        if (kx !== 0 || ky !== 0) {
          const moveDist = CONFIG.BASE_PLAYER_SPEED * 60 * dt;
          player.targetX = Math.max(player.radius + 10, Math.min(LOGICAL_WIDTH - player.radius - 10, player.targetX + kx * moveDist));
          player.targetY = Math.max(player.radius + 10, Math.min(LOGICAL_HEIGHT - player.radius - 10, player.targetY + ky * moveDist));
        }
      }

      if (!isNukingTransition && !isFrozen && player && player.isAlive && !playerDeathCinematic.active) {
        player.update(dt, enemies, bullets);
        player.shoot(curTime, bullets);
      }

      if (meteorManager && player && !isFrozen) {
        meteorManager.update(dt, elapsed, player, bullets, enemies);
      }

      let speedScale = (elapsed < 60.0) ? 0.70 : (elapsed <= 90.0 ? 0.70 + ((elapsed - 60.0) / 30.0) * 0.30 : 1.0);
      let widthScale = speedScale;
      const hpScale = (elapsed < 60.0) ? 0.7 : 1.0;

      let spawnInterval = CONFIG.MAX_SPAWN_INTERVAL * 1.8;
      if (elapsed >= 60.0 && elapsed < 80.0) {
        const factor = (elapsed - 60.0) / 20.0;
        spawnInterval = (CONFIG.MAX_SPAWN_INTERVAL * 1.8) * (1.0 - factor * 0.45);
      } else if (elapsed >= 80.0) {
        spawnInterval = Math.max(CONFIG.MIN_SPAWN_INTERVAL, (CONFIG.MAX_SPAWN_INTERVAL * 1.0) * Math.pow(1 / 1.10, Math.floor((elapsed - 80.0) / 20.0)));
      }

      if (!isNukingTransition && !isFrozen && elapsed - lastSpawnTime > spawnInterval) {
        lastSpawnTime = elapsed;
        // [적 비행기 체력 증가 수준] (20초당 1.20배로 세팅, 초반에는 1.4였음)
        let hpMultiplier = (elapsed >= 60.0) ? Math.pow(1.2, Math.floor((elapsed - 60.0) / 20.0)) : 1.0;
        const calculatedHp = Math.max(1, Math.round((2 + Math.random() * 3) * hpScale * hpMultiplier));

        enemies.push(new Enemy(calculatedHp, CONFIG.BASE_ENEMY_SPEED + Math.min(1.0, elapsed / 180.0) * 3.5, Math.floor(Math.random() * 4), false, false));

        if (elapsed >= 60.0) {
          let activeShieldCount = 0;
          for (let i = 0; i < enemies.length; i++) if (enemies[i].hasShield && !enemies[i].isDead && enemies[i].hp > 0) activeShieldCount++;
          if (activeShieldCount === 0) {
            const spawnBatch = Math.random() < 0.5 ? 1 : 1;
            for (let s = 0; s < spawnBatch; s++) {
              enemies.push(new Enemy(calculatedHp, CONFIG.BASE_ENEMY_SPEED + 1.0, Math.floor(Math.random() * 4), true, false));
            }
          }
        }
      }

      if (elapsed >= 20.0) {
        let activeHeavyCount = 0;
        for (let i = 0; i < enemies.length; i++) if (enemies[i].isHeavy && !enemies[i].isDead && enemies[i].hp > 0) activeHeavyCount++;
        if (activeHeavyCount === 0 && !window.heavyDelayedSpawnTimer) {
          const spawnBatch = Math.random() < 0.5 ? 1 : 2;
          const heavySpeed = CONFIG.BASE_ENEMY_SPEED * 0.50;
          const heavyHp = 10;
          const firstX = 40 + Math.random() * (LOGICAL_WIDTH - 80);
          enemies.push(new Enemy(heavyHp, heavySpeed, Math.floor(Math.random() * 5), false, true, firstX));

          if (spawnBatch === 2) {
            window.heavyDelayedSpawnTimer = true;
            setTimeout(() => {
              window.heavyDelayedSpawnTimer = false;
              if (gameState === 1) {
                let secondX;
                let attempts = 0;
                do {
                  secondX = 40 + Math.random() * (LOGICAL_WIDTH - 80);
                  attempts++;
                } while (Math.abs(secondX - firstX) < 120 && attempts < 20);
                enemies.push(new Enemy(heavyHp, heavySpeed, Math.floor(Math.random() * 5), false, true, secondX));
              }
            }, 5000);
          }
        }
      }

      if (!currentBoss && elapsed >= nextBossTargetTime && !isFrozen) {
        currentBoss = new BossEnemy();
        nextBossTargetTime += 90.0;
      }
      if (currentBoss && !isFrozen) currentBoss.update(dt, curTime, bossMissiles);

      for (let i = bossDropItems.length - 1; i >= 0; i--) {
        const it = bossDropItems[i];
        if (!isFrozen) it.update(dt);
        if (it.y > LOGICAL_HEIGHT + 30) { bossDropItems.splice(i, 1); continue; }
        if (player && player.isAlive) {
          const dSq = (player.x - it.x) * (player.x - it.x) + (player.y - it.y) * (player.y - it.y);
          const rSum = player.radius + it.radius;
          if (dSq < rSum * rSum) {
            const itemType = it.getType(curTime);
            if (itemType === "P") player.powerStat += 3;
            else if (itemType === "M") player.missileStat += 3;
            else if (itemType === "D") player.fireRateStat += 3;
            bossDropItems.splice(i, 1);
            playTone(784, 0.2, "triangle", 150, 0.12);
          }
        }
      }

      if (!isFrozen) {
        for (let i = bullets.length - 1; i >= 0; i--) {
          bullets[i].update(dt);
          if (bullets[i].y <= -20 || bullets[i].x <= -20 || bullets[i].x >= LOGICAL_WIDTH + 20) bullets.splice(i, 1);
        }

        for (let i = homingMissiles.length - 1; i >= 0; i--) {
          homingMissiles[i].update(dt, enemies);
          // y >= LOGICAL_HEIGHT + 30 (하단 이탈) 추가하여 화면 밖 유령 미사일 즉시 정리
          if (homingMissiles[i].life <= 0 || homingMissiles[i].y <= -20 || homingMissiles[i].y >= LOGICAL_HEIGHT + 30 || homingMissiles[i].x <= -20 || homingMissiles[i].x >= LOGICAL_WIDTH + 20) {
            homingMissiles.splice(i, 1);
          }
        }

        // 미사일 파편 수명 및 적 충돌 업데이트
        for (let i = missileShards.length - 1; i >= 0; i--) {
          missileShards[i].update(dt, enemies);
          if (missileShards[i].life <= 0) missileShards.splice(i, 1);
        }

        for (let i = stationaryLasers.length - 1; i >= 0; i--) {
          stationaryLasers[i].update(dt, enemies);
          if (stationaryLasers[i].life <= 0) stationaryLasers.splice(i, 1);
        }

        for (let i = activeLasers.length - 1; i >= 0; i--) {
          activeLasers[i].life -= dt;
          if (activeLasers[i].life <= 0) activeLasers.splice(i, 1);
        }

        for (let i = bossMissiles.length - 1; i >= 0; i--) {
          const bm = bossMissiles[i];
          bm.update(dt);
          if (player && player.isAlive && player.shieldRemain > 0) {
            const shieldDist = player.radius + 32;
            const bdx = bm.x - player.x;
            const bdy = bm.y - player.y;
            const bdistSq = bdx * bdx + bdy * bdy;
            const hitR = shieldDist + bm.radius;
            if (bdistSq < hitR * hitR) {
              const bAngle = Math.atan2(bdy, bdx);
              bm.vx = Math.cos(bAngle) * 8.0;
              bm.vy = Math.sin(bAngle) * 8.0;
              playTone(700, 0.05, "sine", 100, 0.08);
            }
          }
          if (bm.y >= LOGICAL_HEIGHT + 30 || bm.y <= -50 || bm.x <= -50 || bm.x >= LOGICAL_WIDTH + 50) {
            bossMissiles.splice(i, 1);
          }
        }
      }

      for (let mi = homingMissiles.length - 1; mi >= 0; mi--) {
        const m = homingMissiles[mi];
        if (m.y <= -20 || m.y >= LOGICAL_HEIGHT + 30 || m.x <= -30 || m.x >= LOGICAL_WIDTH + 30) {
          homingMissiles.splice(mi, 1);
          continue;
        }

        for (let ei = enemies.length - 1; ei >= 0; ei--) {
          const e = enemies[ei];
          if (!e || e.y < 20 || e.isDead || e.hp <= 0 || e.isBeingSucked) continue;
          // Y축 거리 오타 정상 수정: (m.y - e.y) * (m.y - e.y)
          const dSq = (m.x - e.x) * (m.x - e.x) + (m.y - e.y) * (m.y - e.y);
          const rSum = m.radius + e.radius;
          if (dSq < rSum * rSum) {
            const hitX = m.x;
            const hitY = m.y;
            const isType0Missile = m.isType0;
            const missileDamage = m.dmg;

            homingMissiles.splice(mi, 1);
            const wasDeadBefore = e.isDead;
            applyDamageToEnemy(e, missileDamage, "MISSILE_NEEDLE");

            // 미사일 레벨 확인: 16렙 이상 40%, 미만 30%
            const curMissileLv = player ? (player.missileStat || 1) : 1;
            const shardChance = (curMissileLv >= 16) ? 0.40 : 0.30;

            if (!wasDeadBefore && e.isDead && Math.random() < shardChance) {
              missileShards.push(new MissileShard(hitX, hitY, curMissileLv));
            }

            // 스플래시 타깃을 임시 배열로 먼저 확보한 뒤 데미지를 적용하여 배열 순회 중 인덱스 충돌 차단
            if (isType0Missile) {
              const splashR = 45;
              const splashDmg = missileDamage * 0.45;
              explosions.push(new ExplosionFX(hitX, hitY, "#00f5ff"));
              const splashTargets = [];
              for (let si = 0; si < enemies.length; si++) {
                const subE = enemies[si];
                if (subE && subE !== e && !subE.isDead && subE.hp > 0 && !subE.isBeingSucked) {
                  const sDistSq = (subE.x - hitX) * (subE.x - hitX) + (subE.y - hitY) * (subE.y - hitY);
                  if (sDistSq <= (splashR + subE.radius) * (splashR + subE.radius)) {
                    splashTargets.push(subE);
                  }
                }
              }
              for (let ti = 0; ti < splashTargets.length; ti++) {
                applyDamageToEnemy(splashTargets[ti], splashDmg, "MISSILE_NEEDLE");
              }
            }
            break;
          }
        }
      }

      // 1. 적 업데이트 및 플레이어 충돌 판정
      for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        if (!isFrozen) e.update(dt, elapsed, speedScale, widthScale);
        if (e.y > LOGICAL_HEIGHT + 40) { enemies.splice(ei, 1); continue; }

        if (player && player.isAlive && player.shieldRemain > 0 && e.y >= 20 && !e.isDead && !e.isBeingSucked) {
          const shieldDist = player.radius + 32;
          const edx = e.x - player.x;
          const edy = e.y - player.y;
          const curDistSq = edx * edx + edy * edy;
          const minDist = shieldDist + e.radius;
          if (curDistSq < minDist * minDist) {
            const pushAngle = Math.atan2(edy, edx);
            e.x = Math.max(e.radius, Math.min(LOGICAL_WIDTH - e.radius, player.x + Math.cos(pushAngle) * minDist));
            e.y = player.y + Math.sin(pushAngle) * minDist;
            e.vx = Math.cos(pushAngle) * 5.0;
          }
        }

        if (!isFrozen && player && player.isAlive && e.y >= 20 && !e.isDead && e.hp > 0 && !e.isBeingSucked) {
          const dSq = (player.x - e.x) * (player.x - e.x) + (player.y - e.y) * (player.y - e.y);
          const rSum = player.radius + e.radius;
          if (dSq < rSum * rSum) {
            if (player.shieldRemain <= 0) {
              triggerPlayerCinematicDeath(e.x, e.y);
              break;
            }
          }
        }
      }

      // 2. 탄환-적 충돌 및 스침 판정 (TWIN 탄환 근접 방전 추가)
      if (!isFrozen) {
        for (let bi = bullets.length - 1; bi >= 0; bi--) {
          const b = bullets[bi];
          let bulletRemoved = false;

          for (let ei = enemies.length - 1; ei >= 0; ei--) {
            const e = enemies[ei];
            if (!e || e.y < 20 || e.isDead || e.hp <= 0 || e.isBeingSucked) continue;

            const dSq = (b.x - e.x) * (b.x - e.x) + (b.y - e.y) * (b.y - e.y);
            const rSum = b.radius + e.radius;

            // 직격 충돌
            if (dSq < rSum * rSum) {
              if (b.isBlackHoleTrigger) {
                blackHoles.push(new BlackHole(b.x, b.y, 25));
              }
              if (b.bulletType === "TWIN") {
                const toAng = Math.atan2(b.y - e.y, b.x - e.x);
                triggerEnemyLightningShock(e.x + Math.cos(toAng) * (e.radius * 0.8), e.y + Math.sin(toAng) * (e.radius * 0.8), e);
              }
              bullets.splice(bi, 1);
              applyDamageToEnemy(e, b.dmg, b.bulletType);
              bulletRemoved = true;
              break;
            }

            // 트윈 번개탄 스침 감전 (비행기 폭 44px 이내 스쳐지날 때)
            if (b.bulletType === "TWIN" && !b.nearShockCooldown) {
              const nearDist = (player ? player.radius * 2 : 44) + e.radius;
              if (dSq <= nearDist * nearDist) {
                b.nearShockCooldown = true;
                const toAng = Math.atan2(b.y - e.y, b.x - e.x);
                triggerEnemyLightningShock(e.x + Math.cos(toAng) * (e.radius * 0.8), e.y + Math.sin(toAng) * (e.radius * 0.8), e);
                applyDamageToEnemy(e, b.dmg * 0.7, "TWIN"); // 스침 데미지 70% 부여
              }
            }
          }
          if (bulletRemoved) continue;
        }
      }

      // [항목 5] 원형 전자기 펄스 판정 (0.5초마다 파워 공격, 보스/돌맹이/혜성 제외)
      for (let fi = twinFieldBolts.length - 1; fi >= 0; fi--) {
        const fb = twinFieldBolts[fi];
        if (!fb || fb.type !== "ORB_EMP") continue;

        fb.elapsed += dt;
        let hitAny = false;

        for (let ei = enemies.length - 1; ei >= 0; ei--) {
          const e = enemies[ei];
          // 보스 및 돌맹이(isHeavy)는 즉사 대상에서 제외
          if (!e || e.isDead || e.hp <= 0 || e.isHeavy) continue;
          const dSq = (e.x - fb.x) * (e.x - fb.x) + (e.y - fb.y) * (e.y - fb.y);
          if (dSq <= (fb.radius + e.radius) * (fb.radius + e.radius)) {
            e.hasShield = false; // 보호막이 있어도 해제
            safeKillEnemy(e, "#00f5ff"); // 즉시 파괴
            hitAny = true;
          }
        }
        if (hitAny) {
          playExplosionSound(); // 폭발음 재생
        }

        // 1.8초 수명이 다하면 판정 종료 후 안전하게 제거
        if (fb.elapsed >= fb.totalDuration) {
          twinFieldBolts.splice(fi, 1);
        }
      }

      if (currentBoss && !isFrozen) {
        for (let bi = bullets.length - 1; bi >= 0; bi--) {
          const b = bullets[bi];
          const dSq = (b.x - currentBoss.x) * (b.x - currentBoss.x) + (b.y - currentBoss.y) * (b.y - currentBoss.y);
          const rSum = b.radius + currentBoss.radius;
          if (dSq < rSum * rSum) {
            hitImpacts.push(new BulletHitImpactFX(b.x, b.y, b.bulletType));
            if (b.isBlackHoleTrigger) {
              blackHoles.push(new BlackHole(b.x, b.y, 25));
            }
            const bossDmg = (b.bulletType === "TWIN") ? 0.5 : 1.0; // 트윈형은 보스 파괴 요구 타격수 2배
            bullets.splice(bi, 1);
            currentBoss.hp -= bossDmg;
            if (currentBoss.hp <= 0) {
              score += 100;
              bossDropItems.push(new BossDropItem(currentBoss.x, currentBoss.y));
              currentBoss = null;
              playExplosionSound();
              break;
            }
          }
        }
      }

      const gPct = Math.min(1.0, skillGauge / CONFIG.MAX_SKILL_GAUGE);
      if (gPct >= 0.85 && !hedgehogLauncher.active && !isNukingTransition) {
        hedgehogLauncher.active = true;
        hedgehogLauncher.x = LOGICAL_WIDTH - 85;
        hedgehogLauncher.y = LOGICAL_HEIGHT - 65;
      }
      if (skillGauge >= CONFIG.MAX_SKILL_GAUGE && !isNukingTransition) {
        skillGauge = 0.0;
        triggerSlotSequence();
      }

      for (let i = 0; i < missileShadows.length; i++) missileShadows[i].draw();
      for (let i = 0; i < bullets.length; i++) bullets[i].draw();
      for (let i = 0; i < homingMissiles.length; i++) homingMissiles[i].draw();
      for (let i = 0; i < missileShards.length; i++) missileShards[i].draw(); // 파편 드로잉 추가
      for (let i = 0; i < stationaryLasers.length; i++) stationaryLasers[i].draw();

      for (let i = 0; i < activeLasers.length; i++) {
        const l = activeLasers[i];
        ctx.save();
        const laserAlpha = (l.totalLife > 0) ? Math.max(0, Math.min(1.0, l.life / l.totalLife)) : 0;
        ctx.globalAlpha = laserAlpha;
        ctx.strokeStyle = "#00f5ff";
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(l.sx, l.sy); ctx.lineTo(l.tx, l.ty);
        ctx.stroke();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(l.sx, l.sy); ctx.lineTo(l.tx, l.ty);
        ctx.stroke();
        ctx.restore();
      }

      for (let i = 0; i < hitImpacts.length; i++) hitImpacts[i].draw();
      for (let i = 0; i < suckingEntities.length; i++) suckingEntities[i].draw();
      for (let i = 0; i < bossMissiles.length; i++) bossMissiles[i].draw();
      for (let i = 0; i < bossDropItems.length; i++) bossDropItems[i].draw(curTime);
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.isDead || e.hp <= 0) {
          enemies.splice(i, 1);
          continue;
        }
        if (!e.isBeingSucked) e.draw(curTime);
      }
      for (let i = 0; i < blackHoles.length; i++) blackHoles[i].draw();

      // 감전된 적 5줄기 번개 렌더링
      for (let i = 0; i < enemyLightningShocks.length; i++) {
        const es = enemyLightningShocks[i];
        const alpha = Math.max(0, es.life / es.totalLife);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (let k = 0; k < es.shocks.length; k++) {
          const pts = es.shocks[k];
          ctx.strokeStyle = "#00f5ff";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let p = 1; p < pts.length; p++) ctx.lineTo(pts[p].x, pts[p].y);
          ctx.stroke();

          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let p = 1; p < pts.length; p++) ctx.lineTo(pts[p].x, pts[p].y);
          ctx.stroke();
        }
        ctx.restore();
      }

      // [트윈 8렙 번개 구체] 초기 LightningBolt 이미지 및 페이드 방식 복원
      for (let i = 0; i < twinFieldBolts.length; i++) {
        const fb = twinFieldBolts[i];
        if (!fb || fb.type !== "ORB_EMP") continue;

        // 초기 원본 페이드 계산식 (1.8초 동안 점진적 소멸)
        const alpha = Math.max(0, 1.0 - (fb.elapsed / fb.totalDuration));

        ctx.save();
        ctx.translate(fb.x, fb.y);
        ctx.globalAlpha = alpha;

        // 1. 내부 플라즈마 오라 코어
        const pGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, fb.radius);
        pGrad.addColorStop(0, "rgba(255, 255, 255, 0.95)");
        pGrad.addColorStop(0.3, "rgba(0, 245, 255, 0.45)");
        pGrad.addColorStop(0.7, "rgba(0, 150, 255, 0.22)");
        pGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = pGrad;
        ctx.beginPath();
        ctx.arc(0, 0, fb.radius, 0, Math.PI * 2);
        ctx.fill();

        // 2. 외곽 네온 충격파 링 (투명도 rgba 0.7 적용)
        ctx.strokeStyle = "rgba(0, 245, 255, 0.7)";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, fb.radius, 0, Math.PI * 2);
        ctx.stroke();

        // 3. 지그재그 전격 아크 (6갈래)
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.8;
        for (let k = 0; k < 6; k++) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          let cx = 0, cy = 0;
          for (let s = 0; s < 5; s++) {
            cx += (Math.random() - 0.5) * (fb.radius * 0.8);
            cy += (Math.random() - 0.5) * (fb.radius * 0.8);
            ctx.lineTo(cx, cy);
          }
          ctx.stroke();
        }

        ctx.restore();
      }

      if (currentBoss) currentBoss.draw(curTime);
      if (meteorManager) {
        meteorManager.drawMeteors();
        meteorManager.drawWarning();
      }
      for (let i = 0; i < rockDebrisList.length; i++) rockDebrisList[i].draw();
      for (let i = 0; i < explosions.length; i++) explosions[i].draw();

      if (player && player.isAlive && !playerDeathCinematic.active) {
        player.draw(curTime);
      }

      updateAndDrawPlayerCinematic(dt);
      drawHedgehogLauncher(ctx, curTime);

      for (let i = nukeBeamBeams.length - 1; i >= 0; i--) {
        const b = nukeBeamBeams[i];
        if (curTime - b.startTime >= b.duration) { nukeBeamBeams.splice(i, 1); continue; }
        ctx.save();
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.moveTo(b.sx, b.sy); ctx.lineTo(b.tx, b.ty);
        ctx.stroke();
        ctx.restore();
      }

      if (hedgehogLauncher.flashAlpha > 0) {
        ctx.save();
        ctx.fillStyle = `rgba(255, 255, 255, ${hedgehogLauncher.flashAlpha})`;
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
        ctx.restore();
        hedgehogLauncher.flashAlpha = Math.max(0, hedgehogLauncher.flashAlpha - (dt / 0.3));
      }

      ctx.save();
      ctx.textAlign = "right";
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold 15px ${FONT_FAMILY}`;
      ctx.fillText(`SCORE: ${score}`, LOGICAL_WIDTH - 20, 25);
      ctx.fillStyle = "#ffe600";
      ctx.font = `13px ${FONT_FAMILY}`;
      ctx.fillText(`TIME: ${Math.floor(elapsed)}s`, LOGICAL_WIDTH - 20, 45);
      ctx.restore();

      // 스킬 3가지 텍스트 위치 (Stop 버튼 공간 확보를 위해 소폭 조정)
      const baseBottomY = LOGICAL_HEIGHT - 38;
      if (player) {
        ctx.font = `bold 13px ${FONT_FAMILY}`;
        ctx.textAlign = "left";
        ctx.fillStyle = "#ff007f";
        ctx.fillText(`POWER   : Lv.${Math.round(player.powerStat)}`, 14, baseBottomY - 32);
        ctx.fillStyle = "#00f5ff";
        ctx.fillText(`MISSILE : Lv.${Math.round(player.missileStat)}`, 14, baseBottomY - 17);
        ctx.fillStyle = "#ffe600";
        ctx.fillText(`RATE    : Lv.${Math.round(player.fireRateStat)}`, 14, baseBottomY - 2);
      }

      // [좌하단 Stop 일시정지 게이지 버튼 렌더링 - 높이 20% 증가: 16 -> 19.2px]
      const stopW = 110, stopH = 19.2, stopX = 14, stopY = LOGICAL_HEIGHT - 35;
      const stopPct = Math.min(1.0, stopGaugeTime / STOP_GAUGE_MAX);
      const isStopReady = (stopPct >= 1.0);

      ctx.save();
      // 배경 박스
      ctx.fillStyle = "#0a0f1d";
      drawRoundRect(ctx, stopX, stopY, stopW, stopH, 9);
      ctx.fill();

      // 충전 게이지 바
      if (stopW * stopPct > 2) {
        ctx.fillStyle = isStopReady ? (Math.floor(curTime * 10) % 2 === 0 ? "#00f5ff" : "#ffe600") : "rgba(0, 245, 255, 0.45)";
        drawRoundRect(ctx, stopX, stopY, stopW * stopPct, stopH, 9);
        ctx.fill();
      }

      // 외곽선 (100% 충전 시 네온 발광)
      ctx.strokeStyle = isStopReady ? "#00f5ff" : "rgba(0, 245, 255, 0.35)";
      ctx.lineWidth = isStopReady ? 2.0 : 1.0;
      if (isStopReady) {
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#00f5ff";
      }
      drawRoundRect(ctx, stopX, stopY, stopW, stopH, 9);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // STOP 문구 확대: bold 11px -> bold 12.5px
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold 12.5px ${FONT_FAMILY}`;
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 2.8;
      const stopLabel = isStopReady ? "★ STOP READY" : `STOP (${Math.floor(stopPct * 100)}%)`;
      ctx.strokeText(stopLabel, stopX + stopW / 2, stopY + stopH / 2 + 0.5);
      ctx.fillStyle = isStopReady ? "#ffffff" : "#cceeff";
      ctx.fillText(stopLabel, stopX + stopW / 2, stopY + stopH / 2 + 0.5);
      ctx.restore();

      // [우하단 스킬 충전 게이지 렌더링 - 일시정지 오버레이보다 먼저 렌더링되도록 위로 이동]
      const gw = 130, gh = 16, gx = LOGICAL_WIDTH - gw - 20, gy = LOGICAL_HEIGHT - 35;
      ctx.save();

      // 외곽 2중 네온 글로우
      ctx.strokeStyle = "rgba(0, 245, 255, 0.35)";
      ctx.lineWidth = 4;
      drawRoundRect(ctx, gx - 1, gy - 1, gw + 2, gh + 2, 9);
      ctx.stroke();

      ctx.strokeStyle = (gPct >= 0.85) ? (Math.floor(curTime * 15) % 2 === 0 ? "#ffffff" : "#00f5ff") : "#00f5ff";
      ctx.lineWidth = 1.5;
      drawRoundRect(ctx, gx, gy, gw, gh, 8);
      ctx.stroke();

      ctx.fillStyle = "#10162a";
      drawRoundRect(ctx, gx, gy, gw, gh, 8);
      ctx.fill();

      if (gw * gPct > 2) {
        ctx.fillStyle = "#00f5ff";
        drawRoundRect(ctx, gx, gy, gw * gPct, gh, 8);
        ctx.fill();

        // 85% 이상일 때 상향 기포/버블 이펙트
        if (gPct >= 0.85) {
          ctx.save();
          ctx.beginPath();
          drawRoundRect(ctx, gx, gy, gw * gPct, gh, 8);
          ctx.clip();
          for (let b = 0; b < 6; b++) {
            const bx = gx + ((curTime * (40 + b * 15) + b * 22) % (gw * gPct));
            const by = gy + gh - ((curTime * 30 + b * 7) % gh);
            const br = 1.5 + (b % 3);
            ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
            ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
        }
      }

      ctx.textAlign = "left";
      ctx.fillStyle = (gPct >= 0.85 && Math.floor(curTime * 10) % 2 === 0) ? "#ffffff" : "#00f5ff";
      ctx.font = `bold 12px ${FONT_FAMILY}`;
      ctx.fillText(gPct >= 0.85 ? "★ SKILL READY ★" : "SKILL GAUGE", gx, gy - 6);
      ctx.restore();

      // [일시정지 중 오버레이 & 3초 카운트다운 안내 - 맨 마지막에 그려 모든 요소를 덮음]
      if (isGameStopped || stopResumeCountdown > 0) {
        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        ctx.textAlign = "center";
        if (stopResumeCountdown > 0) {
          // 3초 카운트다운 표시
          const countNum = Math.ceil(stopResumeCountdown);
          ctx.fillStyle = "#ffe600";
          ctx.font = `bold 72px ${FONT_FAMILY}`;
          ctx.fillText(`${countNum}`, LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2 - 20);
          ctx.font = `bold 16px ${FONT_FAMILY}`;
          ctx.fillStyle = "#00f5ff";
          ctx.fillText("RESUMING BATTLE...", LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2 + 50);
        } else {
          // 정지 상태 안내 문구
          ctx.fillStyle = "#00f5ff";
          ctx.font = `bold 32px ${FONT_FAMILY}`;
          ctx.fillText("GAME PAUSED", LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2 - 20);
          ctx.fillStyle = "#ffffff";
          ctx.font = `bold 14px ${FONT_FAMILY}`;
          ctx.fillText("TAP SCREEN TO RESUME", LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2 + 30);
        }
        ctx.restore();
      }

    } else if (gameState === 2) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#00f5ff";
      ctx.font = `bold 16px ${FONT_FAMILY}`;
      ctx.fillText("PILOT SKILL STATUS", LOGICAL_WIDTH / 2, 48);

      const inspectBox = { x: 35, y: 56, w: 380, h: 210 };
      ctx.save();
      ctx.fillStyle = "rgba(6, 12, 28, 0.94)";
      drawRoundRect(ctx, inspectBox.x, inspectBox.y, inspectBox.w, inspectBox.h, 10);
      ctx.fill();
      ctx.strokeStyle = "rgba(0, 245, 255, 0.3)";
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.textAlign = "left";
      ctx.fillStyle = "#00f5ff";
      ctx.font = `bold 10px ${FONT_FAMILY}`;
      ctx.fillText("SYSTEM DIAGNOSTIC // ACTIVE MODULE ANALYSIS", inspectBox.x + 14, inspectBox.y + 18);

      const shipCenterX = inspectBox.x + 85;
      const shipCenterY = inspectBox.y + 115;
      const cellSize = 12;
      const cols = 10;
      const rows = 13;
      const planeGridW = cols * cellSize;
      const planeGridH = rows * cellSize;
      const gridLeft = Math.round(shipCenterX - planeGridW / 2);
      const gridTop = inspectBox.y + 36 + Math.round((160 - planeGridH) / 2);

      // [레이어 1] 배경 바닥: 초록색 분석 모눈종이(그리드)
      ctx.save();
      ctx.strokeStyle = "rgba(0, 255, 102, 0.28)";
      ctx.lineWidth = 1.0;
      ctx.strokeRect(gridLeft, gridTop, planeGridW, planeGridH);
      ctx.beginPath();
      for (let c = 1; c < cols; c++) {
        const gx = gridLeft + c * cellSize;
        ctx.moveTo(gx, gridTop);
        ctx.lineTo(gx, gridTop + planeGridH);
      }
      for (let r = 1; r < rows; r++) {
        const gy = gridTop + r * cellSize;
        ctx.moveTo(gridLeft, gy);
        ctx.lineTo(gridLeft + planeGridW, gy);
      }
      ctx.stroke();

      // [레이어 2] 배경 스캔: 위아래로 움직이는 스캔 빔 (기체 뒤쪽 바닥에서 스캔)
      const planeScanY = gridTop + ((curTime * 50) % planeGridH);
      const scanBeamW = planeGridW - 4;
      const sGrad = ctx.createLinearGradient(shipCenterX - scanBeamW / 2, 0, shipCenterX + scanBeamW / 2, 0);
      sGrad.addColorStop(0, "rgba(0, 245, 255, 0)");
      sGrad.addColorStop(0.5, "rgba(0, 245, 255, 0.45)");
      sGrad.addColorStop(1, "rgba(0, 245, 255, 0)");
      ctx.fillStyle = sGrad;
      ctx.fillRect(shipCenterX - scanBeamW / 2, planeScanY, scanBeamW, 2);
      ctx.restore();

      // [레이어 3] 본체: 스캔 그리드 위에 선명하게 기체 드로잉
      ctx.save();
      ctx.translate(shipCenterX, shipCenterY);
      let shipCol = "#00f5ff";
      if (player && (player.name === "Legend" || player.pType === 4)) shipCol = "#ffd700";
      else if (player && player.pType === 1) shipCol = "#ff2244";
      else if (player && player.pType === 2) shipCol = "#00ff66";
      drawVectorPlayer(ctx, player ? player.pType : 0, shipCol, 1.35, 0, false);
      ctx.restore();

      // [레이어 4] 오버레이: 무기/엔진 분석 타깃 펄스 링 (최상단)
      ctx.save();
      ctx.globalAlpha = 0.70;

      const pPulse = Math.sin(curTime * 8) * 2 + 8;
      ctx.strokeStyle = "#ff007f";
      ctx.lineWidth = 1.68;
      const curPType = player ? player.pType : 0;
      if (curPType === 2) {
        const twinCannonOffsets = [-15, 15];
        for (let i = 0; i < twinCannonOffsets.length; i++) {
          ctx.beginPath();
          ctx.arc(shipCenterX + twinCannonOffsets[i], shipCenterY - 35, pPulse, 0, Math.PI * 2);
          ctx.stroke();
        }
      } else {
        const noseYOffset = (curPType === 4) ? -38 : ((curPType === 0) ? -34 : -32);
        ctx.beginPath();
        ctx.arc(shipCenterX, shipCenterY + noseYOffset, pPulse, 0, Math.PI * 2);
        ctx.stroke();
      }

      const mPulse = Math.sin(curTime * 10) * 2 + 8;
      ctx.strokeStyle = "#00f5ff";
      ctx.lineWidth = 1.4;
      const wingOffsets = (curPType === 2) ? [-24, 24] : [-35, 35];
      for (let i = 0; i < wingOffsets.length; i++) {
        const cx = shipCenterX + wingOffsets[i];
        const cy = shipCenterY + 5;
        ctx.strokeRect(cx - mPulse / 2, cy - mPulse / 2, mPulse, mPulse);
        ctx.beginPath();
        ctx.moveTo(cx - mPulse, cy); ctx.lineTo(cx + mPulse, cy);
        ctx.moveTo(cx, cy - mPulse); ctx.lineTo(cx, cy + mPulse);
        ctx.stroke();
      }

      const rPulse = Math.sin(curTime * 12) * 2 + 8;
      ctx.strokeStyle = "#ffe600";
      ctx.lineWidth = 1.4;
      ctx.fillStyle = "#ffe600";

      const engineOffsets = (curPType === 2) ? [-15, 15] : [-8, 8];
      for (let i = 0; i < engineOffsets.length; i++) {
        const ecx = shipCenterX + engineOffsets[i];
        const ecy = shipCenterY + 24;

        ctx.beginPath();
        ctx.arc(ecx, ecy, rPulse, 0, Math.PI * 2);
        ctx.stroke();

        const bLen = 5;
        const bDist = rPulse + 3;
        ctx.beginPath();
        ctx.moveTo(ecx - bDist + bLen, ecy - bDist); ctx.lineTo(ecx - bDist, ecy - bDist); ctx.lineTo(ecx - bDist, ecy - bDist + bLen);
        ctx.moveTo(ecx + bDist - bLen, ecy - bDist); ctx.lineTo(ecx + bDist, ecy - bDist); ctx.lineTo(ecx + bDist, ecy - bDist + bLen);
        ctx.moveTo(ecx - bDist, ecy + bDist - bLen); ctx.lineTo(ecx - bDist, ecy + bDist); ctx.lineTo(ecx - bDist + bLen, ecy + bDist);
        ctx.moveTo(ecx + bDist, ecy + bDist - bLen); ctx.lineTo(ecx + bDist, ecy + bDist); ctx.lineTo(ecx - bDist + bLen, ecy + bDist);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(ecx - 4, ecy + bDist + 2);
        ctx.lineTo(ecx + 4, ecy + bDist + 2);
        ctx.lineTo(ecx, ecy + bDist + 8);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      const rightX = inspectBox.x + 185;
      const modules = [
        { label: "CORE CANNON", lv: player ? Math.round(player.powerStat) : 1, col: "#ff0080", rgb: "255, 0, 128", y: inspectBox.y + 36, max: 20 },
        { label: "WING MISSILE", lv: player ? Math.round(player.missileStat) : 1, col: "#00f5ff", rgb: "0, 245, 255", y: inspectBox.y + 92, max: 20 },
        { label: "PLASMA DRIVE", lv: player ? Math.round(player.fireRateStat) : 1, col: "#ffe600", rgb: "255, 230, 0", y: inspectBox.y + 148, max: 20 }
      ];

      for (let i = 0; i < modules.length; i++) {
        const m = modules[i];
        ctx.save();
        ctx.fillStyle = "rgba(12, 20, 42, 0.92)";
        drawRoundRect(ctx, rightX, m.y, 180, 48, 6);
        ctx.fill();

        ctx.strokeStyle = `rgba(${m.rgb}, 0.60)`;
        ctx.lineWidth = 1.3;
        ctx.stroke();

        ctx.save();
        ctx.translate(rightX + 18, m.y + 24);
        ctx.fillStyle = `rgba(${m.rgb}, 0.60)`;
        if (m.label === "CORE CANNON") {
          ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "rgba(255, 255, 255, 0.60)"; ctx.lineWidth = 1.5; ctx.stroke();
        } else if (m.label === "WING MISSILE") {
          ctx.fillRect(-3, -7, 6, 14);
          ctx.fillStyle = "rgba(255, 255, 255, 0.60)"; ctx.beginPath(); ctx.moveTo(-4, -7); ctx.lineTo(0, -11); ctx.lineTo(4, -7); ctx.fill();
        } else {
          ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(6, 0); ctx.lineTo(-6, 6); ctx.fill();
        }
        ctx.restore();

        ctx.textAlign = "left";
        ctx.fillStyle = "rgba(226, 232, 240, 0.60)";
        ctx.font = `bold 10px ${FONT_FAMILY}`;
        ctx.fillText(m.label, rightX + 38, m.y + 18);

        ctx.textAlign = "right";
        ctx.fillStyle = `rgba(${m.rgb}, 0.60)`;
        ctx.font = `bold 12px ${FONT_FAMILY}`;
        ctx.fillText(`Lv.${m.lv}`, rightX + 170, m.y + 18);

        const barW = 132;
        const barPct = Math.min(1.0, m.lv / m.max);
        ctx.fillStyle = "#1e293b";
        drawRoundRect(ctx, rightX + 38, m.y + 26, barW, 6, 3);
        ctx.fill();
        ctx.fillStyle = `rgba(${m.rgb}, 0.60)`;
        drawRoundRect(ctx, rightX + 38, m.y + 26, barW * barPct, 6, 3);
        ctx.fill();

        ctx.textAlign = "left";
        ctx.fillStyle = "rgba(148, 163, 184, 0.60)";
        ctx.font = `9px ${FONT_FAMILY}`;
        ctx.fillText("READY FOR UPGRADE", rightX + 38, m.y + 42);
        ctx.restore();
      }

      ctx.restore();

      ctx.textAlign = "center";
      ctx.fillStyle = "#00f5ff";
      ctx.font = `bold 16px ${FONT_FAMILY}`;
      ctx.fillText("SKILLS & SPECIAL OPTIONS", LOGICAL_WIDTH / 2, 370);

      const btnMult = { x: 35, y: 384, w: 380, h: 85 };
      if (curTime - lastMultRollTime >= 0.048) {
        lastMultRollTime = curTime;
        currentMultIndex = (currentMultIndex + 1) % shuffledMultiplierPool.length;
      }
      const currentMultOption = shuffledMultiplierPool[currentMultIndex];

      ctx.save();
      ctx.fillStyle = "rgba(20, 26, 52, 0.95)";
      drawRoundRect(ctx, btnMult.x, btnMult.y, btnMult.w, btnMult.h, 12);
      ctx.fill();
      ctx.strokeStyle = "#ffd700";
      ctx.lineWidth = 2.0;
      ctx.stroke();

      for (let i = 0; i < ORBIT_STARS.length; i++) {
        const st = ORBIT_STARS[i];
        const prevPt = getPerimeterPoint(btnMult, st.normProgress);
        st.normProgress += st.speedRate * st.dir * dt;
        const pt = getPerimeterPoint(btnMult, st.normProgress);
        const moveDeltaX = pt.x - prevPt.x;
        const starSpinDir = moveDeltaX < -0.001 ? -1 : (moveDeltaX > 0.001 ? 1 : st.dir);
        const rotAng = (curTime * ((Math.PI * 2) / st.rotDuration)) * starSpinDir;

        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(rotAng);
        ctx.fillStyle = st.color;
        drawStarShape(ctx, 0, 0, 5, st.baseSize, st.baseSize * 0.45);
        ctx.fill();
        ctx.restore();
      }

      ctx.textAlign = "center";
      ctx.fillStyle = "#ffd700";
      ctx.font = `bold 11px ${FONT_FAMILY}`;
      ctx.fillText("★ [ RANDOM CHANCE : UP TO 3X MULTIPLIER ] ★", btnMult.x + btnMult.w / 2, btnMult.y + 22);
      ctx.fillStyle = currentMultOption.col;
      ctx.font = `bold 22px ${FONT_FAMILY}`;
      ctx.fillText(currentMultOption.label, btnMult.x + btnMult.w / 2, btnMult.y + 52);
      ctx.fillStyle = "#a5c0e0";
      ctx.font = `11px ${FONT_FAMILY}`;
      ctx.fillText("x1 (50%) / x2 (30%) / x3 (20%) CHANCE", btnMult.x + btnMult.w / 2, btnMult.y + 75);
      ctx.restore();

      const slotToSkillGap = 494 - (384 + 85);
      const row2Y = 494 + 66 + slotToSkillGap;

      const row1Cards = [
        { code: "POWER_UP", title: "POWER +1", desc: "INSTANT", col: "#ff0080", x: 35, y: 494, w: 115, h: 66 },
        { code: "MISSILE_UP", title: "MISSILE +1", desc: "INSTANT", col: "#00f5ff", x: 167, y: 494, w: 115, h: 66 },
        { code: "FIRE_RATE", title: "RATE +1", desc: "INSTANT", col: "#ffe600", x: 300, y: 494, w: 115, h: 66 }
      ];

      const row2Cards = [
        { code: "SHIELD", title: "SHIELD", desc: "1~30s", col: "#32ff78", x: 35, y: row2Y, w: 115, h: 66, active: player && player.shieldRemain > 0 },
        { code: "LASER_WEAPON", title: "LASER", desc: "1~30s", col: "#00f5ff", x: 167, y: row2Y, w: 115, h: 66, active: player && player.laserWeaponTimer > 0 },
        { code: "CLONE_SHIP", title: "TWIN", desc: "1~30s", col: "#78a0ff", x: 300, y: row2Y, w: 115, h: 66, active: player && player.clonePlaneTimer > 0 }
      ];

      const isRecFlash = Math.floor(curTime / 0.10) % 2 === 0;
      const isRecTextFlash = Math.floor(curTime / 0.30) % 2 === 0;
      const allPickCards = row1Cards.concat(row2Cards);

      for (let i = 0; i < allPickCards.length; i++) {
        const c = allPickCards[i];
        ctx.save();
        if (c.active) ctx.globalAlpha = 0.50;

        ctx.fillStyle = "rgba(10, 16, 35, 0.85)";
        drawRoundRect(ctx, c.x, c.y, c.w, c.h, 10);
        ctx.fill();

        const isRec = (c.code === recommendedSkillCode);
        if (isRec && !c.active) {
          ctx.strokeStyle = isRecFlash ? "#ffffff" : "#00f5ff";
          ctx.lineWidth = isRecFlash ? 3.5 : 2.5;
        } else {
          ctx.strokeStyle = c.col;
          ctx.lineWidth = 1.8;
        }
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.font = `bold 13px ${FONT_FAMILY}`;
        ctx.fillText(c.title, c.x + c.w / 2, c.y + 28);
        ctx.fillStyle = c.col;
        ctx.font = `bold 11px ${FONT_FAMILY}`;
        ctx.fillText(c.desc, c.x + c.w / 2, c.y + 48);

        if (isRec && !c.active) {
          ctx.save();
          ctx.fillStyle = "rgba(10, 16, 35, 0.95)";
          drawRoundRect(ctx, c.x + 8, c.y + c.h - 8, c.w - 16, 16, 4);
          ctx.fill();
          ctx.strokeStyle = isRecFlash ? "#ffffff" : "#00f5ff";
          ctx.lineWidth = 1.4;
          ctx.stroke();

          ctx.fillStyle = isRecTextFlash ? "#00f5ff" : "#ffffff";
          ctx.font = `bold 9px ${FONT_FAMILY}`;
          ctx.fillText("RECOMMENDED", c.x + c.w / 2, c.y + c.h + 4);
          ctx.restore();
        }

        if (c.active) {
          ctx.globalAlpha = 1.0;
          ctx.fillStyle = "#ff2244";
          ctx.font = `bold 14px ${FONT_FAMILY}`;
          ctx.fillText("[SOLD OUT]", c.x + c.w / 2, c.y + 38);
        }
        ctx.restore();
      }

      if (randomPickShowcaseActive) {
        const showcaseElapsed = curTime - randomPickShowcaseStartTime;
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        const popW = 340, popH = 200;
        const popX = LOGICAL_WIDTH / 2 - popW / 2;
        const popY = LOGICAL_HEIGHT / 2 - popH / 2;

        ctx.save();
        ctx.fillStyle = "rgba(15, 25, 45, 0.98)";
        drawRoundRect(ctx, popX, popY, popW, popH, 14);
        ctx.fill();
        ctx.strokeStyle = "#ffd700";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffd700";
        ctx.font = `bold 18px ${FONT_FAMILY}`;
        const topHeader = (randomPickResult && randomPickResult.header) ? randomPickResult.header : "★ UPGRADE CONFIRMED! ★";
        ctx.fillText(topHeader, LOGICAL_WIDTH / 2, popY + 45);
        ctx.fillStyle = randomPickResult.col;
        ctx.font = `bold 30px ${FONT_FAMILY}`;
        ctx.fillText(randomPickResult.label, LOGICAL_WIDTH / 2, popY + 105);
        ctx.fillStyle = "#00f5ff";
        ctx.font = `bold 14px ${FONT_FAMILY}`;
        ctx.fillText("RETURNING TO BATTLE...", LOGICAL_WIDTH / 2, popY + 155);
        ctx.restore();

        if (showcaseElapsed >= 1.5) {
          randomPickShowcaseActive = false;
          playChosenImmediateReturn();
        }
      }
    } else if (gameState === 5) {
      const popW = 320, popH = 240;
      const popX = LOGICAL_WIDTH / 2 - popW / 2;
      const popY = LOGICAL_HEIGHT / 2 - popH / 2;

      ctx.save();
      ctx.fillStyle = "rgba(12, 18, 38, 0.95)";
      drawRoundRect(ctx, popX, popY, popW, popH, 12);
      ctx.fill();
      ctx.strokeStyle = "#00f5ff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.fillStyle = "#00f5ff";
      ctx.font = `bold 18px ${FONT_FAMILY}`;
      const skillTitle = minigameTargetOption === "LASER_WEAPON" ? "LASER WEAPON" : (minigameTargetOption === "SHIELD" ? "ENERGY SHIELD" : "CLONE SHIP");
      ctx.fillText(skillTitle, LOGICAL_WIDTH / 2, popY + 45);

      if (minigameSelectedTime === null) {
        // [항목 6] 0~10초: 0%, 11~20초: 70%, 21~30초: 30% 확률 적용
        const rVal = Math.random();
        if (rVal < 0.70) {
          minigameRollingTime = Math.floor(11 + Math.random() * 10); // 11 ~ 20초 (70%)
        } else {
          minigameRollingTime = Math.floor(21 + Math.random() * 10); // 21 ~ 30초 (30%)
        }

        ctx.fillStyle = "#ffe600";
        ctx.font = `bold 56px ${FONT_FAMILY}`;
        ctx.fillText(`${minigameRollingTime}s`, LOGICAL_WIDTH / 2, popY + 125);
        ctx.fillStyle = "#ffffff";
        ctx.font = `13px ${FONT_FAMILY}`;
        ctx.fillText("TAP OR CLICK SCREEN TO STOP!", LOGICAL_WIDTH / 2, popY + 185);
      } else {
        ctx.fillStyle = "#32ff78";
        ctx.font = `bold 56px ${FONT_FAMILY}`;
        ctx.fillText(`${minigameSelectedTime}s`, LOGICAL_WIDTH / 2, popY + 125);
        ctx.fillStyle = "#32ff78";
        ctx.font = `bold 15px ${FONT_FAMILY}`;
        ctx.fillText("DURATION CONFIRMED!", LOGICAL_WIDTH / 2, popY + 185);

        if (curTime - minigameFinishTimestamp >= 1.2) {
          applyChosenSkill(minigameTargetOption, minigameSelectedTime);
        }
      }
      ctx.restore();

    } else if (gameState === 3) {
      const popY = LOGICAL_HEIGHT * 0.3;
      ctx.save();
      ctx.fillStyle = "#121626";
      drawRoundRect(ctx, LOGICAL_WIDTH / 2 - 160, popY - 20, 320, 240, 14);
      ctx.fill();
      ctx.strokeStyle = "#ff0080";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.fillStyle = "#ff0080";
      ctx.font = `bold 24px ${FONT_FAMILY}`;
      ctx.fillText("GAME OVER", LOGICAL_WIDTH / 2, popY + 15);
      ctx.fillStyle = "#ffe600";
      ctx.font = `16px ${FONT_FAMILY}`;
      ctx.fillText(`FINAL SCORE: ${score}`, LOGICAL_WIDTH / 2, popY + 45);

      // 전체 중 내 순위 표시
      ctx.fillStyle = "#00f5ff";
      ctx.font = `bold 14px ${FONT_FAMILY}`;
      ctx.fillText(`RANK: #${currentSessionRank} / ${totalRankCount}`, LOGICAL_WIDTH / 2, popY + 70);

      ctx.fillStyle = "#00f5ff";
      drawRoundRect(ctx, LOGICAL_WIDTH / 2 - 90, popY + 155, 180, 42, 8);
      ctx.fill();
      ctx.fillStyle = "#080c18";
      ctx.font = `bold 15px ${FONT_FAMILY}`;
      ctx.fillText("SUBMIT & RESTART", LOGICAL_WIDTH / 2, popY + 181);
      ctx.restore();
    }
  } catch(err) {
    console.error("Frame Loop Guard Handled Exception:", err);
  }

  requestAnimationFrame(safeGameLoop);
}

let currentSessionRank = 1;
let totalRankCount = 1;

function handleGameOver() {
  // 지연 없이 즉시 게임오버 상태로 전환하여 버튼 렌더링 보장
  gameState = 3;

  // 전체 랭킹에서 내 순위 계산
  const baseSource = (allLeaderboardList && allLeaderboardList.length > 0) ? allLeaderboardList : top10List;
  const curScore = Math.floor(score);
  let low = 0, high = baseSource.length;
  while (low < high) {
    const mid = (low + high) >>> 1;
    if (baseSource[mid].score > curScore) low = mid + 1;
    else high = mid;
  }
  currentSessionRank = low + 1;
  totalRankCount = Math.max(1, baseSource.length + 1);

  // 입력창 오픈 및 포커스
  nameInputOverlay.style.display = "block";
  nameInput.value = "";
  nameInput.placeholder = "ENTER PILOT NAME";
  nameInput.focus();
}

setSelectScreenMode();
requestAnimationFrame(safeGameLoop);
</script>
</body>
</html>
