function sanitizeText(str) {
  if (!str) return "Unknown";
  return String(str).replace(/[^\w\s\uAC00-\uD7A3.-]/gi, '').trim().substring(0, 10) || "Unknown";
}

function drawRoundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function drawStarShape(c, cx, cy, spikes, outerRadius, innerRadius) {
  let rot = Math.PI / 2 * 3;
  let step = Math.PI / spikes;
  c.beginPath();
  c.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    let x = cx + Math.cos(rot) * outerRadius;
    let y = cy + Math.sin(rot) * outerRadius;
    c.lineTo(x, y);
    rot += step;
    x = cx + Math.cos(rot) * innerRadius;
    y = cy + Math.sin(rot) * innerRadius;
    c.lineTo(x, y);
    rot += step;
  }
  c.lineTo(cx, cy - outerRadius);
  c.closePath();
}

let recommendedSkillCode = "POWER_UP";
function calculateRecommendedSkill() {
  if (!player) return "POWER_UP";
  const p = player.powerStat || 1;
  const m = player.missileStat || 1;
  const r = player.fireRateStat || 1;

  // [항목 6] 시작 레벨 5짜리 고유 스탯이 8렙이 될 때까지 우선 추천
  if (player.pType === 0 && m < 8) return "MISSILE_UP";
  if (player.pType === 1 && p < 8) return "POWER_UP";
  if (player.pType === 2 && r < 8) return "FIRE_RATE";

  // 8렙 이후: 현재 레벨 분석 기반 최적 스킬 추천 (가장 낮은 스탯 보완 및 진행시간 고려)
  const time = inGameElapsedTime || 0;
  if (time >= 90 && p <= Math.min(m, r)) return "POWER_UP";
  if (m <= p && m <= r) return "MISSILE_UP";
  if (r <= p && r <= m) return "FIRE_RATE";
  return "POWER_UP";
}

// 트윈 비행기 전용 번개 경로 생성 유틸
function createLightningPoints(sx, sy, tx, ty, segments = 5, maxDisp = 9) {
  const pts = [{ x: sx, y: sy }];
  const dx = (tx - sx) / segments;
  const dy = (ty - sy) / segments;
  for (let i = 1; i < segments; i++) {
    const rx = (Math.random() - 0.5) * maxDisp;
    const ry = (Math.random() - 0.5) * maxDisp;
    pts.push({ x: sx + dx * i + rx, y: sy + dy * i + ry });
  }
  pts.push({ x: tx, y: ty });
  return pts;
}

// 적 비행기 감전(5줄기 번개) 효과 등록
function triggerEnemyLightningShock(impactX, impactY, enemy) {
  if (!enemy || enemy.isDead) return;
  const shocks = [];
  for (let i = 0; i < 5; i++) {
    const spreadAng = Math.random() * Math.PI * 2;
    const spreadDist = enemy.radius * (0.6 + Math.random() * 0.7);
    const tx = enemy.x + Math.cos(spreadAng) * spreadDist;
    const ty = enemy.y + Math.sin(spreadAng) * spreadDist;
    shocks.push(createLightningPoints(impactX, impactY, tx, ty, 3, 5));
  }
  enemyLightningShocks.push({
    shocks: shocks,
    life: 0.14,
    totalLife: 0.14
  });
}

async function updatePresence() {
  if (isUpdatingPresence) return;
  isUpdatingPresence = true;

  try {
    // 1. [대기실/인게임 공통] 5초마다 Firebase 서버 타임스탬프로 본인 생존 신호 전송 (게임 중인 유저도 카운트에 유지)
    await fetch(`${PRESENCE_URL}/${sessionSecurityKey}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ lastSeen: { ".sv": "timestamp" } })
    });

    // 2. [선택 화면 전용] 대기실(gameState === 0)일 때만 전체 목록 조회 (전투 중 불필요한 다운로드 방지)
    if (gameState === 0) {
      const res = await fetch(`${PRESENCE_URL}.json?t=${Date.now()}`);
      const data = await res.json();
      if (data && typeof data === "object") {
        const myRecord = data[sessionSecurityKey];
        const baseServerTime = (myRecord && typeof myRecord.lastSeen === "number")
          ? myRecord.lastSeen
          : Date.now();

        // 15초(15,000ms) 이내 신호가 살아있는 모든 플레이어(대기실 + 인게임 전체) 집계
        let count = 0;
        for (const key in data) {
          const item = data[key];
          if (item && typeof item.lastSeen === "number") {
            if (Math.abs(baseServerTime - item.lastSeen) <= 15000) count++;
          }
        }
        activePlayerCount = Math.max(1, count);
      }
    }
  } catch (e) {
  } finally {
    isUpdatingPresence = false;
  }
}

let top10List = [];
let allLeaderboardList = []; // Firebase에 등록된 전체 랭킹 목록 저장

function fetchTop10() {
  try {
    fetch(FIREBASE_URL + `?t=${Date.now()}`)
      .then(r => r.json())
      .then(data => {
        if (data && typeof data === "object") {
          const rawItems = Object.values(data).filter(v => v && typeof v === "object" && v.score !== undefined);

          // 1. 최근 5일 일일 플레이 횟수 집계
          const now = new Date();
          const getDayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          const getLabel = (d) => `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;

          const temp7 = [];
          for (let i = 6; i >= 0; i--) {
            const targetD = new Date(now);
            targetD.setDate(targetD.getDate() - i);
            temp7.push({
              key: getDayKey(targetD),
              date: getLabel(targetD), // (오늘) 제거하고 날짜만 표기
              count: 0
            });
          }

          rawItems.forEach(item => {
            if (item.time) {
              const itemDate = new Date(item.time * 1000);
              const ik = getDayKey(itemDate);
              const targetSlot = temp7.find(t => t.key === ik);
              if (targetSlot) targetSlot.count++;
            }
          });
          dailyPlayCounts5 = temp7;

          // 2. 전체 및 Top 10 랭킹 리스트 동기화
          rawItems.sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0));

          allLeaderboardList = rawItems.map(v => ({
            name: sanitizeText(v.name),
            score: Math.floor(Number(v.score) || 0)
          }));

          top10List = rawItems.slice(0, 10).map(v => {
            let shipName = "";
            if (v.ship === "Legend" || v.pType === 4) shipName = "Legend";
            else if (v.ship === "Power" || v.pType === 1) shipName = "Power";
            else if (v.ship === "Missile" || v.ship === "Speed" || v.pType === 0) shipName = "Missile";
            else if (v.ship === "Twin" || v.pType === 2) shipName = "Twin";
            else if (v.ship === "Random") shipName = "Random";

            const timeStr = (typeof v.playTime === "number") ? ` (${v.playTime}s)` : "";

            return {
              name: sanitizeText(v.name),
              score: Math.floor(Number(v.score) || 0),
              country: sanitizeText(v.country) || "Global",
              ship: shipLabel
            };
          });
        }
      }).catch(err => console.error("fetchTop10 Error:", err));
  } catch(e){}
}

  const cleanName = sanitizeText(name);
  if (!cleanName || cleanName === "Unknown") return;
  const durationSec = Math.max(1, (performance.now() - sessionStartTime) / 1000);
  if (finalScore < 0 || finalScore > durationSec * 60 + 500) return;

  let shipType = "Random";
  if (player) {
    if (player.pType === 4 || player.name === "Legend") shipType = "Legend";
    else if (player.pType === 1 || player.name === "Power") shipType = "Power";
    else if (player.pType === 0 || player.name === "Missile" || player.name === "Speed") shipType = "Missile";
    else if (player.pType === 2 || player.name === "Twin") shipType = "Twin";
    else shipType = "Random";
  }

  const survivedSec = finalSurvivedSec || Math.floor(inGameElapsedTime || 0);

  try {
    fetch(FIREBASE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: cleanName,
        score: Math.floor(finalScore),
        country: sanitizeText(userCountry),
        ship: shipType,
        playTime: survivedSec,
        token: sessionSecurityKey,
        time: Date.now() / 1000
      })
    }).then(() => fetchTop10()).catch(() => {});
  } catch(e){}
}

let audioCtx = null;
let bgmInterval = null;
let bgmStep = 0;
let currentBgmMode = "select";
let inGameBgmTrack = 0;
let selectBgmTrack = 0;
let isPageVisible = true;

function initAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      startBGMEngine();
    }
    if (audioCtx && audioCtx.state === 'suspended' && isPageVisible) {
      audioCtx.resume().catch(() => {});
    }
  } catch(e){}
}

document.addEventListener("visibilitychange", () => {
  isPageVisible = (document.visibilityState === "visible");
  try {
    if (!isPageVisible && audioCtx && audioCtx.state === "running") audioCtx.suspend();
    else if (isPageVisible && audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch(e){}
});
window.addEventListener("blur", () => {
  try { if (audioCtx && audioCtx.state === "running") audioCtx.suspend(); } catch(e){}
});
window.addEventListener("focus", () => {
  try { if (audioCtx && audioCtx.state === "suspended" && isPageVisible) audioCtx.resume(); } catch(e){}
});

let activeToneCount = 0;
function playTone(freq, duration, type="sine", sweep=0, vol=0.112) { // 기본 효과음 50% 증가 (0.075 -> 0.112)
  if (!audioCtx || !isPageVisible || audioCtx.state !== "running") return;
  if (activeToneCount > 12) return;
  try {
    activeToneCount++;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    const now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(freq, now);
    if (sweep !== 0) osc.frequency.linearRampToValueAtTime(freq + sweep, now + duration);
    gain.gain.setValueAtTime(vol * 0.75, now); // 50% 증가
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.onended = () => {
      activeToneCount = Math.max(0, activeToneCount - 1);
      try { osc.disconnect(); gain.disconnect(); } catch(err){}
    };
    osc.start(now); osc.stop(now + duration);
  } catch(e){
    activeToneCount = Math.max(0, activeToneCount - 1);
  }
}
function playMeteorWarningSound() {
  if (!audioCtx || !isPageVisible || audioCtx.state !== "running") return;
  try {
    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.type = "sawtooth"; osc2.type = "square";
    osc1.frequency.setValueAtTime(340, now); osc1.frequency.linearRampToValueAtTime(130, now + 0.38);
    osc2.frequency.setValueAtTime(345, now); osc2.frequency.linearRampToValueAtTime(135, now + 0.38);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    osc1.connect(gain); osc2.connect(gain);
    gain.connect(audioCtx.destination);
    osc1.start(now); osc2.start(now);
    osc1.stop(now + 0.38); osc2.stop(now + 0.38);
  } catch(e){}
}

let lastExplosionSoundTime = 0;
function playExplosionSound() {
  if (!audioCtx || !isPageVisible || audioCtx.state !== "running") return;
  const now = audioCtx.currentTime;
  // 60ms 이내에 연속 호출 시 오디오 버퍼 생성 차단 (동시 폭발 사운드 크래시 방지)
  if (now - lastExplosionSoundTime < 0.06) return;
  lastExplosionSoundTime = now;

  try {
    const dur = 0.22;
    const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < buf.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / buf.length);
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    src.buffer = buf;
    gain.gain.setValueAtTime(0.10, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(gain); gain.connect(audioCtx.destination);
    src.start(now);
  } catch(e){}
}

function setSelectScreenMode() {
  currentBgmMode = "select";
  selectBgmTrack = Math.floor(Math.random() * 3);
  bgmStep = 0;
}

function startBGMEngine() {
  if (bgmInterval) clearInterval(bgmInterval);

  const selectTracks = [
    [261.63, 293.66, 329.63, 392.00, 329.63, 392.00, 440.00, 523.25],
    [220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 493.88, 523.25],
    [196.00, 246.94, 293.66, 329.63, 392.00, 440.00, 587.33, 659.25]
  ];

  const inGameTrack1 = [130.81, 164.81, 196.00, 246.94, 261.63, 329.63];
  const inGameTrack2 = [146.83, 174.61, 220.00, 261.63, 293.66, 349.23];
  const inGameTrack3 = [110.00, 130.81, 146.83, 164.81, 220.00, 261.63];

  bgmInterval = setInterval(() => {
    if (!audioCtx || audioCtx.state !== 'running' || !isPageVisible) return;
    const now = audioCtx.currentTime;

    if (currentBgmMode === "select") {
      const activeMelody = selectTracks[selectBgmTrack % 3];
      if (bgmStep % 4 === 0) {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = "sine";
        const f = activeMelody[(bgmStep / 4) % activeMelody.length];
        osc.frequency.setValueAtTime(f, now);
        g.gain.setValueAtTime(0.05, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.45);
      }
    } else {
      let activeTrack = inGameBgmTrack === 0 ? inGameTrack1 : (inGameBgmTrack === 1 ? inGameTrack2 : inGameTrack3);
      if (bgmStep % 2 === 0) {
        const bOsc = audioCtx.createOscillator();
        const bG = audioCtx.createGain();
        bOsc.type = inGameBgmTrack === 1 ? "square" : "sawtooth";
        bOsc.frequency.setValueAtTime(activeTrack[0] / 2, now);
        bG.gain.setValueAtTime(0.0168, now); // 0.0112 * 1.5
        bG.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        bOsc.connect(bG); bG.connect(audioCtx.destination);
        bOsc.start(now); bOsc.stop(now + 0.25);
      }
      const mOsc = audioCtx.createOscillator();
      const mG = audioCtx.createGain();
      mOsc.type = "sine";
      const mNote = activeTrack[(bgmStep * 3 + inGameBgmTrack) % activeTrack.length];
      mOsc.frequency.setValueAtTime(mNote, now);
      mG.gain.setValueAtTime(0.0093, now); // 0.0062 * 1.5
      mG.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

    const offsets0 = [36, 26, 38, 22, 35, 25, 37, 21, 34, 27, 36, 23];
    for (let i = 0; i < 12; i++) {
      const a = (i * Math.PI) / 6;
      const rOuter = offsets0[i];
      const x = Math.cos(a) * rOuter;
      const y = Math.sin(a) * rOuter;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
  } else if (shapeMode === 1) {
    const pts1 = [[0, -39], [10, -28], [22, -22], [18, -6], [29, 6], [21, 24], [8, 31], [-5, 37], [-19, 25], [-27, 11], [-18, -4], [-23, -20], [-10, -31]];
    c.moveTo(pts1[0][0], pts1[0][1]);
    for (let i = 1; i < pts1.length; i++) c.lineTo(pts1[i][0], pts1[i][1]);
  } else if (shapeMode === 2) {
    const pts2 = [[-4, -36], [14, -31], [24, -20], [33, -4], [25, 14], [22, 29], [4, 35], [-14, 32], [-27, 21], [-35, 5], [-31, -14], [-17, -29]];
    c.moveTo(pts2[0][0], pts2[0][1]);
    for (let i = 1; i < pts2.length; i++) c.lineTo(pts2[i][0], pts2[i][1]);
  } else if (shapeMode === 3) {
    const pts3 = [[0, -37], [16, -25], [29, -10], [33, 9], [17, 23], [-2, 36], [-17, 27], [-29, 13], [-22, -3], [-32, -18], [-14, -28]];
    c.moveTo(pts3[0][0], pts3[0][1]);
    for (let i = 1; i < pts3.length; i++) c.lineTo(pts3[i][0], pts3[i][1]);
  } else {
    const pts4 = [[-12, -36], [6, -34], [24, -23], [35, -4], [31, 16], [16, 31], [-3, 35], [-21, 27], [-33, 15], [-35, -8], [-23, -24]];
    c.moveTo(pts4[0][0], pts4[0][1]);
    for (let i = 1; i < pts4.length; i++) c.lineTo(pts4[i][0], pts4[i][1]);
  }

  c.closePath();
  c.fill();
  c.stroke();

  // 발광 에너지 크랙 (지열선)
  c.strokeStyle = "#00f5ff";
  c.lineWidth = 1.2;
  c.beginPath();
  c.moveTo(-15, -10); c.lineTo(-2, 4); c.lineTo(12, -8);
  c.moveTo(-2, 4); c.lineTo(5, 20);
  c.stroke();

  // 입체 질감 3D 크레이터
  const crPos = [
    { x: -8, y: -12, r: 6.0 },
    { x: 12, y: 10, r: 5.0 },
    { x: -14, y: 12, r: 4.2 }
  ];
  crPos.forEach(cr => {
    c.fillStyle = "#1e293b";
    c.beginPath(); c.arc(cr.x, cr.y, cr.r, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "#94a3b8";
    c.lineWidth = 1.2;
    c.stroke();
    c.fillStyle = "#0f172a";
    c.beginPath(); c.arc(cr.x - 1, cr.y - 1, cr.r * 0.45, 0, Math.PI * 2); c.fill();
  });

  c.restore();
}

function drawVectorEnemy(c, designId, isHeavy, rotDir, colorIdx, curTime) {
  if (isHeavy) drawVectorEliteAsteroid(c, designId, rotDir, colorIdx, curTime);
  else drawVectorRegularEnemy(c, (designId || 0) % 4);
}

function drawVectorBoss(c, curTime) {
  c.save();
  c.scale(1.02, 1.02);
  c.lineJoin = "round";

  c.fillStyle = "rgba(0, 245, 255, 0.28)";
  c.beginPath();
  c.moveTo(-28, 20); c.lineTo(-65, 35); c.lineTo(-58, -25); c.lineTo(-26, -15);
  c.closePath(); c.fill();
  c.beginPath();
  c.moveTo(28, 20); c.lineTo(65, 35); c.lineTo(58, -25); c.lineTo(26, -15);
  c.closePath(); c.fill();

  c.fillStyle = "#120815";
  c.strokeStyle = "#ff2244";
  c.lineWidth = 2.6;
  c.beginPath();
  c.moveTo(0, 52); c.lineTo(28, 26); c.lineTo(56, 32); c.lineTo(50, -20);
  c.lineTo(30, -38); c.lineTo(0, -28); c.lineTo(-30, -38); c.lineTo(-50, -20);
  c.lineTo(-56, 32); c.lineTo(-28, 26);
  c.closePath(); c.fill(); c.stroke();

  c.fillStyle = "#1c2438";
  c.strokeStyle = "rgba(255, 255, 255, 0.4)";
  c.lineWidth = 1.0;
  c.beginPath();
  c.moveTo(0, 38); c.lineTo(20, 18); c.lineTo(40, 14); c.lineTo(24, -20);
  c.lineTo(0, -14); c.lineTo(-24, -20); c.lineTo(-40, 14); c.lineTo(-20, 18);
  c.closePath(); c.fill(); c.stroke();

  c.fillStyle = "#475569";
  c.fillRect(-27, 28, 8, 20); c.fillRect(19, 28, 8, 20);
  c.strokeStyle = "#ff4400";
  c.strokeRect(-27, 28, 8, 20); c.strokeRect(19, 28, 8, 20);
  c.fillStyle = "#ffaa00";
  c.fillRect(-25, 45, 4, 4); c.fillRect(21, 45, 4, 4);

  c.save();
  c.rotate(curTime * 2.2);
  c.strokeStyle = "#ffd700"; c.lineWidth = 2.0;
  c.strokeRect(-15, -15, 30, 30);
  c.rotate(Math.PI / 4);
  c.strokeStyle = "#00f5ff"; c.lineWidth = 1.5;
  c.strokeRect(-12, -12, 24, 24);
  c.rotate(-curTime * 4.5);
  c.strokeStyle = "#ff00bb"; c.lineWidth = 1.2;
  c.strokeRect(-8, -8, 16, 16);
  c.restore();

  const coreGrad = c.createRadialGradient(0, 0, 2, 0, 0, 9);
  coreGrad.addColorStop(0, "#ffffff");
  coreGrad.addColorStop(0.4, "#ffff00");
  coreGrad.addColorStop(0.8, "#ff0055");
  coreGrad.addColorStop(1, "rgba(255, 0, 85, 0)");
  c.fillStyle = coreGrad;
  c.beginPath(); c.arc(0, 0, 9, 0, Math.PI * 2); c.fill();
  c.restore();
}

function drawVectorLaserPod(c, lx, ly, muzzleFlashActive, curTime) {
  c.save();
  c.translate(lx, ly);
  c.fillStyle = "#1e293b"; c.fillRect(-3, 2, 6, 4);
  c.strokeStyle = "#475569"; c.lineWidth = 1; c.strokeRect(-3, 2, 6, 4);

  c.fillStyle = "#0a0f1d"; c.strokeStyle = "#00f5ff"; c.lineWidth = 1.2;
  c.beginPath();
  c.moveTo(0, -14); c.lineTo(3.5, -9); c.lineTo(3.5, 10); c.lineTo(-3.5, 10);
  c.lineTo(-3.5, -9);
  c.closePath(); c.fill(); c.stroke();

  const corePulse = Math.sin(curTime * 15) * 0.3 + 0.7;
  c.fillStyle = `rgba(0, 245, 255, ${corePulse})`;
  c.fillRect(-2, -3, 4, 4);

  if (muzzleFlashActive) {
    const flashR = 6 + Math.random() * 4;
    c.fillStyle = "#ffffff";
    c.beginPath(); c.arc(0, -15, flashR, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "#00f5ff"; c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(0, -15 - flashR * 1.5); c.lineTo(0, -15 + flashR * 1.5);
    c.moveTo(-flashR * 1.5, -15); c.lineTo(flashR * 1.5, -15);
    c.stroke();
  }
  c.restore();
}

// =================================================================
// 5. 엔티티 정의
// =================================================================
class Player {
  constructor(pType, name, missileStat, powerStat, fireRateStat) {
    this.pType = pType; this.name = name;
    this.missileStat = Number(missileStat) || 1;
    this.powerStat = Number(powerStat) || 1;
    this.fireRateStat = Number(fireRateStat) || 1;
    this.clonePlaneTimer = 0.0; this.laserWeaponTimer = 0.0;
    this.lastLaserTime = 0.0;
    this.laserMuzzleFlashTime = 0.0;
    this.shotCount = 0;
    this.x = LOGICAL_WIDTH / 2; this.y = LOGICAL_HEIGHT * 0.8;
    this.targetX = this.x; this.targetY = this.y;
    this.radius = 22; this.shieldRemain = 0.0;
    this.lastShot = performance.now() / 1000;
    this.isAlive = true;
    this.missileTimer = 0.0;
    this.missileFlashTime = 0.0;
    this.missileLaserTimer = 0.0;
    this.isMovingUp = false;
    this.lightningTimer = 0.0;
    this.twinEmpChargingTimer = 0.0; // 기두부 원형 펄스 충전 타이머 (최대 12px 충전)
    this.twinFireSide = 0; // 0: 좌측, 1: 우측 교차 발사 플래그
  }
  getDominantTrait() {
    if (this.pType === 0) return "MISSILE";
    if (this.pType === 1) return "POWER";
    if (this.pType === 2) return "RATE";
    const maxVal = Math.max(this.powerStat, this.missileStat, this.fireRateStat);
    if (this.powerStat === maxVal) return "POWER";
    if (this.missileStat === maxVal) return "MISSILE";
    return "RATE";
  }
  getFireInterval() {
    let reductionFactor = (this.pType === 2) ? 0.06 : 0.05;
    const statVal = Math.max(1, Number(this.fireRateStat) || 1);
    const reduction = 1.0 / (1.0 + (statVal - 1) * reductionFactor);
    let base = CONFIG.BASE_FIRE_INTERVAL;
    if (this.pType === 2) base *= 0.85;
    if (this.pType === 0 || this.pType === 1) base *= 1.30;
    if (this.pType === 4 || this.name === "Legend") base *= 0.70;
    return Math.max(0.10, base * reduction);
  }
  getMissileDamage() {
    // [항목 5] 미사일형(Type 0) 1렙 파워 지금 대비 30% 감소 (3.0 -> 2.1)
    const baseDmg = (this.pType === 0) ? 2.1 : 3.0;
    return baseDmg * (1.0 + Math.max(0, this.missileStat - 1) * 0.04);
  }
  getMissileInterval() {
    const baseInterval = 1.47; // 1렙 발사 주기 30% 단축 (2.1 * 0.7)
    const reduction = Math.min(0.80, Math.max(0, this.missileStat - 1) * 0.04);
    let interval = baseInterval * (1.0 - reduction);
    if (this.pType === 0) {
      interval *= 1 / 3;
    }
    return Math.max(0.05, interval);
  }
  update(dt, enemiesList, bulletsList) {
    if (!this.isAlive) return;
    if (this.clonePlaneTimer > 0) this.clonePlaneTimer = Math.max(0, this.clonePlaneTimer - dt);
    if (this.laserWeaponTimer > 0) {
      this.laserWeaponTimer = Math.max(0, this.laserWeaponTimer - dt);
      const curT = performance.now() / 1000;
      if (curT - this.lastLaserTime >= 0.8) {
        this.lastLaserTime = curT;
        this.laserMuzzleFlashTime = curT;
        let tgt = null;
        for (let i = 0; i < enemiesList.length; i++) {
          const e = enemiesList[i];
          if (!e.isDead && e.hp > 0 && !e.isHeavy && e.y >= 20 && e.y < this.y) {
            if (!tgt || e.y > tgt.y) tgt = e;
          }
        }
        if (tgt) {
          activeLasers.push({
            sx: this.x - 32, sy: this.y + 8,
            tx: tgt.x, ty: tgt.y,
            life: 0.20, totalLife: 0.20
          });
          safeKillEnemy(tgt, "#00f5ff");
          playTone(880, 0.20, "sine", -200, 0.12);
        }
      }
    }
    if (this.shieldRemain > 0) this.shieldRemain = Math.max(0, this.shieldRemain - dt);

    this.missileTimer += dt;
    const currentInterval = this.getMissileInterval();

    if (this.missileTimer >= currentInterval) {
      this.missileTimer -= currentInterval;
      this.missileFlashTime = performance.now() / 1000;
      const dmg = this.getMissileDamage();
      const isType0 = (this.pType === 0);
      const isLegend = (this.pType === 4 || this.name === "Legend");

      // [기능 3-1 & 3-2] 레전드 비행기 미사일 개수 확장
      if (isLegend) {
        // 기본 2발 -> 파워 8렙 이상이면 50% 증가(3발) -> 미사일 8렙 이상이면 2배 증가(최대 6발)
        const hasPwr8 = this.powerStat >= 8;
        const hasMsl8 = this.missileStat >= 8;

        if (hasPwr8 && hasMsl8) {
          // 총 6발 방사형 발사
          [-3.0, -1.8, -0.6, 0.6, 1.8, 3.0].forEach((vx, idx) => {
            const side = idx < 3 ? "LEFT" : "RIGHT";
            homingMissiles.push(new HomingMissile(this.x + vx * 10, this.y - 6, vx, -7, dmg, side, false));
          });
        } else if (hasMsl8) {
          // 총 4발 발사 (기본 2발의 2배)
          [-2.2, -0.8, 0.8, 2.2].forEach((vx, idx) => {
            const side = idx < 2 ? "LEFT" : "RIGHT";
            homingMissiles.push(new HomingMissile(this.x + vx * 9, this.y - 6, vx, -7, dmg, side, false));
          });
        } else if (hasPwr8) {
          // 총 3발 발사 (50% 증가)
          homingMissiles.push(new HomingMissile(this.x - 24, this.y - 6, -2.0, -7, dmg, "LEFT", false));
          homingMissiles.push(new HomingMissile(this.x, this.y - 12, 0, -7.5, dmg, "LEFT", false));
          homingMissiles.push(new HomingMissile(this.x + 24, this.y - 6, 2.0, -7, dmg, "RIGHT", false));
        } else {
          homingMissiles.push(new HomingMissile(this.x - 24, this.y - 6, -1.8, -7, dmg, "LEFT", false));
          homingMissiles.push(new HomingMissile(this.x + 24, this.y - 6, 1.8, -7, dmg, "RIGHT", false));
        }
      } else {
        if (isType0) {
          // 미사일 스킬 레벨에 따른 개별 미사일 수직 직진 점유율 (16렙 20%, 8렙 10%, 기본 0%)
          let straightRate = 0;
          if (this.missileStat >= 16) straightRate = 0.20;
          else if (this.missileStat >= 8) straightRate = 0.10;

          const leftIsStraight = (straightRate > 0 && Math.random() < straightRate);
          const rightIsStraight = (straightRate > 0 && Math.random() < straightRate);
          const curMLv = this.missileStat;

          if (leftIsStraight || rightIsStraight) {
            homingMissiles.push(new HomingMissile(this.x - 24, this.y - 6, leftIsStraight ? 0 : -1.8, leftIsStraight ? -15 : -7, dmg, "LEFT", true, leftIsStraight, curMLv));
            playTone(750, 0.12, "triangle", 200, 0.11);

            setTimeout(() => {
              if (this.isAlive && gameState === 1) {
                homingMissiles.push(new HomingMissile(this.x + 24, this.y - 6, rightIsStraight ? 0 : 1.8, rightIsStraight ? -15 : -7, dmg, "RIGHT", true, rightIsStraight, curMLv));
                playTone(750, 0.12, "triangle", 200, 0.11);
              }
            }, 500);
          } else {
            homingMissiles.push(new HomingMissile(this.x - 24, this.y - 6, -1.8, -7, dmg, "LEFT", true, false, curMLv));
            homingMissiles.push(new HomingMissile(this.x + 24, this.y - 6, 1.8, -7, dmg, "RIGHT", true, false, curMLv));
            playTone(750, 0.12, "triangle", 200, 0.11);
          }
        } else {
          homingMissiles.push(new HomingMissile(this.x - 24, this.y - 6, -1.8, -7, dmg, "LEFT", false, false));
          homingMissiles.push(new HomingMissile(this.x + 24, this.y - 6, 1.8, -7, dmg, "RIGHT", false, false));
        }
      }
      playTone(isType0 ? 750 : 550, 0.12, isType0 ? "triangle" : "sine", 200, 0.11);
    }

    if (this.pType === 0) {
      this.missileLaserTimer += dt;
      // Rate 레벨 1당 0.5초 기본 주기에서 2%씩 단축 (최소 0.08초 가드)
      const laserInterval = Math.max(0.08, 0.5 * Math.pow(0.98, Math.max(0, this.fireRateStat - 1)));
      if (this.missileLaserTimer >= laserInterval) {
        this.missileLaserTimer = 0;
        // [항목 4] 1렙 파워 지금 대비 40% 감소 (0.5 -> 0.3)
        const lDmg = Math.max(0.6, this.getMissileDamage() * 0.3);

        // [항목 3] 왼쪽 머리는 LEFT 타겟 전용, 오른쪽 머리는 RIGHT 타겟 전용 발사
        stationaryLasers.push(new StationaryMissileLaser(this.x - 10, this.y - 26, lDmg, this.missileStat, 0, "LEFT"));
        stationaryLasers.push(new StationaryMissileLaser(this.x + 10, this.y - 26, lDmg, this.missileStat, 0, "RIGHT"));

        if (this.clonePlaneTimer > 0) {
          stationaryLasers.push(new StationaryMissileLaser(this.x + 42 - 10, this.y - 26, lDmg, this.missileStat, 0, "LEFT"));
          stationaryLasers.push(new StationaryMissileLaser(this.x + 42 + 10, this.y - 26, lDmg, this.missileStat, 0, "RIGHT"));
        }
        playTone(740, 0.15, "triangle", -200, 0.1);
      }
    }

    // [기능 3-3] 트윈형 또는 레전드 비행기의 발사속도가 8렙 이상일 때 전자기 펄스 충전 및 방출
    const canUseEmp = (this.pType === 2 || this.getDominantTrait() === "RATE" || ((this.pType === 4 || this.name === "Legend") && this.fireRateStat >= 8));
    if (canUseEmp && this.fireRateStat >= 8) {
      this.lightningTimer += dt;
      const isLv16 = (this.fireRateStat >= 16);
      const fovMult = isLv16 ? 1.4 : 1.0;

      // 충전 타이머 누적
      if (this.lightningTimer < 2.5) {
        this.twinEmpChargingTimer = this.lightningTimer / 2.5;
      } else {
        this.twinEmpChargingTimer = 0; // 발사 후 기두부 원형 펄스 리셋
      }

      // [트윈 8렙 전자기 구체] 예전 초기 원본 타이머 복원: 발동 주기 2.0초, 화면 노출 1.8초
      if (this.lightningTimer >= 2.0) {
        this.lightningTimer = 0;
        this.twinEmpChargingTimer = 0;

        // 트윈 비행기 폭 44px 기준: 8렙 지름 3배(132px, 반경 66px), 16렙 지름 4배(176px, 반경 88px)
        const shipWidth = 44;
        const targetDiameter = isLv16 ? (shipWidth * 4) : (shipWidth * 3);
        const baseR = targetDiameter / 2;

        // 내 비행기 높이(56px)의 4~5배 범위(224px ~ 280px) 사이 랜덤 위치 생성
        const shipHeight = 56;
        const forwardDistance = (shipHeight * 4) + Math.random() * (shipHeight * 1.0);
        const spawnX = Math.max(baseR + 10, Math.min(LOGICAL_WIDTH - baseR - 10, this.x + (Math.random() - 0.5) * 40));
        const spawnY = Math.max(baseR + 20, (this.y - 28) - forwardDistance);

        if (twinFieldBolts.length >= 3) {
          twinFieldBolts.shift();
        }
        twinFieldBolts.push({
          type: "ORB_EMP",
          radius: baseR,
          x: spawnX,
          y: spawnY,
          elapsed: 0.0,
          totalDuration: 1.0, // 예전 초기 노출 시간 1.0초 원복
          dmgTimer: 0.9, // 생성 즉시 닿는 적에게 1차 타격 바로 적용
          dmgVal: this.powerStat
        });
        playTone(900, 0.25, "sawtooth", -250, 0.14);
      }
    }

    if (!Number.isFinite(this.targetX)) this.targetX = this.x;
    if (!Number.isFinite(this.targetY)) this.targetY = this.y;

    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const distSq = dx * dx + dy * dy;

    this.isMovingUp = dy < -2.0;

    if (distSq > 0.25) {
      const dist = Math.sqrt(distSq);
      const maxSpd = CONFIG.BASE_PLAYER_SPEED * 75 * dt;
      const step = Math.min(dist * 0.25, maxSpd);
      this.x += (dx / dist) * step;
      this.y += (dy / dist) * step;
    }
    const maxLimitX = LOGICAL_WIDTH - this.radius - (this.clonePlaneTimer > 0 ? 46 : 10);
    this.x = Math.max(this.radius + 10, Math.min(maxLimitX, this.x));
    this.y = Math.max(this.radius + 10, Math.min(LOGICAL_HEIGHT - this.radius - 10, this.y));
  }
  _fire(px, py, dmg, bullets) {
    if (this.pType === 0) return;

    let isBlackHoleShot = (this.pType === 1 && this.shotCount % 5 === 0);

    if (this.name === "Legend" || this.pType === 4) {
      bullets.push(new Bullet(px, py - 22, 0, -22, dmg, 4.5, "LEGEND"));
      bullets.push(new Bullet(px, py - 22, -1.0, -17, dmg, 4.5, "LEGEND"));
      bullets.push(new Bullet(px, py - 22, 1.0, -17, dmg, 4.5, "LEGEND"));
      playTone(900, 0.08, "triangle", -400, 0.1);
    } else if (this.pType === 2) {
      if (bullets.length <= 80) {
        // 좌우 한 발씩 교차 발사
        const offsetX = (this.twinFireSide === 0) ? -14 : 14;
        this.twinFireSide = 1 - this.twinFireSide;
        bullets.push(new Bullet(px + offsetX, py - 20, 0, -16, dmg, 4.0, "TWIN"));

        // 트윈 전용 날카로운 전기 방전("지지직") 소리
        playTone(1150, 0.045, "sawtooth", -750, 0.09);
        setTimeout(() => {
          playTone(850, 0.03, "sawtooth", -450, 0.07);
        }, 18);
      }
    } else if (this.pType === 1) {
      const mainDmg = dmg * 1.5;

        const isMaxPower = (this.powerStat >= 16);

        bullets.push(new Bullet(px + 22, py - 14, 1.0, -13, subDmg, subRadius, "POWER"));

  }
shoot(curTime, bullets) {
    if (!this.isAlive) return;
    // 트윈 비행기는 교차 발사이므로 발사 간격을 절반으로 하여 연사감 유지
    const fireInterval = (this.pType === 2) ? (this.getFireInterval() * 0.5) : this.getFireInterval();
    if (curTime - this.lastShot >= fireInterval) {
      this.lastShot = curTime;
      this.shotCount++;
      let baseDmg = Math.max(1, this.powerStat || 1);
      if (this.pType === 1) baseDmg = 1 + (this.powerStat - 1) * 2.2;
      // 레전드 비행기 데미지 20% 축소 (0.84 * 0.8 = 0.672)
      const dmgMultiplier = (this.pType === 4 || this.name === "Legend") ? 0.672 : 2.0;
      const dmg = baseDmg * dmgMultiplier;
      this._fire(this.x, this.y, dmg, bullets);
      if (this.clonePlaneTimer > 0) this._fire(this.x + 42, this.y, dmg, bullets);
    }
  }
  draw(curTime) {
    if (!this.isAlive) return;
    const isDoubleDim = (this.clonePlaneTimer > 0 && this.clonePlaneTimer <= 5.0) && (Math.floor(curTime / 0.3) % 2 === 0);
    const isShieldDim = (this.shieldRemain > 0 && this.shieldRemain <= 5.0) && (Math.floor(curTime / 0.3) % 2 === 0);
    const isMissileFlash = (curTime - this.missileFlashTime < 0.15);

    const drawShipAt = (cx, cy, isClone=false) => {
      ctx.save();
      if (isClone && isDoubleDim) ctx.globalAlpha = 0.35;
      ctx.translate(cx, cy);

      let themeColor = "#00f5ff";
      if (this.name === "Legend" || this.pType === 4) themeColor = "#ffd700";
      else if (this.pType === 1) themeColor = "#ff2244";
      else if (this.pType === 2) themeColor = "#00ff66";

      const thrustFlameExtra = this.isMovingUp ? 15 : 0;
      drawVectorPlayer(ctx, this.pType, themeColor, 1.2, thrustFlameExtra, isMissileFlash);

      if (this.laserWeaponTimer > 0) {
        const isFlashing = (curTime - this.laserMuzzleFlashTime) < 0.20;
        drawVectorLaserPod(ctx, -32, 8, isFlashing, curTime);
      }

      // 4. 기두부 충전 펄스: 트윈형 및 레전드 기체(Rate 8렙) 적용
      const showEmpCore = (this.pType === 2 || (this.pType === 4 && this.fireRateStat >= 8));
      if (showEmpCore && this.twinEmpChargingTimer > 0) {
        const pProg = this.twinEmpChargingTimer;
        const pR = Math.max(3, pProg * 12.0);
        const speedMult = 10.0 + pProg * 35.0;
        const noseY = (this.pType === 4) ? -32 : -28;

        ctx.save();
        ctx.strokeStyle = "rgba(0, 245, 255, 0.4)";
        ctx.lineWidth = 1.0;
        ctx.beginPath();
        ctx.arc(0, noseY, pR, 0, Math.PI * 2);
        ctx.stroke();

        const sparkCount = 4;
        for (let s = 0; s < sparkCount; s++) {
          const sparkAng = curTime * speedMult + s * (Math.PI / 2);
          const x1 = Math.cos(sparkAng) * pR * 0.9;
          const y1 = noseY + Math.sin(sparkAng) * pR * 0.9;
          const x2 = Math.cos(sparkAng + Math.PI + (Math.random() - 0.5)) * pR * 0.85;
          const y2 = noseY + Math.sin(sparkAng + Math.PI + (Math.random() - 0.5)) * pR * 0.85;

          ctx.strokeStyle = (s % 2 === 0) ? "#00f5ff" : "#ff007f";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          const midDisp = (Math.random() - 0.5) * (pR * 0.6);
          ctx.lineTo((x1 + x2) / 2 + midDisp, (y1 + y2) / 2 + midDisp);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(0, noseY, 2.0 + pProg * 2.0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    };

    drawShipAt(this.x, this.y, false);
    if (this.clonePlaneTimer > 0) drawShipAt(this.x + 42, this.y, true);

    if (this.shieldRemain > 0) {
      ctx.save();
      if (isShieldDim) ctx.globalAlpha = 0.3;
      ctx.strokeStyle = "rgba(50, 255, 120, 0.9)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 32, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    const timers = [];
    if (this.shieldRemain > 0) timers.push({ label: "SHIELD", val: this.shieldRemain.toFixed(1), col: "#32ff78" });
    if (this.laserWeaponTimer > 0) timers.push({ label: "LASER", val: this.laserWeaponTimer.toFixed(1), col: "#00f5ff" });
    if (this.clonePlaneTimer > 0) timers.push({ label: "TWIN", val: this.clonePlaneTimer.toFixed(1), col: "#78a0ff" });

    if (timers.length > 0) {
      ctx.save();
      ctx.textAlign = "center";
      let startOffset = this.y + this.radius + 16;
      timers.forEach((t) => {
        ctx.font = `bold 11px ${FONT_FAMILY}`;
        ctx.fillStyle = t.col;
        ctx.fillText(t.label, this.x, startOffset);
        ctx.font = `bold 10px ${FONT_FAMILY}`;
        ctx.fillText(`${t.val}s`, this.x, startOffset + 12);
        startOffset += 26;
      });
      ctx.restore();
    }
  }
}

class MissileShadow {
  constructor(x, y, radius, isType0=false) {
    this.x = x; this.y = y;
    // 특수 미사일(isType0) 잔상 크기를 기존 대비 70%로 축소 (radius * 0.5 * 0.7)
    this.radius = isType0 ? (radius * 0.35) : (radius * 0.5);
    this.isType0 = isType0;
    // 꼬리가 길게 늘어지지 않도록 수명을 대폭 단축하여 빠르게 생성되고 소멸 (0.35 -> 0.14)
    this.life = isType0 ? 0.14 : 0.45;
    this.totalLife = this.life;
  }
  update(dt) { this.life -= dt; }
  draw() {
    if (this.life <= 0.02) return;
    const alpha = (this.life / this.totalLife) * 0.65;
    if (alpha < 0.05) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (this.isType0) {
      // 사이안 탄두 본체와 명확히 구분되는 네온 오렌지/고열 앰버 배기 불꽃 색상 적용
      ctx.fillStyle = (Math.random() < 0.4) ? "#ffffff" : "#ff7700";
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = "#ff55bb";
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

// [여기에 추가]
class MissileShard {
  constructor(x, y, missileLv = 1) {
    this.x = x;
    this.y = y;
    this.missileLv = missileLv;
    const ang = Math.random() * Math.PI * 2;
    const spd = 2.0 + Math.random() * 2.5;
    this.vx = Math.cos(ang) * spd;
    this.vy = Math.sin(ang) * spd;
    this.radius = 5.6; // 40% 확대 (4.0 -> 5.6)
    this.life = 2.0;   // 2초 후 소멸
    this.totalLife = 2.0;
    this.rot = Math.random() * Math.PI * 2;
    this.rotSpd = (Math.random() - 0.5) * 8.0;
  }
  update(dt, enemiesList) {
    this.life -= dt;

    // 미사일 8렙 이상: 유효한 일반 적 방향으로 유도 선회
    if (this.missileLv >= 8) {
      let target = null;
      let minDistSq = Infinity;
      for (let i = 0; i < enemiesList.length; i++) {
        const e = enemiesList[i];
        // 회색 돌(isHeavy), 보호막(hasShield), 사망/흡수 중/화면 밖 제외
        if (!e || e.isDead || e.hp <= 0 || e.isBeingSucked || e.isHeavy || e.hasShield || e.y < 20 || e.y > LOGICAL_HEIGHT) continue;
        const dSq = (e.x - this.x) * (e.x - this.x) + (e.y - this.y) * (e.y - this.y);
        if (dSq < minDistSq) {
          minDistSq = dSq;
          target = e;
        }
      }

      if (target) {
        const targetAng = Math.atan2(target.y - this.y, target.x - this.x);
        const curAng = Math.atan2(this.vy, this.vx);
        let diff = targetAng - curAng;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        const turnRate = 9.0 * dt;
        const newAng = curAng + Math.max(-turnRate, Math.min(turnRate, diff));
        const curSpeed = Math.hypot(this.vx, this.vy) || 3.0;
        this.vx = Math.cos(newAng) * curSpeed;
        this.vy = Math.sin(newAng) * curSpeed;
      }
    }

    this.x += this.vx * (dt * 60);
    this.y += this.vy * (dt * 60);
    this.rot += this.rotSpd * dt;

    if (this.life <= 0) return;

    // 충돌 판정 (회색 돌, 보호막 적, 혜성 반응 안 함)
    for (let ei = enemiesList.length - 1; ei >= 0; ei--) {
      const e = enemiesList[ei];
      if (!e || e.isDead || e.hp <= 0 || e.isBeingSucked || e.y < 20) continue;
      if (e.hasShield || e.isHeavy) continue;

      const dSq = (this.x - e.x) * (this.x - e.x) + (this.y - e.y) * (this.y - e.y);
      const hitR = this.radius + e.radius;
      if (dSq <= hitR * hitR) {
        safeKillEnemy(e, "#00f5ff");
        playExplosionSound();
        this.life = 0; // 적 1개 파괴 후 즉시 삭제
        break;
      }
    }
  }
  draw() {
    if (this.life <= 0) return;
    const alpha = Math.max(0, this.life / this.totalLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.fillStyle = "#00f5ff";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.2;
    // 40% 확대된 네온 마름모 (세로 6 -> 8.4, 가로 3 -> 4.2)
    ctx.beginPath();
    ctx.moveTo(0, -8.4);
    ctx.lineTo(4.2, 0);
    ctx.lineTo(0, 8.4);
    ctx.lineTo(-4.2, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

class HomingMissile {
  constructor(x, y, vx, vy, dmg, side="LEFT", isType0=false, isStraight=false, missileLv=1) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.dmg = dmg;
    this.side = side;
    this.isType0 = isType0;
    this.isStraight = isStraight;
    this.missileLv = missileLv;
    // 16렙 미사일형: 개당 50% 확률로 1초 미만(NEW) vs 내 기체 앞쪽 초근접 위협 적(DANGER) 타깃 모드 지정
    this.targetTimeMode = (isType0 && missileLv >= 16) ? (Math.random() < 0.5 ? "NEW" : "DANGER") : "ANY";
    this.radius = isType0 ? 7.5 : 6.0;
    this.life = 4.0;
    this.target = null;
    this.shadowTimer = 0;
    this.currentSpeed = isType0 ? 8.4 : 16.5;
  }
  update(dt, enemiesList) {
    this.life -= dt;
    this.shadowTimer += dt;
    if (this.shadowTimer >= 0.02) {
      this.shadowTimer = 0;
      if (missileShadows.length < 120) {
        missileShadows.push(new MissileShadow(this.x, this.y, this.radius, this.isType0));
      }
    }

    // [추가] 직진 미사일일 경우 유도 로직을 타지 않고 수직 직진 이동
    if (this.isStraight) {
      this.vx = 0;
      this.vy = -(this.currentSpeed || 15.0);
      this.x += this.vx * (dt * 60);
      this.y += this.vy * (dt * 60);
      return;
    }

    const maxYBound = this.isType0 ? (LOGICAL_HEIGHT + 20) : (LOGICAL_HEIGHT * 0.90);

    // 타깃 유효성 검증
    if (!this.target || this.target.hp <= 0 || this.target.isDead || this.target.isBeingSucked || !enemiesList.includes(this.target) || (!this.isType0 && this.target.y > maxYBound)) {
      this.target = null;
      let primaryTarget = null;
      let minPrimaryDistSq = Infinity;
      let fallbackTarget = null;
      let minFallbackDistSq = Infinity;

      const isLv16 = (this.isType0 && this.missileLv >= 16);

      for (let i = 0; i < enemiesList.length; i++) {
        const e = enemiesList[i];
        if (!e || e.hp <= 0 || e.isDead || e.isBeingSucked || e.isHeavy || e.hasShield || e.y < 20 || e.y > maxYBound) continue;

        // [핵심 1] 내 비행기보다 아래로 지나쳐간 적은 뒤쫓지 않음 (U턴 역주행 방지)
        if (player && e.y > player.y) continue;

        const dSq = (e.x - this.x) * (e.x - this.x) + (e.y - this.y) * (e.y - this.y);

        // 기본 폴백 (내 앞쪽 적 중 가장 가까운 적)
        if (dSq < minFallbackDistSq) {
          minFallbackDistSq = dSq;
          fallbackTarget = e;
        }

        // 미사일형(Type 0) 타깃 탐색
        if (this.isType0 && player) {
          if (isLv16) {
            if (this.targetTimeMode === "NEW") {
              // 상단 스폰 적 (1.0초 미만) 중 가장 가까운 적 선제 요격
              if ((e.aliveTime || 0) < 1.0 && dSq < minPrimaryDistSq) {
                minPrimaryDistSq = dSq;
                primaryTarget = e;
              }
            } else {
              // [핵심 2] DANGER 모드: 내 비행기 머리 바로 위에서 내려오는 가장 위협적인 적 타겟팅
              const distToPlayerY = player.y - e.y;
              if (distToPlayerY > 0 && distToPlayerY < minPrimaryDistSq) {
                minPrimaryDistSq = distToPlayerY;
                primaryTarget = e;
              }
            }
          } else {
            // 16렙 미만: 기존 좌/우 측면 적 우선 타겟팅
            const isLeftCandidate = (e.x <= player.x);
            const isRightCandidate = (e.x >= player.x);
            const isSideMatch = (this.side === "LEFT" && isLeftCandidate) || (this.side === "RIGHT" && isRightCandidate);
            if (isSideMatch && dSq < minPrimaryDistSq) {
              minPrimaryDistSq = dSq;
              primaryTarget = e;
            }
          }
        } else if (!this.isType0 && player) {
          if (this.side === "LEFT" && e.x > player.x) continue;
          if (this.side === "RIGHT" && e.x < player.x) continue;
          if (dSq < minPrimaryDistSq) {
            minPrimaryDistSq = dSq;
            primaryTarget = e;
          }
        }
      }

      this.target = primaryTarget || fallbackTarget;
    }

    if (this.target) {
      const angleToTarget = Math.atan2(this.target.y - this.y, this.target.x - this.x);
      const curAngle = Math.atan2(this.vy, this.vx);
      let diff = angleToTarget - curAngle;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;

      // 미사일형 전용 U턴 기동 선회력(12.0) 및 타깃 포착 시 18.0 가속
      const turnRate = (this.isType0 ? 12.0 : 7.0) * dt;
      const newAngle = curAngle + Math.max(-turnRate, Math.min(turnRate, diff));

      if (this.isType0) {
        // 최대 가속 속도 역시 30% 감소 (22.0 -> 15.4)
        this.currentSpeed = Math.min(15.4, this.currentSpeed + 17.5 * dt);
      } else {
        this.currentSpeed = 16.5;
      }

      this.vx = Math.cos(newAngle) * this.currentSpeed;
      this.vy = Math.sin(newAngle) * this.currentSpeed;
    } else {
      // 적이 없으면 기존 각도를 유지하며 위쪽/바깥쪽으로 직진 이탈
      if (this.vy > -5.0) this.vy -= 10.0 * dt;
    }

    this.x += this.vx * (dt * 60);
    this.y += this.vy * (dt * 60);
  }
  draw() {
    ctx.save();
    if (this.isType0) {
      ctx.translate(this.x, this.y);
      ctx.rotate(Math.atan2(this.vy, this.vx) + Math.PI / 2);

      // 카나드 날개 및 버니어 핀
      ctx.fillStyle = "#00f5ff";
      ctx.beginPath();
      ctx.moveTo(-6, 2); ctx.lineTo(-8, 7); ctx.lineTo(-3, 5);
      ctx.moveTo(6, 2); ctx.lineTo(8, 7); ctx.lineTo(3, 5);
      ctx.fill();

      // 50% 대형화된 헤비 마젠타 탄두 바디
      ctx.fillStyle = "#e000ff";
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.lineTo(6, 7);
      ctx.lineTo(0, 3);
      ctx.lineTo(-6, 7);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 고열 플라즈마 코어
      ctx.fillStyle = "#ffe600";
      ctx.beginPath();
      ctx.arc(0, -3, 2.7, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#ff007f";
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(this.x, this.y, 2.0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}
class StationaryMissileLaser {
  constructor(x, y, powerDmg, missileLv, angleOffsetRad = 0, targetSide = "ALL") {

    this.reflectedShards = [];

  }

  calculateChainPath() {
    this.path = [{ x: this.x, y: this.startY }];

      for (let i = 0; i < enemies.length; i++) {

        if (e && !e.isDead && e.hp > 0 && e.y < this.startY && e.y >= 20) {

    if (meteorManager && Array.isArray(meteorManager.meteors)) {

        if (m && m.active && m.y < this.startY && m.y >= 20) {

          if (this.targetSide === "RIGHT" && m.x < this.x - 15) continue;
          if (Math.abs(m.x - this.x) <= m.radius + 14) {
            const hitPointY = m.y + m.radius;
            if (!blockedObj || hitPointY > blockY) {
              blockedObj = m;
              blockedIsEnemy = false;
              blockY = hitPointY;
            }
          }

      }
    }

    let closerEnemy = null;

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.hp <= 0 || e.isDead || e.isHeavy || e.y >= this.startY || e.y < 20) continue;
      // [항목 2] 첫 꺾임 방향 강제: 왼쪽 레이저는 발사구보다 왼쪽의 적만, 오른쪽 레이저는 오른쪽의 적만 1차 조준
      if (this.targetSide === "LEFT" && e.x > this.x - 2) continue;
      if (this.targetSide === "RIGHT" && e.x < this.x + 2) continue;

      if (Math.abs(e.x - this.x) <= maxSearchWidth + e.radius) {
        const dSq = (e.x - this.x) * (e.x - this.x) + (e.y - this.startY) * (e.y - this.startY);
        if (dSq < minD1Sq) { minD1Sq = dSq; closerEnemy = e; }
      }
    }

    // 장애물(돌맹이/혜성)에 부딪힌 경우 레이저가 멈추며 튕겨나오는 파편선 생성
    if (blockedObj && (!closerEnemy || closerEnemy.y < blockY)) {
      this.path.push({ x: this.x, y: blockY });
      if (blockedIsEnemy) {
        this.hitEnemies.push({ enemy: blockedObj, bendCount: 0 });
      }
      this.reflectedShards = [];
      for (let s = 0; s < 5; s++) {
        const shardLen = 35 + Math.random() * 50;
        const ang = Math.PI / 2 + (Math.random() - 0.5) * (Math.PI / 1.8);
        this.reflectedShards.push({
          sx: this.x, sy: blockY,
          ex: this.x + Math.cos(ang) * shardLen,
          ey: blockY + Math.sin(ang) * shardLen
        });
      }
      return;
    }

    if (!closerEnemy) {
      // 적이 없으면 수직 상단으로 관통 직진
      this.path.push({ x: this.x, y: 0 });
      return;
    }

    // 1차 타깃 연결 (첫 꺾임)
    let t1 = closerEnemy;
    let dx1 = t1.x - this.x;
    let dy1 = Math.max(1, this.startY - t1.y);
    let angle1 = Math.atan2(dx1, dy1);
    // 첫 꺾임 각도 클램프 (왼쪽 레이저는 음수 각도만, 오른쪽 레이저는 양수 각도만)
    let clampedAngle1 = (this.targetSide === "LEFT") ? Math.max(-maxBendRad, Math.min(0, angle1)) : Math.max(0, Math.min(maxBendRad, angle1));
    let finalX1 = this.x + Math.sin(clampedAngle1) * dy1;

    this.path.push({ x: finalX1, y: t1.y });
    this.hitEnemies.push({ enemy: t1, bendCount: 0 });

    // 2차 타깃 탐색: 첫 꺾임 이후에는 좌/우 방향 제한 없이 자유롭게 가장 가까운 적 조준
    let t2 = null;
    let minD2Sq = Infinity;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e !== t1 && e.hp > 0 && !e.isDead && !e.isHeavy && e.y < t1.y && e.y >= 20) {
        const dSq = (e.x - finalX1) * (e.x - finalX1) + (e.y - t1.y) * (e.y - t1.y);
        if (dSq < minD2Sq) { minD2Sq = dSq; t2 = e; }
      }
    }

    if (!t2) {
      // [항목 1] 1차 적 타격 후 2차 적이 없어도 상단 끝까지 관통하여 뻗어 나감
      let remainDist = Math.max(0, t1.y);
      this.path.push({ x: finalX1 + Math.sin(clampedAngle1) * remainDist, y: 0 });
      return;
    }

    let dx2 = t2.x - finalX1;
    let dy2 = Math.max(1, t1.y - t2.y);
    let angle2 = Math.atan2(dx2, dy2);
    let clampedAngle2 = Math.max(-maxBendRad, Math.min(maxBendRad, angle2));
    let finalX2 = finalX1 + Math.sin(clampedAngle2) * dy2;

    this.path.push({ x: finalX2, y: t2.y });
    this.hitEnemies.push({ enemy: t2, bendCount: 1 });

    // 3차 타깃 탐색: 좌/우 방향 제한 없이 자유 조준
    let t3 = null;
    let minD3Sq = Infinity;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e !== t1 && e !== t2 && e.hp > 0 && !e.isDead && !e.isHeavy && e.y < t2.y && e.y >= 20) {
        const dSq = (e.x - finalX2) * (e.x - finalX2) + (e.y - t2.y) * (e.y - t2.y);
        if (dSq < minD3Sq) { minD3Sq = dSq; t3 = e; }
      }
    }

    if (!t3) {
      // [항목 1] 2차 적 타격 후 상단 끝까지 관통 연장
      let remainDist = Math.max(0, t2.y);
      this.path.push({ x: finalX2 + Math.sin(clampedAngle2) * remainDist, y: 0 });
      return;
    }

    let dx3 = t3.x - finalX2;
    let dy3 = Math.max(1, t2.y - t3.y);
    let angle3 = Math.atan2(dx3, dy3);
    let clampedAngle3 = Math.max(-maxBendRad, Math.min(maxBendRad, angle3));
    let finalX3 = finalX2 + Math.sin(clampedAngle3) * dy3;

    this.path.push({ x: finalX3, y: t3.y });
    this.hitEnemies.push({ enemy: t3, bendCount: 2 });

    // [항목 1] 3차 적 타격 후에도 상단 끝까지 완전히 관통
    let finalRemainDist = Math.max(0, t3.y);
    this.path.push({ x: finalX3 + Math.sin(clampedAngle3) * finalRemainDist, y: 0 });
  }

  update(dt, enemiesList) {
    this.life -= dt;
    this.damageTickTimer += dt;
    if (this.damageTickTimer >= 0.20) {
      this.damageTickTimer = 0;
      const curTickTime = performance.now() / 1000;
      for (let i = 0; i < this.hitEnemies.length; i++) {
        const target = this.hitEnemies[i];
        if (!target || !target.enemy) continue;
        const e = target.enemy;
        if (typeof e.hp === "number" && !e.isDead && e.hp > 0) {
          // 1. 회색 돌맹이 및 보호막 적: 2줄기가 동시 타격해도 1줄기 카운트만 유지
          if ((e.isHeavy || e.hasShield)) {
            if (e.lastMissileLaserTick && (curTickTime - e.lastMissileLaserTick < 0.15)) {
              continue;
            }
            e.lastMissileLaserTick = curTickTime;
            const actualDmg = this.powerDmg * Math.pow(0.7, target.bendCount || 0);
            applyDamageToEnemy(e, actualDmg, "MISSILE_NEEDLE", false);
            continue;
          }

          // 2. [항목 3] 일반 적 비행기: 2줄기 레이저의 공격선 안에 동시에 걸리면 각각 50%씩 반영
          let isSimultaneousHit = false;
          if (e.lastGeneralLaserTick && (curTickTime - e.lastGeneralLaserTick < 0.15)) {
            isSimultaneousHit = true;
          }
          e.lastGeneralLaserTick = curTickTime;

          // 동시 피격 시 50% 데미지, 단독 피격 시 100% 데미지
          const damageRatio = isSimultaneousHit ? 0.50 : 1.0;
          const actualDmg = this.powerDmg * Math.pow(0.7, target.bendCount || 0) * damageRatio;
          applyDamageToEnemy(e, actualDmg, "MISSILE_NEEDLE", false);
        }
      }

      if (this.reflectedShards && this.reflectedShards.length > 0) {
        const shardCount = this.reflectedShards.length;
        const enemyCount = enemiesList.length;
        for (let s = 0; s < shardCount; s++) {
          const sh = this.reflectedShards[s];
          for (let i = 0; i < enemyCount; i++) {
            const e = enemiesList[i];
            if (!e || e.isDead || e.hp <= 0) continue;
            const hitR = e.radius + 15;
            const dx = e.x - sh.ex;
            if (Math.abs(dx) > hitR) continue;
            const dy = e.y - sh.ey;
            if (Math.abs(dy) > hitR) continue;
            if (dx * dx + dy * dy <= hitR * hitR) {
              applyDamageToEnemy(e, this.powerDmg * 0.7, "MISSILE_NEEDLE", true);
            }
          }
        }
      }

      if (currentBoss && currentBoss.hp > 0) {
        for (let i = 0; i < this.path.length - 1; i++) {
          const segX = this.path[i].x;
          if (Math.abs(segX - currentBoss.x) <= currentBoss.radius + 8) {
            currentBoss.hp -= 1.0; // 보스 파괴 횟수 2배 증가 (2 -> 1)
            hitImpacts.push(new BulletHitImpactFX(currentBoss.x, currentBoss.y, "MISSILE_NEEDLE"));
            playTone(450, 0.08, "triangle", 0, 0.08);
            if (currentBoss.hp <= 0) {
              score += 100;
              bossDropItems.push(new BossDropItem(currentBoss.x, currentBoss.y));
              currentBoss = null;
              playExplosionSound();
            }
            break;
          }
        }
      }
    }
  }

  draw() {
    if (this.life <= 0 || this.path.length < 2) return;
    const progress = 1.0 - (this.life / this.totalLife);
    const alpha = Math.max(0, this.life / this.totalLife);

    const bottomCutLength = (this.startY - this.path[1].y) * 0.20 * Math.pow(progress, 0.6);
    const firstY = this.startY - bottomCutLength;

    ctx.save();
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    const startPt = this.path[0];
    const endPt = this.path[this.path.length - 1];
    const beamGradOuter = ctx.createLinearGradient(startPt.x, startPt.y, endPt.x, endPt.y);
    beamGradOuter.addColorStop(0, `rgba(0, 245, 255, ${0.45 * alpha})`);
    beamGradOuter.addColorStop(0.5, `rgba(0, 220, 255, ${0.28 * alpha})`);
    beamGradOuter.addColorStop(1, `rgba(0, 180, 255, ${0.12 * alpha})`);

    const beamGradInner = ctx.createLinearGradient(startPt.x, startPt.y, endPt.x, endPt.y);
    beamGradInner.addColorStop(0, `rgba(255, 255, 255, ${1.0 * alpha})`);
    beamGradInner.addColorStop(0.5, `rgba(230, 250, 255, ${0.65 * alpha})`);
    beamGradInner.addColorStop(1, `rgba(200, 240, 255, ${0.25 * alpha})`);

    ctx.strokeStyle = beamGradOuter;
    ctx.lineWidth = 4.80; // 6.86 대비 30% 슬림화
    ctx.beginPath();
    ctx.moveTo(this.path[0].x, firstY);
    for (let i = 1; i < this.path.length; i++) ctx.lineTo(this.path[i].x, this.path[i].y);
    ctx.stroke();

    ctx.strokeStyle = beamGradInner;
    ctx.lineWidth = 1.37; // 1.96 대비 30% 슬림화
    ctx.beginPath();
    ctx.moveTo(this.path[0].x, firstY);
    for (let i = 1; i < this.path.length; i++) ctx.lineTo(this.path[i].x, this.path[i].y);
    ctx.stroke();

    if (this.reflectedShards.length > 0) {
      for (let s = 0; s < this.reflectedShards.length; s++) {
        const sh = this.reflectedShards[s];
        const shardGrad = ctx.createLinearGradient(sh.sx, sh.sy, sh.ex, sh.ey);
        shardGrad.addColorStop(0, `rgba(0, 245, 255, ${0.9 * alpha})`);
        shardGrad.addColorStop(0.5, `rgba(0, 220, 255, ${0.35 * alpha})`);
        shardGrad.addColorStop(1, "rgba(0, 180, 255, 0)");

        ctx.strokeStyle = shardGrad;
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.moveTo(sh.sx, sh.sy);
        ctx.lineTo(sh.ex, sh.ey);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

class BulletHitImpactFX {
  constructor(x, y, bulletType) {
    this.x = x; this.y = y;
    this.bulletType = bulletType;
    this.life = 0.2;
    this.totalLife = 0.2;
  }
  update(dt) { this.life -= dt; }
  draw() {
    if (this.life <= 0) return;
    const alpha = Math.max(0, this.life / this.totalLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(this.x, this.y);

    if (this.bulletType === "LEGEND") {
      ctx.strokeStyle = "#ffd700";
      ctx.lineWidth = 2.0;
      for (let i = 0; i < 8; i++) {
        const rad = (i * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(Math.cos(rad) * 4, Math.sin(rad) * 4);
        ctx.lineTo(Math.cos(rad) * 14, Math.sin(rad) * 14);
        ctx.stroke();
      }
    } else if (this.bulletType === "POWER" || this.bulletType === "BLACK_HOLE") {
      ctx.strokeStyle = "#ff0055";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, (1.0 - alpha) * 18 + 4, 0, Math.PI * 2);
      ctx.stroke();
    } else if (this.bulletType === "TWIN") {
      ctx.strokeStyle = "#00ff66";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-10, -6); ctx.lineTo(0, 0); ctx.lineTo(10, -8);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-6, 8); ctx.lineTo(0, 0); ctx.lineTo(8, 6);
      ctx.stroke();
    } else {
      ctx.strokeStyle = "#00f5ff";
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.moveTo(-8, 0); ctx.lineTo(8, 0);
      ctx.moveTo(0, -8); ctx.lineTo(0, 8);
      ctx.stroke();
    }
    ctx.restore();
  }
}

class Meteor {
  constructor(themeIndex, side, spawnY) {
    this.theme = METEOR_THEMES[themeIndex % METEOR_THEMES.length];
    this.side = side;
    this.radius = 24;
    this.tailLength = 225;
    this.tailWidth = this.radius * 0.95 * 0.70;
    this.headShapeType = Math.floor(Math.random() * 5);
    this.rotSpeed = 4.5 * 1.30;

    this.craters = Array.from({ length: 7 }, () => {
      const ang = Math.random() * Math.PI * 2;
      const dist = Math.random() * (this.radius * 0.65);
      return { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist, r: 1.8 + Math.random() * 2.8 };
    });

    const speed = 3.75;
    const targetX = LOGICAL_WIDTH * 0.5;
    const targetY = LOGICAL_HEIGHT;

    const isTopSpawn = Math.random() < 0.5;
    if (isTopSpawn) {
      this.y = -60;
      this.x = this.side === "left" ? Math.random() * (LOGICAL_WIDTH * 0.35) : LOGICAL_WIDTH * 0.65 + Math.random() * (LOGICAL_WIDTH * 0.35);
    } else {
      this.y = spawnY;
      this.x = this.side === "left" ? -60 : LOGICAL_WIDTH + 60;
    }

    const angle = Math.atan2(targetY - this.y, targetX - this.x);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.coreAngle = 0;
    this.active = true;
    this.isBeingSucked = false;
  }
  update(dt) {
    if (this.isBeingSucked) return;
    this.x += this.vx * (dt * 60);
    this.y += this.vy * (dt * 60);
    this.coreAngle += this.rotSpeed * dt;
    if (this.y > LOGICAL_HEIGHT + 240 || (this.side === "left" && this.x > LOGICAL_WIDTH + 240) || (this.side === "right" && this.x < -240)) {
      this.active = false;
    }
  }
  draw() {
    ctx.save();
    const moveAngle = Math.atan2(this.vy, this.vx);
    const tailAngle = moveAngle + Math.PI;
    const tailTipX = this.x + Math.cos(tailAngle) * this.tailLength;
    const tailTipY = this.y + Math.sin(tailAngle) * this.tailLength;

    ctx.globalAlpha = 0.75;
    const tailGrad = ctx.createLinearGradient(this.x, this.y, tailTipX, tailTipY);
    tailGrad.addColorStop(0, this.theme.mid);
    tailGrad.addColorStop(0.35, this.theme.outer);
    tailGrad.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = tailGrad;
    ctx.beginPath();
    const perpAngle = moveAngle + Math.PI / 2;
    ctx.moveTo(this.x + Math.cos(perpAngle) * this.tailWidth, this.y + Math.sin(perpAngle) * this.tailWidth);
    ctx.lineTo(tailTipX, tailTipY);
    ctx.lineTo(this.x - Math.cos(perpAngle) * this.tailWidth, this.y - Math.sin(perpAngle) * this.tailWidth);
    ctx.closePath();
    ctx.fill();

    ctx.translate(this.x, this.y);
    ctx.rotate(this.coreAngle);

    const r = this.radius;
    ctx.fillStyle = this.theme.core;
    ctx.strokeStyle = this.theme.outer;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    if (this.headShapeType === 0) {
      ctx.moveTo(0, -r); ctx.lineTo(r * 0.9, -r * 0.6); ctx.lineTo(r * 0.7, r * 0.7); ctx.lineTo(-r * 0.4, r * 1.1); ctx.lineTo(-r * 1.0, -r * 0.2);
    } else if (this.headShapeType === 1) {
      ctx.moveTo(-r * 0.5, -r * 0.9); ctx.lineTo(r * 0.8, -r * 0.8); ctx.lineTo(r * 1.1, r * 0.3); ctx.lineTo(r * 0.2, r * 1.0); ctx.lineTo(-r * 0.9, r * 0.6);
    } else if (this.headShapeType === 2) {
      ctx.moveTo(0, -r * 1.1); ctx.lineTo(r * 1.0, -r * 0.2); ctx.lineTo(r * 0.8, r * 0.9); ctx.lineTo(-r * 0.8, r * 0.8); ctx.lineTo(-r * 1.1, -r * 0.4);
    } else if (this.headShapeType === 3) {
      ctx.moveTo(-r * 0.2, -r * 1.0); ctx.lineTo(r * 1.1, -r * 0.3); ctx.lineTo(r * 0.6, r * 1.0); ctx.lineTo(-r * 0.6, r * 0.9); ctx.lineTo(-r * 1.0, -r * 0.1);
    } else {
      ctx.moveTo(0, -r * 0.9); ctx.lineTo(r * 0.9, -r * 0.5); ctx.lineTo(r * 1.1, r * 0.6); ctx.lineTo(-r * 0.3, r * 1.0); ctx.lineTo(-r * 1.1, 0);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    this.craters.forEach(cr => {
      ctx.fillStyle = "#110408";
      ctx.beginPath(); ctx.arc(cr.x, cr.y, cr.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = this.theme.outer; ctx.lineWidth = 1.0; ctx.stroke();
    });

    ctx.restore();
  }
}

class MeteorManager {
  constructor() { this.reset(); }
  reset() {
    this.meteors = [];
    this.pendingQueue = [];
    this.warningActive = false;
    this.warningStartTime = 0;
    this.nextSpawnTime = 40.0;
  }
  scheduleMeteor(spawnTime) {
    const side = Math.random() < 0.5 ? "left" : "right";
    const spawnY = Math.random() * (LOGICAL_HEIGHT * 0.25);
    const themeIdx = Math.floor(Math.random() * METEOR_THEMES.length);
    this.pendingQueue.push({ triggerAt: spawnTime, side, spawnY, themeIdx, warned: false });
  }
  update(dt, elapsed, player, bulletsList, enemiesList) {
    if (elapsed < 40.0) {
      this.meteors = [];
      this.pendingQueue = [];
      this.warningActive = false;
      return;
    }

    if (elapsed >= this.nextSpawnTime) {
      this.scheduleMeteor(elapsed + 3.0);
      this.nextSpawnTime = elapsed + 25.0 + Math.random() * 15.0;
    }

    for (let i = this.pendingQueue.length - 1; i >= 0; i--) {
      const p = this.pendingQueue[i];
      if (!p.warned && elapsed >= p.triggerAt - 3.0) {
        p.warned = true;
        this.warningActive = true;
        this.warningStartTime = elapsed;
        playMeteorWarningSound();
      }
      if (elapsed >= p.triggerAt) {
        this.meteors.push(new Meteor(p.themeIdx, p.side, p.spawnY));
        this.pendingQueue.splice(i, 1);
      }
    }

    if (this.warningActive && elapsed - this.warningStartTime >= 3.0) this.warningActive = false;

    for (let mi = this.meteors.length - 1; mi >= 0; mi--) {
      const m = this.meteors[mi];
      m.update(dt);
      if (!m.active) { this.meteors.splice(mi, 1); continue; }

      if (m.y < 20 || m.isBeingSucked) continue;

      for (let ei = 0; ei < enemiesList.length; ei++) {
        const e = enemiesList[ei];
        if (!e.isDead && e.hp > 0) {
          const dSq = (e.x - m.x) * (e.x - m.x) + (e.y - m.y) * (e.y - m.y);
          const radSum = e.radius + m.radius;
          if (dSq < radSum * radSum) {
            safeKillEnemy(e, e.isHeavy ? "#cbd5e1" : "#ff7700");
            playExplosionSound();
          }
        }
      }

      for (let bi = bulletsList.length - 1; bi >= 0; bi--) {
        const b = bulletsList[bi];
        const dSq = (b.x - m.x) * (b.x - m.x) + (b.y - m.y) * (b.y - m.y);
        const radSum = b.radius + m.radius;
        if (dSq < radSum * radSum) {
          hitImpacts.push(new BulletHitImpactFX(b.x, b.y, b.bulletType));
          if (b.isBlackHoleTrigger) {
            blackHoles.push(new BlackHole(b.x, b.y, 25));
          }
          bulletsList.splice(bi, 1);
          explosions.push(new ExplosionFX(b.x, b.y, "#ff7700"));
          playTone(400, 0.05, "sawtooth", 0, 0.08);
        }
      }

      if (player && player.isAlive && !m.isBeingSucked) {
        const shieldDist = player.radius + 32;
        const mdx = m.x - player.x;
        const mdy = m.y - player.y;
        const mDistSq = mdx * mdx + mdy * mdy;
        const minDist = shieldDist + m.radius;
        if (player.shieldRemain > 0 && mDistSq < minDist * minDist) {
          const pushAng = Math.atan2(mdy, mdx);
          m.x = player.x + Math.cos(pushAng) * minDist;
          m.y = player.y + Math.sin(pushAng) * minDist;
          m.vx = Math.cos(pushAng) * 4.0;
        } else if (player.shieldRemain <= 0 && mDistSq < (player.radius + m.radius) * (player.radius + m.radius)) {
          triggerPlayerCinematicDeath(m.x, m.y);
        }
      }
    }
  }
  drawWarning() {
    if (!this.warningActive) return;
    const curTime = performance.now() / 1000;
    if (Math.floor(curTime / 0.15) % 2 === 0) {
      ctx.save();
      ctx.textAlign = "center";
      ctx.fillStyle = "#ff2200";
      ctx.font = `bold 16px ${FONT_FAMILY}`;
      ctx.fillText("⚠ WARNING: GIANT METEOR INCOMING! ⚠", LOGICAL_WIDTH / 2, 198);
      ctx.restore();
    }
  }
  drawMeteors() { this.meteors.forEach(m => m.draw()); }
}

class Star {
  constructor() {
    this.x = Math.random() * LOGICAL_WIDTH;
    this.y = Math.random() * LOGICAL_HEIGHT;
    this.depth = Math.random();
    this.speed = 0.5 + Math.pow(this.depth, 2) * 3.7;
    // 개별 크기 지금 대비 20% 축소 (기존 0.7~3.0 -> 0.56~2.4)
    this.size = (0.7 + this.depth * 2.3) * 0.80;
    // 전체 밝기 지금 대비 20% 투명하게 축소 (Alpha 0.8배)
    this.baseAlpha = (0.20 + this.depth * 0.75) * 0.80;
    
    // 한 화면 기준 3% 확률로 반짝이는 특별한 색상 별 지정
    this.isSpecial = Math.random() < 0.03;
    if (this.isSpecial) {
      const specialColors = ["#00f5ff", "#ff007f", "#ffe600", "#39ff14", "#d946ef"];
      this.specialColor = specialColors[Math.floor(Math.random() * specialColors.length)];
      this.twinklePhase = Math.random() * Math.PI * 2;
    } else {
      this.specialColor = null;
    }
  }
  update(speedMult = 1.0) {
    this.y += this.speed * speedMult;
    if (this.y > LOGICAL_HEIGHT) {
      this.y = 0;
      this.x = Math.random() * LOGICAL_WIDTH;
    }
  }
  draw() {
    ctx.save();
    if (this.isSpecial) {
      // 3% 반짝이는 별: 밝기가 주기적으로 깜빡임
      const curT = performance.now() / 1000;
      const twinkle = Math.sin(curT * 6.0 + this.twinklePhase) * 0.35 + 0.65;
      ctx.globalAlpha = this.baseAlpha * twinkle;
      ctx.fillStyle = this.specialColor;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 1.25, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // 일반 흰색/은백색 별
      ctx.globalAlpha = this.baseAlpha;
      ctx.fillStyle = "#e2e8f0";
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

class Comet {
  constructor() { this.reset(); }
  reset() {
    this.active = false;
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.length = 0; this.alpha = 0;
  }
  spawn() {
    this.active = true;
    this.x = Math.random() * (LOGICAL_WIDTH * 0.8);
    this.y = -20;
    const speed = 4.0 + Math.random() * 3.5;
    const angle = (55 + Math.random() * 20) * (Math.PI / 180);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.length = 45 + Math.random() * 45;
    this.alpha = 0.15 + Math.random() * 0.2;
  }
  update(dt) {
    if (!this.active) return;
    this.x += this.vx * (dt * 60);
    this.y += this.vy * (dt * 60);
    if (this.x > LOGICAL_WIDTH + 60 || this.y > LOGICAL_HEIGHT + 60) this.active = false;
  }
  draw() {
    if (!this.active) return;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    const tailX = this.x - (this.vx * (this.length / 8));
    const tailY = this.y - (this.vy * (this.length / 8));
    const grad = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
    grad.addColorStop(0, "rgba(0, 245, 255, 0)");
    grad.addColorStop(1, "rgba(255, 255, 255, 0.95)");
    ctx.strokeStyle = grad; ctx.lineWidth = 2.0;
    ctx.beginPath(); ctx.moveTo(tailX, tailY); ctx.lineTo(this.x, this.y); ctx.stroke();
    ctx.restore();
  }
}

class SuckingEntityFX {
  constructor(obj, bhX, bhY, type) {
    this.bhX = bhX;
    this.bhY = bhY;
    this.life = 0.45;
    this.totalLife = 0.45;
    this.dustParticles = Array.from({ length: 12 }, () => {
      const offsetDist = Math.random() * (obj.radius || 15);
      const offsetAng = Math.random() * Math.PI * 2;
      const px = obj.x + Math.cos(offsetAng) * offsetDist;
      const py = obj.y + Math.sin(offsetAng) * offsetDist;
      return {
        dist: Math.hypot(px - bhX, py - bhY),
        angle: Math.atan2(py - bhY, px - bhX),
        size: 1.5 + Math.random() * 2.0,
        speedFactor: 12.0 + Math.random() * 6.0
      };
    });
  }
  update(dt) {
    this.life -= dt;
    this.dustParticles.forEach(p => {
      p.angle -= dt * p.speedFactor;
      p.dist *= Math.pow(0.04, dt);
    });
  }
  draw() {
    if (this.life <= 0) return;
    const progress = Math.max(0, this.life / this.totalLife);
    ctx.save();
    ctx.globalAlpha = progress;
    ctx.fillStyle = "#d044ff";
    this.dustParticles.forEach(p => {
      const dx = this.bhX + Math.cos(p.angle) * p.dist;
      const dy = this.bhY + Math.sin(p.angle) * p.dist;
      ctx.beginPath();
      ctx.arc(dx, dy, p.size * progress, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }
}

class BlackHole {
  constructor(x, y, baseRadius) {
    this.x = x; this.y = y;
    this.baseRadius = (baseRadius * 1.5) * 1.5;
    this.life = 2.0 * 1.3;
    this.totalLife = this.life;
    this.rotAngle = 0;
    this.absorbedCount = 0;
  }
  update(dt, enemiesList) {
    this.life -= dt;
    this.rotAngle -= dt * ((Math.PI * 2) / 2.0);

    const curR = this.baseRadius * (1.0 + Math.sin(this.life * 8) * 0.08);

    for (let ei = enemiesList.length - 1; ei >= 0; ei--) {
      if (this.absorbedCount >= 2) break;
      const e = enemiesList[ei];
      if (e.y < 20 || e.isDead || e.hp <= 0 || e.isBeingSucked) continue;
      const dSq = (e.x - this.x) * (e.x - this.x) + (e.y - this.y) * (e.y - this.y);
      const hitR = curR + e.radius;
      if (dSq <= hitR * hitR) {
        e.isBeingSucked = true;
        suckingEntities.push(new SuckingEntityFX(e, this.x, this.y, "ENEMY"));
        score += 1;
        safeKillEnemy(e, "#bf00ff");
        this.absorbedCount++;
        if (this.absorbedCount >= 2) {
          this.life = 0;
          return;
        }
      }
    }

    if (this.absorbedCount < 2) {
      for (let mi = 0; mi < meteorManager.meteors.length; mi++) {
        if (this.absorbedCount >= 2) break;
        const m = meteorManager.meteors[mi];
        if (m.active && m.y >= 20 && !m.isBeingSucked) {
          const dSq = (m.x - this.x) * (m.x - this.x) + (m.y - this.y) * (m.y - this.y);
          const hitR = curR + m.radius;
          if (dSq <= hitR * hitR) {
            m.isBeingSucked = true;
            m.active = false;
            suckingEntities.push(new SuckingEntityFX(m, this.x, this.y, "METEOR"));
            score += 1;
            this.absorbedCount++;
            if (this.absorbedCount >= 2) {
              this.life = 0;
            }
          }
        }
      }
    }
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotAngle);

    const r = this.baseRadius;
    ctx.strokeStyle = "rgba(191, 0, 255, 0.75)";
    ctx.lineWidth = 2.2;
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate((i * Math.PI) / 2);
      ctx.beginPath();
      for (let theta = 0; theta < Math.PI * 1.5; theta += 0.1) {
        const spiralR = (r * 0.75) * (theta / (Math.PI * 1.5));
        const sx = Math.cos(theta) * spiralR;
        const sy = Math.sin(theta) * spiralR;
        if (theta === 0) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      }
      ctx.stroke();
      ctx.restore();
    }

    const coreGrad = ctx.createRadialGradient(0, 0, 1, 0, 0, r * 0.65);
    coreGrad.addColorStop(0, "#000000");
    coreGrad.addColorStop(0.5, "rgba(35, 0, 60, 0.9)");
    coreGrad.addColorStop(1, "rgba(191, 0, 255, 0)");
    ctx.fillStyle = coreGrad;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.65, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }
}

class RockDebrisFX {
  constructor(x, y) {
    this.x = x; this.y = y;
    // 잔재 소멸 시간 40% 단축 (2.0초 -> 1.2초)
    this.life = 1.2;
    this.totalLife = 1.2;
    this.shards = Array.from({ length: 6 }, (_, idx) => {
      const ang = (idx * Math.PI / 3) + (Math.random() - 0.5) * 0.4;
      const spd = (1.5 + Math.random() * 2.5) * 0.5;
      return { x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, size: 7 + Math.random() * 4, rot: Math.random() * Math.PI, rotSpd: (Math.random() - 0.5) * 4 };
    });
  }
  update(dt) {
    this.life -= dt;
    this.shards.forEach(s => {
      s.x += s.vx * (dt * 60);
      s.y += s.vy * (dt * 60);
      s.rot += s.rotSpd * dt;
    });
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life / this.totalLife);
    this.shards.forEach(s => {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.fillStyle = "#cbd5e1";
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1;
      ctx.strokeRect(-s.size / 2, -s.size / 2, s.size, s.size);
      ctx.fillRect(-s.size / 2, -s.size / 2, s.size, s.size);

    });
