function sanitizeText(str) {
  if (!str) return "Unknown";
  return String(str).replace(/[^\w\s\uAC00-\uD7A3.-]/gi, '').trim().substring(0, 10) || "Unknown";
}

function drawRoundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function drawStarShape(c, cx, cy, spikes, outerRadius, innerRadius) {
  let rot = Math.PI / 2 * 3;
  let x = cx, y = cy;
  let step = Math.PI / spikes;
  c.beginPath();
  c.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerRadius;
    y = cy + Math.sin(rot) * outerRadius;
    c.lineTo(x, y);
    rot += step;
    x = cx + Math.cos(rot) * innerRadius;
    y = cy + Math.sin(rot) * innerRadius;
    c.lineTo(x, y);
    rot += step;
  }
  c.lineTo(cx, cy - outerRadius);
  c.closePath();
}

// 모바일 발열 개선: 정적 성운 배경을 오프스크린 캔버스에 1회 캐싱
const bgOffscreen = document.createElement("canvas");
bgOffscreen.width = LOGICAL_WIDTH;
bgOffscreen.height = LOGICAL_HEIGHT;
const bgCtx = bgOffscreen.getContext("2d");

function initNebulaCache() {
  const bgGrad = bgCtx.createLinearGradient(0, 0, 0, LOGICAL_HEIGHT);
  bgGrad.addColorStop(0, "#03020c");
  bgGrad.addColorStop(0.5, "#060718");
  bgGrad.addColorStop(1, "#02030d");
  bgCtx.fillStyle = bgGrad;
  bgCtx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

  // 좌상단 성운 투명도 20% 증가 (0.16 -> 0.20, 0.10 -> 0.12)
  const neb1 = bgCtx.createRadialGradient(90, 190, 15, 90, 190, 225);
  neb1.addColorStop(0, "rgba(195, 220, 255, 0.20)");
  neb1.addColorStop(0.45, "rgba(105, 50, 185, 0.12)");
  neb1.addColorStop(1, "rgba(0, 0, 0, 0)");
  bgCtx.fillStyle = neb1;
  bgCtx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

  // 우하단 성운 투명도 20% 증가 (0.14 -> 0.17, 0.08 -> 0.10)
  const neb2 = bgCtx.createRadialGradient(350, 640, 20, 350, 640, 245);
  neb2.addColorStop(0, "rgba(215, 240, 255, 0.17)");
  neb2.addColorStop(0.5, "rgba(0, 195, 245, 0.10)");
  neb2.addColorStop(1, "rgba(0, 0, 0, 0)");
  bgCtx.fillStyle = neb2;
  bgCtx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
}
initNebulaCache();

// =================================================================
// 2. 국가 및 리더보드

let userCountry = "Vietnam";
let sessionSecurityKey = Math.random().toString(36).substring(2, 10);
let sessionStartTime = performance.now();

try {
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || "").toLowerCase();
  const offset = new Date().getTimezoneOffset();
  if (tz.includes("ho_chi_minh") || tz.includes("hanoi") || tz.includes("bangkok") || offset === -420) {
    userCountry = "Vietnam";
  } else if (tz.includes("seoul") || offset === -540) {
    userCountry = "Korea";
  } else if (tz.includes("tokyo")) {
    userCountry = "Japan";
  } else if (tz.includes("shanghai") || tz.includes("beijing")) {

  } else if (tz.includes("new_york") || tz.includes("los_angeles") || tz.includes("chicago")) {

} catch(e){}

setTimeout(() => {

    fetch("https://ipapi.co/json/")
      .then(r => r.json())
      .then(d => { 
        if (d && (d.country_name || d.country)) {
          let c = d.country_name || d.country;
          if (c === "Viet Nam" || c === "VN") userCountry = "Vietnam";
          else if (c === "South Korea" || c === "KR") userCountry = "Korea";
          else userCountry = c;

      }).catch(() => {});

}, 30);

let top10List = [];
function fetchTop10() {
  try {
    fetch(FIREBASE_URL)
      .then(r => r.json())
      .then(data => {
        if (data) {
          const items = Object.values(data).filter(v => v && v.name && v.score !== undefined);
          items.sort((a, b) => b.score - a.score);
          top10List = items.slice(0, 10).map(v => ({
            name: sanitizeText(v.name),
            score: Math.floor(Number(v.score) || 0),
            country: sanitizeText(v.country) || "Global"
          }));
        }
      }).catch(() => {});
  } catch(e){}
}
fetchTop10();

function uploadScore(name, finalScore) {
  const cleanName = sanitizeText(name);
  if (!cleanName || cleanName === "Unknown") return;
  const durationSec = Math.max(1, (performance.now() - sessionStartTime) / 1000);
  if (finalScore < 0 || finalScore > durationSec * 60 + 500) return;

  let finalCountry = userCountry;
  if (!finalCountry || finalCountry === "Global") {
    const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || "").toLowerCase();
    const offset = new Date().getTimezoneOffset();
    if (tz.includes("ho_chi_minh") || tz.includes("hanoi") || offset === -420) finalCountry = "Vietnam";
    else if (tz.includes("seoul") || offset === -540) finalCountry = "Korea";
    else finalCountry = "Vietnam";
  }

  try {
    fetch(FIREBASE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: cleanName,
        score: Math.floor(finalScore),
        country: sanitizeText(finalCountry),
        token: sessionSecurityKey,
        time: Date.now() / 1000
      })
    }).then(() => fetchTop10()).catch(() => {});
  } catch(e){}
}

// =================================================================
// 3. Web Audio 사운드 엔진
// =================================================================
let audioCtx = null;
let bgmInterval = null;
let bgmStep = 0;
let currentBgmMode = "select";
let inGameBgmTrack = 0;

function initAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      startBGMEngine();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}

function playTone(freq, duration, type="sine", sweep=0, vol=0.15) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    const now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(freq, now);
    if (sweep !== 0) osc.frequency.linearRampToValueAtTime(freq + sweep, now + duration);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  } catch(e){}
}

function playMeteorWarningSound() {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.type = "sawtooth";
    osc2.type = "square";
    osc1.frequency.setValueAtTime(340, now);
    osc1.frequency.linearRampToValueAtTime(130, now + 0.38);
    osc2.frequency.setValueAtTime(345, now);
    osc2.frequency.linearRampToValueAtTime(135, now + 0.38);
    gain.gain.setValueAtTime(0.24, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    osc1.connect(gain); osc2.connect(gain);
    gain.connect(audioCtx.destination);
    osc1.start(now); osc2.start(now);
    osc1.stop(now + 0.38); osc2.stop(now + 0.38);
  } catch(e){}
}

function playExplosionSound() {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const dur = 0.22;
    const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < buf.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / buf.length);
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    src.buffer = buf;
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(now);
  } catch(e){}
}

function startBGMEngine() {
  if (bgmInterval) return;
  const selectMelody = [261.63, 293.66, 329.63, 392.00];
  const inGameTrack1 = [130.81, 164.81, 196.00, 246.94, 261.63, 329.63];
  const inGameTrack2 = [146.83, 174.61, 220.00, 261.63, 293.66, 349.23];
  const inGameTrack3 = [110.00, 130.81, 146.83, 164.81, 220.00, 261.63];

  bgmInterval = setInterval(() => {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;

    if (currentBgmMode === "select") {
      if (bgmStep % 4 === 0) {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = "sine";
        const f = selectMelody[(bgmStep / 4) % selectMelody.length];
        osc.frequency.setValueAtTime(f, now);
        g.gain.setValueAtTime(0.03, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.45);
      }
    } else {
      let activeTrack = inGameBgmTrack === 0 ? inGameTrack1 : (inGameBgmTrack === 1 ? inGameTrack2 : inGameTrack3);
      if (bgmStep % 2 === 0) {
        const bOsc = audioCtx.createOscillator();
        const bG = audioCtx.createGain();
        bOsc.type = inGameBgmTrack === 1 ? "square" : "sawtooth";
        bOsc.frequency.setValueAtTime(activeTrack[0] / 2, now);
        bG.gain.setValueAtTime(0.045, now);
        bG.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        bOsc.connect(bG); bG.connect(audioCtx.destination);
        bOsc.start(now); bOsc.stop(now + 0.25);
      }
      const mOsc = audioCtx.createOscillator();
      const mG = audioCtx.createGain();
      mOsc.type = "sine";
      const mNote = activeTrack[(bgmStep * 3 + inGameBgmTrack) % activeTrack.length];
      mOsc.frequency.setValueAtTime(mNote, now);
      mG.gain.setValueAtTime(0.025, now);
      mG.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      mOsc.connect(mG); mG.connect(audioCtx.destination);
      mOsc.start(now); mOsc.stop(now + 0.16);
    }
    bgmStep = (bgmStep + 1) % 64;
  }, 125);
}

function drawVectorPlayer(c, type, color, scale = 1.0, flameHeight = 0) {
  c.save();
  c.scale(scale, scale);
  c.shadowColor = color;
  c.shadowBlur = 6;
  c.lineJoin = "round";
  c.lineCap = "round";

  const flH = 14 + Math.random() * 8 + flameHeight;
  const drawThruster = (tx, ty, tw) => {
    c.fillStyle = "#1e293b";
    c.fillRect(tx - tw / 2, ty, tw, 4);
    c.strokeStyle = "#475569";
    c.lineWidth = 1;
    c.strokeRect(tx - tw / 2, ty, tw, 4);

    const fg = c.createLinearGradient(tx, ty + 4, tx, ty + 4 + flH);
    fg.addColorStop(0, "#ffffff");
    fg.addColorStop(0.25, color);
    fg.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = fg;
    c.beginPath();
    c.moveTo(tx - tw / 2 + 1, ty + 4);
    c.lineTo(tx, ty + 4 + flH);
    c.lineTo(tx + tw / 2 - 1, ty + 4);
    c.closePath();
    c.fill();
  };

  if (type === 2) {
    drawThruster(-11, 14, 6);
    drawThruster(11, 14, 6);
  } else {
    drawThruster(-6, 13, 5);
    drawThruster(6, 13, 5);
  }

  const darkHull = "#080d1a";
  const midHull = "#131e33";
  const lightHull = "#1c2c4a";

  if (type === 0) {
    c.fillStyle = darkHull;
    c.strokeStyle = color;
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(0, -25);
    c.lineTo(7, -10);
    c.lineTo(24, 10);
    c.lineTo(21, 16);
    c.lineTo(12, 13);
    c.lineTo(0, 18);
    c.lineTo(-12, 13);
    c.lineTo(-21, 16);
    c.lineTo(-24, 10);
    c.lineTo(-7, -10);
    c.closePath();
    c.fill(); c.stroke();

    c.fillStyle = midHull;
    c.beginPath();
    c.moveTo(0, -21); c.lineTo(5, -8); c.lineTo(16, 8); c.lineTo(8, 10);
    c.lineTo(0, 14); c.lineTo(-8, 10); c.lineTo(-16, 8); c.lineTo(-5, -8);
    c.closePath(); c.fill();

    c.strokeStyle = "rgba(255, 255, 255, 0.45)";
    c.lineWidth = 0.8;
    c.beginPath();
    c.moveTo(7, -8); c.lineTo(19, 12);
    c.moveTo(-7, -8); c.lineTo(-19, 12);
    c.moveTo(12, 2); c.lineTo(18, 5);
    c.moveTo(-12, 2); c.lineTo(-18, 5);
    c.stroke();

    c.fillStyle = lightHull;
    c.fillRect(-4, 0, 2, 7);
    c.fillRect(2, 0, 2, 7);

    c.fillStyle = "#00f5ff";
    c.beginPath();
    c.moveTo(0, -18); c.lineTo(3.5, -6); c.lineTo(0, 2); c.lineTo(-3.5, -6);
    c.closePath(); c.fill();
    c.strokeStyle = "#ffffff";
    c.lineWidth = 1;
    c.stroke();

    c.fillStyle = "#ffffff";
    c.beginPath();
    c.moveTo(0, -17); c.lineTo(1.5, -8); c.lineTo(0, -3);
    c.closePath(); c.fill();

  } else if (type === 1) {
    c.fillStyle = darkHull;
    c.strokeStyle = color;
    c.lineWidth = 1.8;
    c.beginPath();
    c.moveTo(0, -23);
    c.lineTo(14, -12);
    c.lineTo(24, -2);
    c.lineTo(22, 16);
    c.lineTo(11, 14);
    c.lineTo(0, 19);
    c.lineTo(-11, 14);
    c.lineTo(-22, 16);
    c.lineTo(-24, -2);
    c.lineTo(-14, -12);
    c.closePath();
    c.fill(); c.stroke();

    c.fillStyle = "#334155";
    c.fillRect(-16, -18, 3.5, 14);
    c.fillRect(12.5, -18, 3.5, 14);
    c.strokeStyle = color;
    c.strokeRect(-16, -18, 3.5, 14);
    c.strokeRect(12.5, -18, 3.5, 14);

    c.fillStyle = midHull;
    c.beginPath();
    c.moveTo(0, -18); c.lineTo(8, -6); c.lineTo(8, 8); c.lineTo(0, 13);
    c.lineTo(-8, 8); c.lineTo(-8, -6);
    c.closePath(); c.fill();
    c.strokeStyle = "rgba(255, 255, 255, 0.4)";
    c.lineWidth = 0.9;
    c.stroke();

    c.strokeStyle = "#ff2244";
    c.lineWidth = 1.2;
    for (let gy = -2; gy <= 6; gy += 3) {
      c.beginPath(); c.moveTo(-5, gy); c.lineTo(5, gy);
      c.stroke();
    }
    c.fillStyle = "#ff2244";
    c.beginPath(); c.arc(0, -10, 4, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#ffffff";
    c.beginPath(); c.arc(0, -10, 1.5, 0, Math.PI * 2); c.fill();

  } else if (type === 2) {
    const drawFuselage = (fx) => {
      c.fillStyle = darkHull;
      c.strokeStyle = color;
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(fx, -26); c.lineTo(fx + 5, -10); c.lineTo(fx + 6, 12);
      c.lineTo(fx - 1, 15); c.lineTo(fx - 6, 12); c.lineTo(fx - 5, -10);
      c.closePath(); c.fill(); c.stroke();

      c.fillStyle = midHull;
      c.fillRect(fx - 3, -12, 6, 18);
      c.strokeStyle = "rgba(255, 255, 255, 0.45)";
      c.lineWidth = 0.8;
      c.beginPath(); c.moveTo(fx, -20); c.lineTo(fx, 8); c.moveTo(fx - 4, -2); c.lineTo(fx + 4, -2); c.stroke();

      c.fillStyle = "#ffffff";
      c.beginPath(); c.arc(fx, -18, 1.8, 0, Math.PI * 2); c.fill();
      c.fillStyle = color;
      c.beginPath(); c.arc(fx, -18, 1, 0, Math.PI * 2); c.fill();
    };
    drawFuselage(-11);
    drawFuselage(11);

    c.fillStyle = "#1e293b";
    c.fillRect(-6, -4, 12, 14);
    c.strokeStyle = "#475569";
    c.lineWidth = 1;
    c.strokeRect(-6, -4, 12, 14);
    c.fillStyle = "#00ff66";
    c.fillRect(-2, 0, 4, 6);
    c.fillStyle = "#ffffff";
    c.fillRect(-1, 2, 2, 2);

  } else if (type === 4) {
    c.fillStyle = "#181305";
    c.strokeStyle = color;
    c.lineWidth = 1.8;
    c.beginPath();
    c.moveTo(0, -28); c.lineTo(10, -14); c.lineTo(26, 6); c.lineTo(18, 18);
    c.lineTo(8, 12); c.lineTo(0, 20); c.lineTo(-8, 12); c.lineTo(-18, 18);
    c.lineTo(-26, 6); c.lineTo(-10, -14);
    c.closePath(); c.fill(); c.stroke();

    c.fillStyle = "#2d240c";
    c.beginPath();
    c.moveTo(0, -20); c.lineTo(8, -8); c.lineTo(17, 8); c.lineTo(6, 9);
    c.lineTo(0, 14); c.lineTo(-6, 9); c.lineTo(-17, 8); c.lineTo(-8, -8);
    c.closePath(); c.fill();

    c.strokeStyle = "rgba(255, 235, 120, 0.6)";
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(0, -18); c.lineTo(16, 6); c.moveTo(0, -18); c.lineTo(-16, 6);
    c.moveTo(0, -4); c.lineTo(10, 14); c.moveTo(0, -4); c.lineTo(-10, 14);

    c.fillStyle = "#ffd700";
    c.beginPath();
    c.moveTo(0, -11); c.lineTo(6, 0); c.lineTo(0, 10); c.lineTo(-6, 0);
    c.closePath(); c.fill();
    c.strokeStyle = "#ffffff";
    c.lineWidth = 1.2;
    c.stroke();
    c.fillStyle = "#ffffff";
    c.beginPath(); c.arc(0, 0, 2.5, 0, Math.PI * 2); c.fill();

  } else {
    c.fillStyle = darkHull;
    c.strokeStyle = color;
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(0, -24); c.lineTo(18, 12); c.lineTo(0, 6); c.lineTo(-18, 12);
    c.closePath(); c.fill();

function drawVectorLaserPod(c, lx, ly, muzzleFlashActive, curTime) {
  c.save();

  // 1. 날개 결합 마운트 프레임
  c.fillStyle = "#1e293b";
  c.fillRect(0, 4, 6, 4);
  c.strokeStyle = "#475569";
  c.lineWidth = 1;
  c.strokeRect(0, 4, 6, 4);

  // 2. 레이저 포드 하우징 바디

  c.strokeStyle = "#00f5ff";
  c.lineWidth = 1.4;
  c.shadowColor = "#00f5ff";
  c.shadowBlur = 4;
  c.beginPath();
  c.moveTo(0, -14);
  c.lineTo(4, -10);
  c.lineTo(4, 12);
  c.lineTo(-4, 12);
  c.lineTo(-4, -10);
  c.closePath();
  c.fill();
  c.stroke();

  // 3. 방열 슬릿 & 중앙 에너지 코어
  c.strokeStyle = "#38bdf8";
  c.lineWidth = 0.8;
  c.beginPath();
  c.moveTo(-3, 2); c.lineTo(3, 2);
  c.moveTo(-3, 6); c.lineTo(3, 6);
  c.stroke();

  const corePulse = Math.sin(curTime * 15) * 0.3 + 0.7;
  c.fillStyle = `rgba(0, 245, 255, ${corePulse})`;
  c.fillRect(-2, -4, 4, 4);
  c.fillStyle = "#ffffff";
  c.fillRect(-1, -3, 2, 2);

  // 4. 총구 포구 링
  c.fillStyle = "#334155";
  c.fillRect(-2.5, -15, 5, 2.5);
  c.fillStyle = "#00f5ff";
  c.fillRect(-1.5, -16, 3, 1.5);

  // 5. 발사 시 머리 부분 반짝임 (플라즈마 머즐 플래시)
  if (muzzleFlashActive) {
    const flashR = 7 + Math.random() * 4;
    c.shadowColor = "#00f5ff";
    c.shadowBlur = 12;

    // 중앙 광원
    const flashGrad = c.createRadialGradient(0, -16, 1, 0, -16, flashR);
    flashGrad.addColorStop(0, "#ffffff");
    flashGrad.addColorStop(0.4, "#00f5ff");
    flashGrad.addColorStop(1, "rgba(0, 245, 255, 0)");
    c.fillStyle = flashGrad;
    c.beginPath();
    c.arc(0, -16, flashR, 0, Math.PI * 2);
    c.fill();

    // 십자 광선 스파크
    c.strokeStyle = "#ffffff";
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(-flashR * 1.4, -16); c.lineTo(flashR * 1.4, -16);
    c.moveTo(0, -16 - flashR * 1.4); c.lineTo(0, -16 + flashR * 1.4);
    c.stroke();
  }

c.restore();
}

// =================================================================
// 5. 엔티티 정의
// =================================================================
class Player {
  constructor(pType, name, speedStat, powerStat, fireRateStat) {
    this.pType = pType; this.name = name;
    this.speedStat = speedStat; this.powerStat = powerStat; this.fireRateStat = fireRateStat;
    this.clonePlaneTimer = 0.0; this.laserWeaponTimer = 0.0;
    this.lastLaserTime = 0.0;
    this.laserMuzzleFlashTime = 0.0;
    this.shotCount = 0;
    this.x = LOGICAL_WIDTH / 2; this.y = LOGICAL_HEIGHT * 0.8;
    this.targetX = this.x; this.targetY = this.y;
    this.radius = 22; this.shieldRemain = 0.0; this.lastShot = 0.0;
    this.isAlive = true;
    this.frontShieldRemain = 0.0;
    this.speedFanBurstTimer = 0.0;
    this.lightningTimer = 0.0;
  }
  getDominantTrait() {
    if (this.pType === 0) return "SPEED";
    if (this.pType === 1) return "POWER";
    if (this.pType === 2) return "RATE";
    const maxVal = Math.max(this.powerStat, this.speedStat, this.fireRateStat);
    if (this.powerStat === maxVal) return "POWER";
    if (this.speedStat === maxVal) return "SPEED";
    return "RATE";
  }
getRealSpeed() {
    // 1. 레전드 기체: 기존 고유 속도 유지
    if (this.name === "Legend") {
      return CONFIG.BASE_PLAYER_SPEED + (this.speedStat * CONFIG.STAT_SPEED_FACTOR);
    }

    // 2. 스피드형 기본(Lv.5) 기준 속도 산출 (14.82)
    const baseSpeedLv5 = CONFIG.BASE_PLAYER_SPEED + (5 * CONFIG.STAT_SPEED_FACTOR * 2.2 * 1.2);

    // 3. Lv.1 속도를 스피드형 대비 30% 수준으로 세팅 (4.446)
    const speedLv1 = baseSpeedLv5 * 0.30;
    const speedPerLevel = (baseSpeedLv5 - speedLv1) / 4.0; // 레벨당 약 2.5935 증가

    // 4. 파워형, 트윈형, 랜덤 기체 모두 자신의 SPD 레벨에 맞추어 연산 적용
    return speedLv1 + (Math.max(1, this.speedStat) - 1) * speedPerLevel;
  }
  getFireInterval() {
    let reductionFactor = CONFIG.FIRE_RATE_REDUCTION;
    if (this.pType === 2 || (this.pType === 3 && this.getDominantTrait() === "RATE")) reductionFactor = 0.11;
    const reduction = 1.0 / (1.0 + (this.fireRateStat - 1) * reductionFactor);
    let base = CONFIG.BASE_FIRE_INTERVAL;
    if (this.name === "Speed" || this.name === "Power") base *= 1.30;
    if ((this.pType === 0 || (this.pType === 3 && this.getDominantTrait() === "SPEED")) && this.speedStat >= 16) {
      base *= 0.67;
    }
    if (this.name === "Legend") base *= 0.70;
    return Math.max(0.03, base * reduction);
  }
  update(dt, enemiesList, lightningList, bulletsList) {
    if (!this.isAlive) return;
    if (this.clonePlaneTimer > 0) this.clonePlaneTimer = Math.max(0, this.clonePlaneTimer - dt);
    if (this.laserWeaponTimer > 0) this.laserWeaponTimer = Math.max(0, this.laserWeaponTimer - dt);
    if (this.shieldRemain > 0) this.shieldRemain = Math.max(0, this.shieldRemain - dt);
    if (this.frontShieldRemain > 0) this.frontShieldRemain = Math.max(0, this.frontShieldRemain - dt);

    if ((this.pType === 0 || (this.pType === 3 && this.getDominantTrait() === "SPEED")) && this.speedStat >= 8) {
      this.speedFanBurstTimer += dt;
      if (this.speedFanBurstTimer >= 10.0) {
        this.speedFanBurstTimer = 0;
        for (let wave = 0; wave < 5; wave++) {
          setTimeout(() => {
            if (!this.isAlive) return;
            const dmg = Math.max(1, this.powerStat) * 1.2;
            for (let i = 0; i < 10; i++) {
              const ang = (-20 + i * (40 / 9)) * (Math.PI / 180);
              bulletsList.push(new Bullet(this.x, this.y - 20, Math.sin(ang) * 16, -Math.cos(ang) * 16, dmg, 4.5, "#00f5ff"));
            }
            playTone(880, 0.08, "square", -200);
          }, wave * 100);
        }
        setTimeout(() => {
          if (!this.isAlive) return;
          this.frontShieldRemain = 5.0;
          playTone(620, 0.2, "triangle", 150);
        }, 500);
      }
    }

    if ((this.pType === 2 || (this.pType === 3 && this.getDominantTrait() === "RATE")) && this.fireRateStat >= 8) {
      this.lightningTimer += dt;
      if (this.lightningTimer >= 3.0) {
        this.lightningTimer = 0;
        const mult = (this.fireRateStat >= 16) ? 5.0 : 3.0;
        const lRadius = this.radius * mult;
        const lx = this.x + (Math.random() - 0.5) * 160;
        const ly = this.y - 146 - Math.random() * 125;
        lightningList.push(new LightningBolt(lx, ly, lRadius));
        playTone(850, 0.18, "sawtooth", -400, 0.25);
      }
    }

    if (!Number.isFinite(this.targetX)) this.targetX = this.x;
    if (!Number.isFinite(this.targetY)) this.targetY = this.y;

    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 0.5) {
      const maxStep = isTouchActive ? (dist * 0.85) : (this.getRealSpeed() * 60 * dt);
      if (dist <= maxStep || isTouchActive) {
        this.x += dx * Math.min(1.0, (isTouchActive ? 0.35 : (maxStep / dist)));
        this.y += dy * Math.min(1.0, (isTouchActive ? 0.35 : (maxStep / dist)));
      } else {
        this.x += (dx / dist) * maxStep;
        this.y += (dy / dist) * maxStep;
      }
    }
    const maxLimitX = LOGICAL_WIDTH - this.radius - (this.clonePlaneTimer > 0 ? 46 : 10);
    this.x = Math.max(this.radius + 10, Math.min(maxLimitX, this.x));
    this.y = Math.max(this.radius + 10, Math.min(LOGICAL_HEIGHT - player.radius - 10, this.y));
  }
  _fire(px, py, dmg, bullets) {
    const trait = this.getDominantTrait();

    if (trait === "RATE" && this.shotCount % 10 === 0) {
      const bulletCount = 14;
      const angleStep = (Math.PI * 2) / bulletCount;
      for (let i = 0; i < bulletCount; i++) {
        const rad = i * angleStep;
        bullets.push(new Bullet(px, py - 10, Math.sin(rad) * 13, -Math.cos(rad) * 13, dmg * 0.9, 3.8, "#ffe600"));
      }
      playTone(720, 0.12, "sine", 120);
    }

    let isBlackHoleShot = (trait === "POWER" && this.shotCount % 5 === 0);

    if (this.name === "Legend") {
      bullets.push(new Bullet(px, py - 22, 0, -17, dmg, 4.5, "#ffd700"));
      const rad = 3.43 * (Math.PI / 180);
      bullets.push(new Bullet(px, py - 22, -Math.sin(rad) * 17, -Math.cos(rad) * 17, dmg, 4.5, "#ffd700"));
      bullets.push(new Bullet(px, py - 22, Math.sin(rad) * 17, -Math.cos(rad) * 17, dmg, 4.5, "#ffd700"));
      playTone(900, 0.08, "triangle", -400);
    } else if (trait === "SPEED") {
      bullets.push(new Bullet(px, py - 22, 0, -17, dmg, 4.0, "#00f5ff"));
      if (this.shotCount % 3 === 0) {
        const mult = Math.floor(this.powerStat / 3);
        for (let i = 0; i <= mult; i++) {
          const rad = (7.0 + i * 1.75) * (Math.PI / 180);
          bullets.push(new Bullet(px, py - 22, -Math.sin(rad) * 17, -Math.cos(rad) * 17, dmg, 4.0, "#00f5ff"));
          bullets.push(new Bullet(px, py - 22, Math.sin(rad) * 17, -Math.cos(rad) * 17, dmg, 4.0, "#00f5ff"));
        }
      }
      playTone(850, 0.07, "square", -350);
    } else if (trait === "RATE") {
      let count = 2;
      const spacing = 28 / (count - 1);
      const startX = px - 14;
      for (let i = 0; i < count; i++) {
        bullets.push(new Bullet(startX + i * spacing, py - 20, 0, -15, dmg, 4.0, "#ffe600"));
      }
      playTone(600, 0.05, "sine", -250);
    } else if (trait === "POWER") {
      bullets.push(new Bullet(px, py - 24, 0, -14, dmg * 1.5, isBlackHoleShot ? 8 : 6, isBlackHoleShot ? "#808080" : "#ff3c5a", isBlackHoleShot));
      if (this.powerStat >= 8) {
        const isFullPower = (this.powerStat >= 16);
        const subDmg = isFullPower ? dmg : (dmg * 0.5);
        const subRadius = isFullPower ? 6 : 3.5;
        bullets.push(new Bullet(px - 22, py - 14, -1.0, -13, subDmg, subRadius, "#ff3c5a"));
        bullets.push(new Bullet(px + 22, py - 14, 1.0, -13, subDmg, subRadius, "#ff3c5a"));
      }
      playTone(380, 0.12, "sawtooth", -150);
    } else {
      bullets.push(new Bullet(px, py - 22, 0, -17, dmg, 4.0, "#00f5ff"));
      playTone(700, 0.07, "square", -300);
    }
  }
  shoot(curTime, bullets) {
    if (!this.isAlive) return;
    if (curTime - this.lastShot >= this.getFireInterval()) {
      this.lastShot = curTime;
      this.shotCount++;
      let baseDmg = Math.max(1, this.powerStat);
      if (this.pType === 1 || (this.pType === 3 && this.getDominantTrait() === "POWER")) {
        baseDmg = 1 + (this.powerStat - 1) * 2.2;
      }
      const dmg = baseDmg * 1.2;
      this._fire(this.x, this.y, dmg, bullets);
      if (this.clonePlaneTimer > 0) this._fire(this.x + 42, this.y, dmg, bullets);
    }
  }
  draw(curTime) {
    if (!this.isAlive) return;
    const isDoubleDim = (this.clonePlaneTimer > 0 && this.clonePlaneTimer <= 5.0) && (Math.floor(curTime / 0.3) % 2 === 0);
    const isShieldDim = (this.shieldRemain > 0 && this.shieldRemain <= 5.0) && (Math.floor(curTime / 0.3) % 2 === 0);

    if (this.name === "Legend") {
      const auraR = this.radius + 12 + Math.sin(curTime * 8) * 4;
      ctx.save();
      ctx.shadowColor = "#ffd700";
      ctx.shadowBlur = 10;
      ctx.fillStyle = "rgba(255, 215, 0, 0.2)";
      ctx.beginPath();
      ctx.arc(this.x, this.y, auraR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    const drawShipAt = (cx, cy, isClone=false) => {
      ctx.save();
      if (isClone && isDoubleDim) ctx.globalAlpha = 0.35;
      ctx.translate(cx, cy);

      let themeColor = "#00f5ff";
      if (this.name === "Legend") themeColor = "#ffd700";
      else if (this.pType === 1) themeColor = "#ff2244";
      else if (this.pType === 2) themeColor = "#00ff66";

      drawVectorPlayer(ctx, this.pType, themeColor, 1.2);

      // 메카닉 레이저 포드 및 발사 머즐 플래시 렌더링
      if (this.laserWeaponTimer > 0) {
        const isFlashing = (curTime - this.laserMuzzleFlashTime) < 0.15;
        drawVectorLaserPod(ctx, -26, 0, isFlashing, curTime);
      }
      ctx.restore();
    };

    drawShipAt(this.x, this.y, false);
    if (this.clonePlaneTimer > 0) drawShipAt(this.x + 42, this.y, true);

    if (this.frontShieldRemain > 0) {
      let showFront = true;
      if (this.frontShieldRemain <= 0.5) showFront = (Math.floor(curTime / 0.2) % 2 === 0);
      if (showFront) {
        ctx.save();
        ctx.strokeStyle = "#00f5ff";
        ctx.lineWidth = 3.5;
        ctx.shadowColor = "#00f5ff";
        ctx.shadowBlur = 7;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius + 20, -Math.PI * 0.83, -Math.PI * 0.17);
        ctx.stroke();
        ctx.restore();
      }
    }

    if (this.shieldRemain > 0) {
      ctx.save();
      if (isShieldDim) ctx.globalAlpha = 0.3;
      const shieldPulse = Math.sin(curTime * 14.0) * 2.5;
      const shR = this.radius + 32 + shieldPulse;
      ctx.strokeStyle = "rgba(50, 255, 120, 0.9)";
      ctx.lineWidth = 2.0;
      ctx.shadowColor = "#32ff78";
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(this.x, this.y, shR, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = "rgba(50, 255, 120, 0.1)";
      ctx.beginPath();
      ctx.arc(this.x, this.y, shR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    const activeSkills = [];
    if (this.laserWeaponTimer > 0) activeSkills.push({ name: "LASER", sec: `${Math.round(this.laserWeaponTimer)}s` });
    if (this.clonePlaneTimer > 0) activeSkills.push({ name: "DOUBLE", sec: `${Math.round(this.clonePlaneTimer)}s` });
    if (this.shieldRemain > 0) activeSkills.push({ name: "SHIELD", sec: `${this.shieldRemain.toFixed(1)}s` });
    if (this.frontShieldRemain > 0) activeSkills.push({ name: "FRONT", sec: `${this.frontShieldRemain.toFixed(1)}s` });

    if (activeSkills.length > 0) {
      ctx.save();
      ctx.textAlign = "center";
      const total = activeSkills.length;
      const colWidth = 52;
      const startX = this.x - ((total - 1) * colWidth) / 2;
      const row1Y = this.y + this.radius + 20;
      const row2Y = row1Y + 13;

      activeSkills.forEach((sk, idx) => {
        const sx = startX + idx * colWidth;
        ctx.font = `bold 10px ${FONT_FAMILY}`;
        ctx.fillStyle = "#00f5ff";
        ctx.fillText(sk.name, sx, row1Y);
        ctx.font = `bold 11px ${FONT_FAMILY}`;
        ctx.fillStyle = "#ffe600";
        ctx.fillText(sk.sec, sx, row2Y);
      });
      ctx.restore();
    }
  }
}

class Meteor {
  constructor(themeIndex, side, spawnY) {
    this.theme = METEOR_THEMES[themeIndex % METEOR_THEMES.length];
    this.side = side;
    this.radius = 24;
    this.tailLength = 150;
    const speed = 3.75;
    const targetX = (LOGICAL_WIDTH * 0.25) + Math.random() * (LOGICAL_WIDTH * 0.50);
    const targetY = LOGICAL_HEIGHT;

    const isTopSpawn = Math.random() < 0.5;
    if (isTopSpawn) {
      this.y = -60;
      this.x = this.side === "left" 
        ? Math.random() * (LOGICAL_WIDTH * 0.35) 
        : LOGICAL_WIDTH * 0.65 + Math.random() * (LOGICAL_WIDTH * 0.35);
    } else {
      this.y = spawnY;
      this.x = this.side === "left" ? -60 : LOGICAL_WIDTH + 60;
    }

    const angle = Math.atan2(targetY - this.y, targetX - this.x);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.coreAngle = 0;
    this.rotSpeed = 9.5;
    this.active = true;
  }
  update(dt) {
    this.x += this.vx * (dt * 60);
    this.y += this.vy * (dt * 60);
    this.coreAngle += this.rotSpeed * dt;
    if (this.y > LOGICAL_HEIGHT + 180 || (this.side === "left" && this.x > LOGICAL_WIDTH + 180) || (this.side === "right" && this.x < -180)) {
      this.active = false;
    }
  }
  draw() {
    ctx.save();
    const moveAngle = Math.atan2(this.vy, this.vx);
    const tailAngle = moveAngle + Math.PI;
    const tailTipX = this.x + Math.cos(tailAngle) * this.tailLength;
    const tailTipY = this.y + Math.sin(tailAngle) * this.tailLength;

    ctx.globalAlpha = 0.75;
    const tailGrad = ctx.createLinearGradient(this.x, this.y, tailTipX, tailTipY);
    tailGrad.addColorStop(0, this.theme.mid);
    tailGrad.addColorStop(0.35, this.theme.outer);
    tailGrad.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = tailGrad;
    ctx.beginPath();
    const perpAngle = moveAngle + Math.PI / 2;
    const w = this.radius * 0.95;
    ctx.moveTo(this.x + Math.cos(perpAngle) * w, this.y + Math.sin(perpAngle) * w);
    ctx.lineTo(tailTipX, tailTipY);
    ctx.lineTo(this.x - Math.cos(perpAngle) * w, this.y - Math.sin(perpAngle) * w);
    ctx.closePath();
    ctx.fill();

    ctx.translate(this.x, this.y);
    ctx.rotate(this.coreAngle);

    const coreGrad = ctx.createRadialGradient(0, 0, this.radius * 0.15, 0, 0, this.radius);
    coreGrad.addColorStop(0, "#ffffff");
    coreGrad.addColorStop(0.35, this.theme.outer);
    coreGrad.addColorStop(0.7, this.theme.mid);
    coreGrad.addColorStop(1, this.theme.core);

    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3.5;
    for (let i = 0; i < 4; i++) {
      const spAng = i * (Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(spAng) * (this.radius * 0.85), Math.sin(spAng) * (this.radius * 0.85));
      ctx.stroke();
    }
    ctx.restore();
  }
}

class MeteorManager {
  constructor() { this.reset(); }
  reset() {
    this.meteors = [];
    this.pendingQueue = [];
    this.warningActive = false;
    this.warningStartTime = 0;
    this.earlyIndex = 0;
    const t1 = 8 + Math.random() * 20;
    const t2 = 35 + Math.random() * 20;
    this.earlyTwoSpawnTimes = [Math.min(t1, t2), Math.max(t1, t2)];
    this.nextSpawnTime = 0;
    this.cooldownUntil = 60.0;
  }
  scheduleMeteor(curTime, spawnTime) {
    const side = Math.random() < 0.5 ? "left" : "right";
    const spawnY = Math.random() * (LOGICAL_HEIGHT * 0.25);
    const themeIdx = Math.floor(Math.random() * METEOR_THEMES.length);
    this.pendingQueue.push({ triggerAt: spawnTime, side, spawnY, themeIdx, warned: false });
  }
  update(dt, elapsed, player, bulletsList) {
    if (elapsed < 60.0) {
      while (this.earlyIndex < this.earlyTwoSpawnTimes.length) {
        const targetT = this.earlyTwoSpawnTimes[this.earlyIndex];
        this.scheduleMeteor(elapsed, targetT);
        this.earlyIndex++;
      }
    } else {
      if (elapsed >= this.cooldownUntil && this.nextSpawnTime === 0) {
        const randDelay = 5.0 + Math.random() * 15.0;
        this.nextSpawnTime = elapsed + randDelay;
      }
      if (this.nextSpawnTime > 0 && elapsed >= this.nextSpawnTime) {
        this.scheduleMeteor(elapsed, elapsed + 3.0);
        this.cooldownUntil = (elapsed + 3.0) + 10.0;
        this.nextSpawnTime = 0;
      }
    }

    for (let i = this.pendingQueue.length - 1; i >= 0; i--) {
      const p = this.pendingQueue[i];
      if (!p.warned && elapsed >= p.triggerAt - 3.0) {
        p.warned = true;
        this.warningActive = true;
        this.warningStartTime = elapsed;
        playMeteorWarningSound();
      }
      if (elapsed >= p.triggerAt) {
        this.meteors.push(new Meteor(p.themeIdx, p.side, p.spawnY));
        this.pendingQueue.splice(i, 1);
      }
    }

    if (this.warningActive && elapsed - this.warningStartTime >= 3.0) {
      this.warningActive = false;
    }

    this.meteors.forEach(m => m.update(dt));
    this.meteors = this.meteors.filter(m => m.active);

    this.meteors.forEach(m => {
      for (let bi = bulletsList.length - 1; bi >= 0; bi--) {
        const b = bulletsList[bi];
        if (Math.hypot(b.x - m.x, b.y - m.y) < b.radius + m.radius) {
          bulletsList.splice(bi, 1);
          explosions.push(new ExplosionFX(b.x, b.y, "#ff7700"));
          playTone(400, 0.05, "sawtooth");
        }
      }

      // 플레이어 충돌 시 무적 효과 없이 즉시 사망 처리
      if (player && player.isAlive && Math.hypot(player.x - m.x, player.y - m.y) < player.radius + m.radius) {
        player.isAlive = false;
        explosions.push(new ExplosionFX(player.x, player.y, "#ff0080"));
        explosions.push(new ExplosionFX(m.x, m.y, "#ff5500"));
        playExplosionSound();
        handleGameOver();
      }
    });
  }
  drawWarning() {
    if (!this.warningActive) return;
    const curTime = performance.now() / 1000;
    const isBlink = Math.floor(curTime / 0.15) % 2 === 0;
    if (isBlink) {
      ctx.save();
      ctx.textAlign = "center";
      ctx.fillStyle = "#ff2200";
      ctx.font = `bold 16px ${FONT_FAMILY}`;
      ctx.shadowColor = "#ff2200";
      ctx.shadowBlur = 6;
      ctx.fillText("⚠ WARNING: GIANT METEOR INCOMING! ⚠", LOGICAL_WIDTH / 2, 198);

      ctx.fillStyle = "rgba(255, 34, 0, 0.25)";
      ctx.fillRect(20, 179, LOGICAL_WIDTH - 40, 26);
      ctx.strokeStyle = "#ff2200";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(20, 179, LOGICAL_WIDTH - 40, 26);
      ctx.restore();
    }
  }
  drawMeteors() { this.meteors.forEach(m => m.draw()); }
}

class Star {
  constructor() {
    this.x = Math.random() * LOGICAL_WIDTH;
    this.y = Math.random() * LOGICAL_HEIGHT;
    this.speed = 0.8 + Math.random() * 2.8;
    this.size = this.speed > 2.5 ? 2.0 : (this.speed > 1.6 ? 1.5 : 1.0);
    // 밝기 20% 감소 적용
    const alpha = Math.min(0.8, (0.3 + this.speed * 0.25) * 0.8);
    this.color = `rgba(${145 + Math.floor(Math.random() * 60)}, ${160 + Math.floor(Math.random() * 45)}, 205, ${alpha})`;
  }
  update() {
    this.y += this.speed;
    if (this.y > LOGICAL_HEIGHT) { this.y = 0; this.x = Math.random() * LOGICAL_WIDTH; }
  }
  draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Comet {
  constructor() { this.reset(); }
  reset() {
    this.active = false;
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.length = 0; this.alpha = 0;
  }
  spawn() {
    this.active = true;
    this.x = Math.random() * (LOGICAL_WIDTH * 0.8);
    this.y = -20;
    const speed = 4.0 + Math.random() * 3.5;
    const angle = (55 + Math.random() * 20) * (Math.PI / 180);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.length = 45 + Math.random() * 45;
    this.alpha = 0.15 + Math.random() * 0.2;
  }
  update(dt) {
    if (!this.active) return;
    this.x += this.vx * (dt * 60);
    this.y += this.vy * (dt * 60);
    if (this.x > LOGICAL_WIDTH + 60 || this.y > LOGICAL_HEIGHT + 60) this.active = false;
  }
  draw() {
    if (!this.active) return;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    const tailX = this.x - (this.vx * (this.length / 8));
    const tailY = this.y - (this.vy * (this.length / 8));
    const grad = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
    grad.addColorStop(0, "rgba(0, 245, 255, 0)");
    grad.addColorStop(1, "rgba(255, 255, 255, 0.95)");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.0;
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(this.x, this.y, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class BlackHole {
  constructor(x, y, baseRadius) {
    this.x = x; this.y = y;
    this.baseRadius = baseRadius * 2.0;
    this.life = 2.0;
    this.angle = 0;
  }
  update(dt, enemiesList) {
    this.life -= dt;
    this.angle += dt * 5.0;
    const curR = this.baseRadius * (1.0 + Math.sin(this.life * 10) * 0.1);
    for (let ei = enemiesList.length - 1; ei >= 0; ei--) {
      const e = enemiesList[ei];
      if (Math.hypot(e.x - this.x, e.y - this.y) <= curR + e.radius) {
        if (e.hasShield) continue;
        e.hp = 0;
        enemiesList.splice(ei, 1);
        score += 1;
        const bGauge = (player && player.shieldRemain > 0) ? (CONFIG.BASE_GAUGE_PER_KILL * 0.3) : CONFIG.BASE_GAUGE_PER_KILL;
        skillGauge += bGauge;
        explosions.push(new ExplosionFX(e.x, e.y, "#969696"));
      }
    }
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    const curR = this.baseRadius * (1.0 + Math.sin(this.life * 10) * 0.1);
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    const grad = ctx.createRadialGradient(0, 0, curR * 0.25, 0, 0, curR);
    grad.addColorStop(0, "#000000");
    grad.addColorStop(0.55, "#252538");
    grad.addColorStop(0.85, "#606085");
    grad.addColorStop(1, "rgba(160, 160, 200, 0)");

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, curR, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "rgba(160, 180, 255, 0.7)";
    ctx.lineWidth = 2.0;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(0, 0, curR * (0.35 + i * 0.2), i * 1.5, i * 1.5 + Math.PI * 0.8);
      ctx.stroke();
    }
    ctx.restore();
  }
}

class ExplosionFX {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color || "#ffe600";
    this.life = 1.0;
    this.decay = 2.5 + Math.random() * 1.5;
    this.particles = [];
    const particleCount = 9; // 16개 -> 9개로 조절하여 가비지 컬렉터 부하 완화
    for (let i = 0; i < particleCount; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 2 + Math.random() * 5;
      this.particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        r: 2 + Math.random() * 3,
        len: 4 + Math.random() * 8
      });
    }
  }
  update(dt) {
    this.life -= this.decay * dt;
    this.particles.forEach(p => {
      p.x += p.vx * (dt * 60);
      p.y += p.vy * (dt * 60);
      p.r = Math.max(0, p.r - dt * 2.5);
    });
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.strokeStyle = this.color;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 5;

    const waveR = (1.0 - this.life) * 45;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, waveR, 0, Math.PI * 2);
    ctx.stroke();

    this.particles.forEach(p => {
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 1.5, p.y - p.vy * 1.5);
      ctx.stroke();
    });
    ctx.restore();
  }
}

class LightningBolt {
  constructor(x, y, radius) {
    this.x = x; this.y = y;
    this.radius = radius;
    this.life = 1.8;
    this.totalLife = 1.8;
  }
  update(dt, enemiesList) {
    this.life -= dt;
    for (let ei = enemiesList.length - 1; ei >= 0; ei--) {
      const e = enemiesList[ei];
      if (Math.hypot(e.x - this.x, e.y - this.y) <= this.radius + e.radius) {
        if (e.hasShield) continue;
        e.hp = 0;
        enemiesList.splice(ei, 1);
        score += 1;
        const lGauge = (player && player.shieldRemain > 0) ? (CONFIG.BASE_GAUGE_PER_KILL * 0.3) : CONFIG.BASE_GAUGE_PER_KILL;
        skillGauge += lGauge;
        explosions.push(new ExplosionFX(e.x, e.y, "#00f5ff"));
      }
    }
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    const alpha = Math.max(0, this.life / this.totalLife);
    ctx.globalAlpha = alpha;

    ctx.fillStyle = "rgba(0, 245, 255, 0.15)";
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#00f5ff";
    ctx.lineWidth = 2.5;
    ctx.shadowColor = "#00f5ff";
    ctx.shadowBlur = 7;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    for (let k = 0; k < 6; k++) {
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      let cx = this.x, cy = this.y;
      for (let s = 0; s < 5; s++) {
        cx += (Math.random() - 0.5) * this.radius * 0.8;
        cy += (Math.random() - 0.5) * this.radius * 0.8;
        ctx.lineTo(cx, cy);
      }
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }
    ctx.restore();
  }
}

class BossDropItem {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.radius = 16; this.speed = 2.2;
    this.spawnTime = performance.now() / 1000;
  }
  getType(curTime) {
    const elapsed = curTime - this.spawnTime;
    const idx = Math.floor(elapsed) % 3;
    return ["P", "S", "D"][idx];
  }
  update(dt) { this.y += this.speed * (dt * 60); }
  draw(curTime) {
    const type = this.getType(curTime);
    const pulse = Math.sin(curTime * 14) * 4;
    const r = this.radius + pulse;

    const glowGrad = ctx.createRadialGradient(this.x, this.y, r * 0.5, this.x, this.y, r + 10);
    glowGrad.addColorStop(0, "rgba(255, 255, 255, 0.8)");
    glowGrad.addColorStop(0.5, "rgba(255, 215, 0, 0.4)");
    glowGrad.addColorStop(1, "rgba(255, 215, 0, 0)");
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r + 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = type === "P" ? "#ff0080" : (type === "S" ? "#00f5ff" : "#ffe600");
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = `bold 15px ${FONT_FAMILY}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(type, this.x, this.y);
  }
}

class Bullet {
  constructor(x, y, vx, vy, dmg, radius=4.5, color="#ffe600", isBlackHoleTrigger=false) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.dmg = dmg; this.radius = radius; this.color = color;
    this.isBlackHoleTrigger = isBlackHoleTrigger;
  }
  update(dt) { this.x += this.vx * (dt * 60); this.y += this.vy * (dt * 60); }
  draw() {
    ctx.save();
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 5;
    ctx.fillStyle = this.color;

    const ang = Math.atan2(this.vy, this.vx);
    ctx.translate(this.x, this.y);
    ctx.rotate(ang);

    ctx.beginPath();
    ctx.ellipse(0, 0, this.radius * 2.2, this.radius * 0.9, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(0, 0, this.radius * 1.2, this.radius * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class Enemy {
  constructor(maxHp, baseSpeed, designId, hasShield=false, isHeavy=false) {
    this.originX = 40 + Math.random() * (LOGICAL_WIDTH - 80);
    this.x = this.originX;
    this.y = -40;
    this.vx = 0;
    this.maxHp = maxHp;
    this.hp = maxHp;
    this.speed = baseSpeed * (0.75 + Math.random() * 0.7);
    this.patternType = ["STRAIGHT", "SINE", "SMOOTH_CURVE", "DIVE", "ZIGZAG"][Math.floor(Math.random() * 5)];
    this.sinePhase = Math.random() * Math.PI * 2;
    this.sineAmp = 55 + Math.random() * 65;
    this.sineFreq = 2.5 + Math.random() * 2.3;
    this.curveVx = (Math.random() < 0.5 ? -1 : 1) * (2.2 + Math.random() * 2.0);
    this.curveTimer = 0.4 + Math.random() * 0.6;
    this.diveTriggered = false;
    this.designId = designId;
    this.radius = maxHp <= 8 ? 20 : (maxHp <= 18 ? 25 : 30);
    this.hasShield = hasShield;
    this.isHeavy = isHeavy;
    this.animOffset = Math.random() * 10;
    this.isDead = false; // 중복 킬/점수 획득 방지 플래그
  }
  update(dt, elapsed, speedScale=1.0, widthScale=1.0) {
    const effSpeed = this.speed * speedScale;
    const step = dt * 60 * speedScale;
    this.x += this.vx * (dt * 60);
    this.vx *= 0.92;

    if (this.patternType === "DIVE") {
      if (!this.diveTriggered && this.y > 180) { this.diveTriggered = true; this.speed *= 1.8; }
      this.y += effSpeed * (dt * 60);
      this.x += Math.sin(elapsed * 5.0) * (1.5 * step * widthScale);
    } else if (this.patternType === "ZIGZAG") {
      this.y += (effSpeed * 0.9) * (dt * 60);
      this.x += (this.curveVx * widthScale) * step;
      if (this.x <= this.radius + 5 || this.x >= LOGICAL_WIDTH - this.radius - 5) this.curveVx *= -1;
    } else if (this.patternType === "SINE") {
      this.y += effSpeed * (dt * 60);
      this.x = this.originX + Math.sin(elapsed * this.sineFreq + this.sinePhase) * (this.sineAmp * widthScale);
    } else if (this.patternType === "SMOOTH_CURVE") {
      this.y += effSpeed * (dt * 60);
      this.curveTimer -= dt;
      if (this.curveTimer <= 0) { this.curveVx = (Math.random() * 7) - 3.5; this.curveTimer = 0.5 + Math.random() * 0.7; }
      this.x += (this.curveVx * widthScale) * step;
    } else {
      this.y += (effSpeed * 1.15) * (dt * 60);
    }
    this.x = Math.max(this.radius, Math.min(LOGICAL_WIDTH - this.radius, this.x));
  }
  draw(curTime) {
    ctx.save();
    ctx.translate(this.x, this.y);
    drawVectorEnemy(ctx, this.designId, this.hp / this.maxHp, this.isHeavy, curTime);
    ctx.restore();

    if (this.hasShield) {
      const pulse = Math.sin(curTime * 12.0) * 3;
      ctx.strokeStyle = "#00f5ff";
      ctx.lineWidth = 2.0;
      ctx.shadowColor = "#00f5ff";
      ctx.shadowBlur = 5;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 8 + pulse, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = "rgba(0, 245, 255, 0.12)";
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 8 + pulse, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!this.hasShield) {
      const barW = Math.floor(this.radius * 1.4);
      const hpW = Math.floor(barW * Math.max(0, this.hp / this.maxHp));
      ctx.fillStyle = "#505064";
      ctx.fillRect(this.x - barW / 2, this.y - this.radius - 8, barW, 3);
      ctx.fillStyle = "#32ff78";
      ctx.fillRect(this.x - barW / 2, this.y - this.radius - 8, hpW, 3);
}
  }
}

// 점수 및 게이지 획득 오류 방지 통합 함수
function safeKillEnemy(e, customColor="#ffe600") {
  if (!e || e.isDead) return false;
  e.isDead = true;
  e.hp = 0;
  score = Math.max(0, Math.floor(score + 1));
  const gBase = (typeof earlyGaugeMultiplier !== "undefined" ? earlyGaugeMultiplier : 1.0);
  const effectiveGauge = (player && player.shieldRemain > 0) ? (CONFIG.BASE_GAUGE_PER_KILL * 0.3) : CONFIG.BASE_GAUGE_PER_KILL;
  skillGauge = Math.min(CONFIG.MAX_SKILL_GAUGE, skillGauge + effectiveGauge);
  explosions.push(new ExplosionFX(e.x, e.y, customColor));
  return true;
}

class BossEnemy {
  constructor() {
    this.x = LOGICAL_WIDTH / 2;
    this.y = -80;
    this.targetY = 110;
    this.maxHp = 40;
    this.hp = 40;
    this.radius = 58;
    this.isFullyEntered = false;
    this.vx = 2.0;
    this.lastFireTime = 0.0;
  }
  update(dt, curTime, missiles) {
    if (!this.isFullyEntered) {
      this.y += 1.8 * (dt * 60);
      if (this.y >= this.targetY) { this.y = this.targetY; this.isFullyEntered = true; this.lastFireTime = curTime; }
    } else {
      this.x += this.vx * (dt * 60);
      if (this.x <= this.radius + 15 || this.x >= LOGICAL_WIDTH - this.radius - 15) this.vx *= -1;
      if (curTime - this.lastFireTime >= 3.0) {
        this.lastFireTime = curTime;
        missiles.push(new Bullet(this.x - 22, this.y + 45, -0.6, 5.5, 1, 6, "#ff2d2d"));
        missiles.push(new Bullet(this.x + 22, this.y + 45, 0.6, 5.5, 1, 6, "#ff2d2d"));
        playTone(300, 0.15, "sawtooth", -150);
      }
    }
  }
  draw(curTime) {

    const hpW = Math.floor(barW * Math.max(0, this.hp / this.maxHp));
    ctx.fillStyle = "#303045";
    ctx.fillRect(this.x - barW / 2, this.y - this.radius - 18, barW, 6);

    ctx.font = `bold 11px ${FONT_FAMILY}`;

  }
}

function drawHedgehogLauncher(c, curTime) {
  if (!hedgehogLauncher.active) return;
  const hx = hedgehogLauncher.x;
  const hy = hedgehogLauncher.y;
  c.save();
  c.translate(hx, hy);
  c.shadowColor = "#00f5ff";
  c.shadowBlur = 10;

  const barrelCount = 10;
  for (let i = 0; i < barrelCount; i++) {
    const ang = (-160 + i * (140 / (barrelCount - 1))) * (Math.PI / 180);
    const blen = 22;
    const bx = Math.cos(ang) * blen;
    const by = Math.sin(ang) * blen;

    c.strokeStyle = "#475569";
    c.lineWidth = 4;
    c.beginPath();
    c.moveTo(0, 0);
    c.lineTo(bx, by);
    c.stroke();

    c.fillStyle = "#00f5ff";
    c.beginPath();
    c.arc(bx, by, 2, 0, Math.PI * 2);
    c.fill();

    if (skillGauge < CONFIG.MAX_SKILL_GAUGE || !hedgehogLauncher.isExecutingNuke) {
      const chargePulse = Math.sin(curTime * 25.0 + i) * 3 + 3.5;
      c.fillStyle = (i % 2 === 0) ? "#ffe600" : "#ff007f";
      c.beginPath();
      c.arc(bx, by, chargePulse, 0, Math.PI * 2);
      c.fill();
    }
  }

  c.fillStyle = "#0f172a";
  c.strokeStyle = "#00f5ff";
  c.lineWidth = 2.5;
  c.beginPath();
  c.arc(0, 0, 18, 0, Math.PI * 2);
  c.fill();
  c.stroke();

  const pulseR = 7 + Math.sin(curTime * 15.0) * 2.5;
  c.fillStyle = "#ffe600";
  c.beginPath();
  c.arc(0, 0, pulseR, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

function triggerSlotSequence() {
  if (isNukingTransition) return;
  isNukingTransition = true;
  hedgehogLauncher.isExecutingNuke = true;
  hedgehogLauncher.flashAlpha = 1.0;
  hedgehogLauncher.timeStopTimer = 2.0; // 정확히 2.0초 정지 유지

  // 화면에 남아있는 아군 총알 및 적 미사일 즉시 전량 제거
  bullets = [];
  bossMissiles = [];

  playTone(800, 0.35, "sawtooth", -300, 0.3);

  const validTargets = enemies.filter(e => !e.isDead && e.hp > 0).sort((a, b) => b.y - a.y);
  const colors = ["#00f5ff", "#ff007f", "#39ff14", "#ffe600", "#bf00ff", "#ff5500", "#ffffff"];

  if (validTargets.length === 0) {
    setTimeout(finishNukeSequence, 2000);
    return;
  }

  // 레이저 노출 시간(0.3초) 및 파괴 파티클 완결 시간을 확보하기 위해 사격은 1.3초 안에 전량 발사
  const totalFireDuration = 1.3;
  // 적 개체 수가 많으면 1개 또는 최대 4개까지 동시 다중 발사
  const batchSize = Math.min(4, Math.max(1, Math.ceil(validTargets.length / 8)));
  const totalBatches = Math.ceil(validTargets.length / batchSize);
  const batchInterval = totalFireDuration / totalBatches;

  for (let b = 0; b < totalBatches; b++) {
    const currentBatch = validTargets.slice(b * batchSize, (b + 1) * batchSize);
    setTimeout(() => {
      const now = performance.now() / 1000;
      currentBatch.forEach((tgt, subIdx) => {
        const c = colors[(b * batchSize + subIdx) % colors.length];
        nukeBeamBeams.push({
          sx: hedgehogLauncher.x,
          sy: hedgehogLauncher.y,
          tx: tgt.x,
          ty: tgt.y,
          color: c,
          startTime: now,
          duration: 0.30
        });

       // 적 즉시 파괴 처리 (보호막 무시 및 즉각 폭발/점수 처리)
        tgt.hasShield = false;
        tgt.hp = 0;
        tgt.isDead = true;
        score += 1;
        explosions.push(new ExplosionFX(tgt.x, tgt.y, c));

        // 배열에서 즉시 제거하여 잔상 및 피격 판정 원천 차단
        const targetIdx = enemies.indexOf(tgt);
        if (targetIdx !== -1) enemies.splice(targetIdx, 1);

        // 고슴도치 레이저 전용 타격 사운드 (강력한 펄스 + 묵직한 레이저 피치)
        playTone(950 + ((b + subIdx) % 5) * 80, 0.12, "sawtooth", -350, 0.28);
        playTone(320, 0.08, "triangle", -100, 0.2);
      });
    }, b * (batchInterval * 1000));
  }

  // 정확히 2.0초가 되는 순간 잔여 정리 및 업그레이드 화면 진입
  setTimeout(finishNukeSequence, 2000);
}

 function finishNukeSequence() {
  // 타임스탑 동안 파괴된 적들을 배열에서 완전히 제거
  enemies = enemies.filter(e => !e.isDead && e.hp > 0);
  nukeBeamBeams = [];
  isNukingTransition = false;

function getCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  if (!rect || rect.width <= 0 || rect.height <= 0) return { x: LOGICAL_WIDTH / 2, y: LOGICAL_HEIGHT / 2 };
  const scaleX = LOGICAL_WIDTH / rect.width;
  const scaleY = LOGICAL_HEIGHT / rect.height;
  const rawX = (clientX - rect.left) * scaleX;
  const rawY = (clientY - rect.top) * scaleY;
  const x = Number.isFinite(rawX) ? Math.max(10, Math.min(LOGICAL_WIDTH - 10, rawX)) : LOGICAL_WIDTH / 2;
  const y = Number.isFinite(rawY) ? Math.max(10, Math.min(LOGICAL_HEIGHT - 10, rawY)) : LOGICAL_HEIGHT / 2;
  return { x, y };
}

function handlePointerDown(e) {
  initAudio();
  isTouchActive = true;
  const coords = getCanvasCoords(e.clientX, e.clientY);

  if (gameState === 0) {
    if (coords.x >= 35 && coords.x <= 415) {
      if (coords.y >= 165 && coords.y <= 240) startBattle(0);
      else if (coords.y >= 250 && coords.y <= 325) startBattle(1);
      else if (coords.y >= 335 && coords.y <= 410) startBattle(2);
      else if (coords.y >= 420 && coords.y <= 495) startBattle(3);
    }
  } else if (gameState === 1 && player) {
    if (hedgehogLauncher.timeStopTimer <= 0) {
      player.targetX = coords.x;
      player.targetY = Math.max(player.radius + 10, Math.min(LOGICAL_HEIGHT - player.radius - 10, coords.y - 120));
    }
  } else if (gameState === 2 && !randomPickShowcaseActive) {
    const cards = [
      { code: "POWER_UP", x: 35, y: 95, w: 175, h: 80 },
      { code: "SPEED_UP", x: 240, y: 95, w: 175, h: 80 },
      { code: "FIRE_RATE", x: 35, y: 195, w: 175, h: 80 },
      { code: "CLONE_SHIP", x: 240, y: 195, w: 175, h: 80 },
      { code: "LASER_WEAPON", x: 35, y: 295, w: 175, h: 80 },
      { code: "SHIELD", x: 240, y: 295, w: 175, h: 80 }
    ];

    let clickedSkill = false;
    for (let c of cards) {
      if (coords.x >= c.x && coords.x <= c.x + c.w && coords.y >= c.y && coords.y <= c.y + c.h) {
        clickedSkill = true;
        if (c.code === "LASER_WEAPON" || c.code === "SHIELD" || c.code === "CLONE_SHIP") {
          minigameTargetOption = c.code;
          minigameSelectedTime = null;
          gameState = 5;
          playTone(600, 0.1, "sine");
        } else {
          applyChosenSkill(c.code);
          playTone(523, 0.15, "triangle", 0, 0.3);
          setTimeout(() => playTone(784, 0.3, "sine", 150, 0.35), 180);
          gameState = 1;
        }
        break;
      }
    }

    const btnMult = { x: 35, y: 470, w: 380, h: 95 };
    if (!clickedSkill && coords.x >= btnMult.x && coords.x <= btnMult.x + btnMult.w && coords.y >= btnMult.y && coords.y <= btnMult.y + btnMult.h) {
      const picked = shuffledMultiplierPool[currentMultIndex];
      if (picked.type === "PWR") player.powerStat += picked.val;
      else if (picked.type === "SPD") player.speedStat += (player.name === "Power" ? picked.val * 0.7 : picked.val);
      else if (picked.type === "RATE") player.fireRateStat += picked.val;

      randomPickResult = picked;
      randomPickShowcaseActive = true;
      randomPickShowcaseStartTime = performance.now() / 1000;
      playTone(523, 0.15, "triangle", 0, 0.3);
      setTimeout(() => playTone(784, 0.3, "sine", 150, 0.35), 180);
    }
  } else if (gameState === 5 && minigameSelectedTime === null) {
    minigameSelectedTime = minigameRollingTime;
    minigameFinishTimestamp = performance.now() / 1000;
    playTone(523, 0.15, "triangle", 0, 0.3);
    setTimeout(() => playTone(784, 0.3, "sine", 150, 0.35), 180);
  } else if (gameState === 3) {
    const btnRect = { x: LOGICAL_WIDTH / 2 - 90, y: LOGICAL_HEIGHT * 0.3 + 125, w: 180, h: 42 };
    if (coords.x >= btnRect.x && coords.x <= btnRect.x + btnRect.w && coords.y >= btnRect.y && coords.y <= btnRect.y + btnRect.h) {
      const enteredName = nameInput.value.trim();
      if (enteredName.length > 0) {
        uploadScore(enteredName, score);
      }
      nameInputOverlay.style.display = "none";
      currentBgmMode = "select";
      gameState = 0;
    }
  }
}

  size: 5.5 + Math.random() * 2.5, // 네모를 벗어나지 않도록 알맞은 크기로 조절
  speed: (Math.random() < 0.5 ? 1 : -1) * (35 + Math.random() * 40),
  color: STAR_PALETTE[i % STAR_PALETTE.length]
}));

function getPerimeterPoint(boxX, boxY, dist) {
  let d = ((dist % TOTAL_PERIMETER) + TOTAL_PERIMETER) % TOTAL_PERIMETER;
  // 1. 윗변 (좌 -> 우)
  if (d < PERIMETER_W) return { x: boxX + d, y: boxY };
  d -= PERIMETER_W;
  // 2. 우측변 (상 -> 하)
  if (d < PERIMETER_H) return { x: boxX + PERIMETER_W, y: boxY + d };
  d -= PERIMETER_H;
  // 3. 아랫변 (우 -> 좌)
  if (d < PERIMETER_W) return { x: boxX + PERIMETER_W - d, y: boxY + PERIMETER_H };
  d -= PERIMETER_W;
  // 4. 좌측변 (하 -> 상)
  return { x: boxX, y: boxY + PERIMETER_H - d };
}

function getWeightedMultiplierItem() {
  const types = [
    { type: "PWR", labelPrefix: "POWER", col: "#ff0080" },
    { type: "SPD", labelPrefix: "SPEED", col: "#00f5ff" },
    { type: "RATE", labelPrefix: "RATE", col: "#ffe600" }
  ];
  const t = types[Math.floor(Math.random() * types.length)];
  const r = Math.random();
  let val = 1;
  if (r < 0.50) val = 1;
  else if (r < 0.80) val = 2;
  else val = 3;
  return { type: t.type, val: val, label: `${t.labelPrefix} +${val} (x${val})`, col: t.col };
}

function generateWeightedRoulettePool(length = 24) {
  const pool = [];
  for (let i = 0; i < length; i++) {
    let item;
    do { item = getWeightedMultiplierItem(); } 
    while (pool.length > 0 && pool[pool.length - 1].label === item.label);
    pool.push(item);
  }
  return pool;
}

let shuffledMultiplierPool = generateWeightedRoulettePool(24);
let lastMultRollTime = 0;
let currentMultIndex = 0;

let stars = Array.from({ length: 75 }, () => new Star());
let comets = Array.from({ length: 3 }, () => new Comet());
let lastCometSpawnCheck = 0;
let meteorManager = new MeteorManager();

let player = null;
let bullets = [];
let enemies = [];
let bossMissiles = [];
let bossDropItems = [];
let lightningBolts = [];
let blackHoles = [];
let currentBoss = null;
let explosions = [];
let activeLasers = [];

// ==========================================
// 8. 렌더링 프레임 루프
