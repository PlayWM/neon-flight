let lastTime = performance.now();

function drawDeepSpaceBackground(c, curTime) {
  // 매 프레임 그라데이션 재연산 제거 -> 캐시 캔버스 고속 블릿으로 발열 대폭 억제
  c.drawImage(bgOffscreen, 0, 0);
  stars.forEach(s => { s.update(); s.draw(); });
}
function safeGameLoop(now) {
  const curTime = now / 1000;
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  drawDeepSpaceBackground(ctx, curTime);

  if (curTime - lastCometSpawnCheck > 3.0) {
    lastCometSpawnCheck = curTime;
    const activeCount = comets.filter(c => c.active).length;
    if (activeCount < 3 && Math.random() < 0.45) {
      const freeComet = comets.find(c => !c.active);
      if (freeComet) freeComet.spawn();
    }
  }
  comets.forEach(c => { c.update(dt); c.draw(); });

  explosions.forEach(ex => ex.update(dt));
  explosions = explosions.filter(ex => ex.life > 0);

  lightningBolts.forEach(l => l.update(dt, enemies));
  lightningBolts = lightningBolts.filter(l => l.life > 0);

  blackHoles.forEach(b => b.update(dt, enemies));
  blackHoles = blackHoles.filter(b => b.life > 0);

// 인게임 HUD TOP 10
  if (gameState === 1) {
    ctx.save();
    // 네온 글로우 완전 제거 (그림자 초기화)
    ctx.shadowBlur = 0;
    ctx.shadowColor = "transparent";
    ctx.font = `bold 10px ${FONT_FAMILY}`;
    ctx.lineJoin = "round";
    ctx.miterLimit = 2;

    // 헤더 텍스트
    ctx.strokeStyle = "rgba(0, 0, 0, 0.65)";
    ctx.lineWidth = 2.0;
    ctx.textAlign = "left";
    ctx.strokeText("== GLOBAL TOP 10 ==", 16, 24);
    ctx.fillStyle = "rgba(0, 245, 255, 0.35)";
    ctx.fillText("== GLOBAL TOP 10 ==", 16, 24);

    top10List.forEach((item, idx) => {
      const rowY = Math.round(38 + idx * 12);
      const leftTxt = `${idx+1}. [${item.country}] ${item.name}`;
      const rightTxt = `${item.score}`;

      ctx.strokeStyle = "rgba(0, 0, 0, 0.75)";
      ctx.lineWidth = 2.0;
      ctx.textAlign = "left";
      ctx.strokeText(leftTxt, 14, rowY);
      ctx.textAlign = "right";
      ctx.strokeText(rightTxt, 170, rowY);

      ctx.fillStyle = idx === 0 ? "rgba(255, 230, 0, 0.49)" : (idx < 3 ? "rgba(0, 245, 255, 0.45)" : "rgba(255, 255, 255, 0.42)");
      ctx.textAlign = "left";
      ctx.fillText(leftTxt, 14, rowY);
      ctx.textAlign = "right";
      ctx.fillText(rightTxt, 170, rowY);
    });
    ctx.restore();
  }

  // 1. 기체 선택 화면
  if (gameState === 0) {
    ctx.save();
    ctx.shadowColor = "#00f5ff";
    ctx.shadowBlur = 7.2;
    ctx.fillStyle = "#00f5ff";
    ctx.font = `bold 28px ${FONT_FAMILY}`;
    ctx.textAlign = "center";
    ctx.fillText("NEON FLIGHT: OVERDRIVE", LOGICAL_WIDTH / 2, 60);
    ctx.restore();

    ctx.fillStyle = "#a5c0e0";
    ctx.font = `13px ${FONT_FAMILY}`;
    ctx.textAlign = "center";
    ctx.fillText("CHOOSE YOUR FIGHTER", LOGICAL_WIDTH / 2, 95);

    if (curTime - lastRandomSwitch >= 0.5) {
      lastRandomSwitch = curTime;
      randomCardDesign = Math.floor(Math.random() * 4);
    }
    if (curTime - lastRollTime >= 0.175) {
      lastRollTime = curTime;
      const bStats = generateBalancedStats();
      rollP = bStats.p; rollS = bStats.s; rollR = bStats.r;
    }

    const cards = [
      { name: "SPEED", p: 1, s: 5, r: 1, bdr: "#00f5ff", y: 165, img: 0, sub: "BURST BOMBER & HIGH MOBILITY" },
      { name: "POWER", p: 5, s: 1, r: 1, bdr: "#ff2244", y: 250, img: 1, sub: "BLACK HOLE & HEAVY CANNON" },
      { name: "TWIN", p: 1, s: 1, r: 5, bdr: "#00ff66", y: 335, img: 2, sub: "LIGHTNING ORB & RAPID FIRE" },
      { name: "RANDOM", p: rollP, s: rollS, r: rollR, bdr: "#d000ff", y: 420, img: randomCardDesign, sub: "10% CHANCE OF LEGEND SHIP" }
    ];

    cards.forEach(c => {
      ctx.save();
      ctx.fillStyle = "rgba(12, 18, 38, 0.78)";
      drawRoundRect(ctx, 35, c.y, LOGICAL_WIDTH - 70, 75, 12);
      ctx.fill();

      ctx.shadowColor = c.bdr;
      ctx.shadowBlur = 5;
      ctx.strokeStyle = c.bdr;
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.save();
      ctx.translate(75, c.y + 38);
      drawVectorPlayer(ctx, c.img, c.bdr, 0.9, Math.sin(curTime * 10) * 3);
      ctx.restore();

      ctx.textAlign = "left";
      ctx.fillStyle = "#fff";
      ctx.font = `bold 17px ${FONT_FAMILY}`;
      ctx.fillText(c.name, 115, c.y + 20);

      ctx.font = `bold 10px ${FONT_FAMILY}`;
      ctx.fillStyle = "#00f5ff";
      ctx.fillText(c.sub, 115, c.y + 35);

      const maxVal = Math.max(c.p, c.s, c.r);
      const isMaxP = (c.p === maxVal);
      const isMaxS = (c.s === maxVal && !isMaxP);
      const isMaxR = (c.r === maxVal && !isMaxP && !isMaxS);

      let xOffset = 115;
      const renderStat = (label, val, isHigh) => {
        ctx.font = isHigh ? `bold 14px ${FONT_FAMILY}` : `12px ${FONT_FAMILY}`;
        ctx.fillStyle = isHigh ? "#ffe600" : "#a0b0c8";
        const txtStr = `${label} ${val}`;
        ctx.fillText(txtStr, xOffset, c.y + 58);
        xOffset += ctx.measureText(txtStr).width + 8;

        ctx.font = `12px ${FONT_FAMILY}`;
        ctx.fillStyle = "#4a5a70";
        ctx.fillText("|", xOffset, c.y + 58);
        xOffset += 10;
      };

      renderStat("PWR", c.p, isMaxP);
      renderStat("SPD", c.s, isMaxS);
      ctx.font = isMaxR ? `bold 14px ${FONT_FAMILY}` : `12px ${FONT_FAMILY}`;
      ctx.fillStyle = isMaxR ? "#ffe600" : "#a0b0c8";
      ctx.fillText(`RATE ${c.r}`, xOffset, c.y + 58);
      ctx.restore();
    });

    const t10Y = 505;
    ctx.save();
    ctx.fillStyle = "rgba(10, 15, 32, 0.85)";
    drawRoundRect(ctx, 35, t10Y, LOGICAL_WIDTH - 70, 185, 10);
    ctx.fill();
    ctx.strokeStyle = "#00f5ff";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = "#00f5ff";
    ctx.font = `bold 13px ${FONT_FAMILY}`;
    ctx.textAlign = "center";
    ctx.fillText("★ GLOBAL TOP 10 PLAYERS ★", LOGICAL_WIDTH / 2, t10Y + 18);

    ctx.font = `bold 12px ${FONT_FAMILY}`;
    if (top10List.length === 0) {
      ctx.fillStyle = "#a0b0c8";
      ctx.fillText("WAITING FOR RECORDS...", LOGICAL_WIDTH / 2, t10Y + 90);
    } else {
      top10List.slice(0, 10).forEach((item, idx) => {
        const rowY = Math.round(t10Y + 34 + idx * 15);
        ctx.textAlign = "left";
        ctx.fillStyle = idx === 0 ? "#ffe600" : (idx < 3 ? "#00f5ff" : "#ffffff");
        ctx.fillText(`${idx + 1}. [${item.country}] ${item.name}`, 44, rowY);
        ctx.textAlign = "right";
        ctx.fillText(`${item.score} PTS`, LOGICAL_WIDTH - 44, rowY);
      });
    }
    ctx.restore();

    ctx.textAlign = "left";
    ctx.fillStyle = "#70809b";
    ctx.font = `bold 11px ${FONT_FAMILY}`;
    ctx.fillText(VERSION_STR, 10, LOGICAL_HEIGHT - 12);

  } else if (gameState === 4) {
    const elapsedShowcase = curTime - legendShowcaseStartTime;
    const remainSec = Math.max(0, (3.0 - elapsedShowcase).toFixed(1));
    const cx = LOGICAL_WIDTH / 2;
    const cy = LOGICAL_HEIGHT / 2 - 40;
    const pulse = Math.sin(curTime * 8) * 10;

    ctx.save();
    ctx.fillStyle = "rgba(255, 215, 0, 0.25)";
    ctx.shadowColor = "#ffd700";
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(cx, cy, 75 + pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.translate(cx, cy);
    drawVectorPlayer(ctx, 4, "#ffd700", 2.2, pulse);
    ctx.restore();

    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd700";
    ctx.font = `bold 20px ${FONT_FAMILY}`;
    ctx.fillText("CONGRATULATIONS!", cx, cy + 100);

    ctx.fillStyle = "#ffffff";
    ctx.font = `bold 16px ${FONT_FAMILY}`;
    ctx.fillText("LEGEND SHIP UNLOCKED!", cx, cy + 130);

    ctx.fillStyle = "#00f5ff";
    ctx.font = `14px ${FONT_FAMILY}`;
    ctx.fillText(`GAME STARTS IN ${remainSec}s`, cx, cy + 170);

    if (elapsedShowcase >= 3.0) initBattleState();

  } else if (gameState === 1) { // 2. 인게임 전투
    const isFrozen = (hedgehogLauncher.timeStopTimer > 0);
    if (isFrozen) {
      hedgehogLauncher.timeStopTimer = Math.max(0, hedgehogLauncher.timeStopTimer - dt);
    } else {
      inGameElapsedTime += dt;
    }
    const elapsed = inGameElapsedTime;

    if (gaugeBoostTimer > 0) gaugeBoostTimer = Math.max(0, gaugeBoostTimer - dt);

    if (player && player.isAlive && !isFrozen) {
      let kx = 0, ky = 0;
      if (keysPressed["arrowleft"] || keysPressed["a"] || keysPressed["keya"]) kx -= 1;
      if (keysPressed["arrowright"] || keysPressed["d"] || keysPressed["keyd"]) kx += 1;
      if (keysPressed["arrowup"] || keysPressed["w"] || keysPressed["keyw"]) ky -= 1;
      if (keysPressed["arrowdown"] || keysPressed["s"] || keysPressed["keys"]) ky += 1;

      if (kx !== 0 || ky !== 0) {
        const moveDist = player.getRealSpeed() * 60 * dt;
        player.targetX = Math.max(player.radius + 10, Math.min(LOGICAL_WIDTH - player.radius - 10, player.targetX + kx * moveDist));
        player.targetY = Math.max(player.radius + 10, Math.min(LOGICAL_HEIGHT - player.radius - 10, player.targetY + ky * moveDist));
      }
    }

    if (!isNukingTransition && !isFrozen && player) {
      player.update(dt, enemies, lightningBolts, bullets);
      player.shoot(curTime, bullets);
    }

    if (meteorManager && player && !isFrozen) {
      meteorManager.update(dt, elapsed, player, bullets);
    }

    let speedScale = 1.0;
    let widthScale = 1.0;
    if (elapsed < 60.0) {
      speedScale = 0.5; widthScale = 0.5;
    } else {
      const recoveredRatio = Math.min(1.0, 0.5 + ((elapsed - 60.0) / 30.0) * 0.2);
      speedScale = recoveredRatio; widthScale = recoveredRatio;
    }

    const hpScale = (elapsed < 60.0) ? 0.7 : 1.0;
    const earlyGaugeMultiplier = (elapsed < 60.0) ? 1.5 : 1.0;

    const steps30s = Math.floor(elapsed / 30);
    let baseGaugePerKill = Math.max(0.05, CONFIG.BASE_GAUGE_PER_KILL * Math.pow(0.8, steps30s));
    if (elapsed >= 300.0) {
      const steps20sAfter300 = Math.floor((elapsed - 300.0) / 20.0);
      baseGaugePerKill = Math.max(0.05, baseGaugePerKill * Math.pow(0.8, steps20sAfter300));
    }
    const gaugePerKill = baseGaugePerKill * (gaugeBoostTimer > 0 ? 2 : 1) * earlyGaugeMultiplier;

    let spawnInterval;
    if (elapsed < 60.0) {
      spawnInterval = CONFIG.MAX_SPAWN_INTERVAL * 1.8;
    } else {
      const steps20sAfter60 = Math.floor((elapsed - 60.0) / 20.0);
      const scaleRate = Math.pow(1 / 1.10, steps20sAfter60);
      spawnInterval = Math.max(CONFIG.MIN_SPAWN_INTERVAL, CONFIG.MAX_SPAWN_INTERVAL * scaleRate);
    }

    if (!isNukingTransition && !isFrozen && elapsed - lastSpawnTime > spawnInterval) {
      lastSpawnTime = elapsed;
      let hpMultiplier = 1.0;
      if (elapsed >= 60.0) {
        const hpSteps = Math.floor((elapsed - 60.0) / 20.0);
        hpMultiplier = Math.pow(1.3, hpSteps);
      }
      const calculatedHp = Math.max(1, Math.round((2 + Math.random() * 3) * hpScale * hpMultiplier));

      let shieldProb = 0.03;
      if (elapsed >= 60.0 && elapsed < 300.0) shieldProb = 0.03 * 1.5;
      else if (elapsed >= 300.0) {
        const shieldSteps30s = Math.floor((elapsed - 300.0) / 30.0);
        shieldProb = 0.045 * Math.pow(1.10, shieldSteps30s);
      }

      enemies.push(new Enemy(calculatedHp, CONFIG.BASE_ENEMY_SPEED + Math.min(1.0, elapsed / 180.0) * 3.5, Math.floor(Math.random() * 4), Math.random() < shieldProb, false));

      if (elapsed >= 60.0) {
        const currentHeavyCount = enemies.filter(e => e.isHeavy).length;
        if (currentHeavyCount === 0) {
          const heavyHpSteps = Math.floor((elapsed - 60.0) / 20.0);
          const heavyHpMultiplier = Math.pow(1.15, heavyHpSteps);
          const finalHeavyHp = Math.round(calculatedHp * 10 * heavyHpMultiplier);

          const bonusCount = Math.floor((elapsed - 60.0) / 30.0);
          const spawnCount = Math.floor(1 + Math.random() * 3) + bonusCount;

          for (let h = 0; h < spawnCount; h++) {
            enemies.push(new Enemy(finalHeavyHp, (CONFIG.BASE_ENEMY_SPEED * 0.85) + Math.min(1.0, elapsed / 180.0) * 3.0, Math.floor(Math.random() * 4), Math.random() < shieldProb, true));
          }
        }
      }
    }

    if (!currentBoss && elapsed >= nextBossTargetTime && !isFrozen) {
      currentBoss = new BossEnemy();
      nextBossTargetTime += 90.0;
    }
    if (currentBoss && !isFrozen) currentBoss.update(dt, curTime, bossMissiles);

    if (player && player.isAlive && player.shieldRemain > 0 && !isFrozen) {
      const shieldFieldRadius = player.radius + 36;
      bossMissiles.forEach(m => {
        const mdx = m.x - player.x, mdy = m.y - player.y;
        const mDist = Math.hypot(mdx, mdy);
        if (mDist < shieldFieldRadius + m.radius && mDist > 0) {
          const pushDir = mdx >= 0 ? 1 : -1;
          m.vx = (pushDir * 3.8);
          m.vy = Math.max(1.0, m.vy * 0.7);
        }
      });
      enemies.forEach(e => {
        const edx = e.x - player.x, edy = e.y - player.y;
        const eDist = Math.hypot(edx, edy);
        if (eDist < shieldFieldRadius + e.radius && eDist > 0) {
          const pushDir = edx >= 0 ? 1 : -1;
          e.vx += pushDir * 2.8;
        }
      });
    }

    for (let i = bossDropItems.length - 1; i >= 0; i--) {
      const it = bossDropItems[i];
      if (!isFrozen) it.update(dt);
      if (it.y > LOGICAL_HEIGHT + 30) { bossDropItems.splice(i, 1); continue; }
      if (player && player.isAlive && Math.hypot(player.x - it.x, player.y - it.y) < player.radius + it.radius) {
        const itemType = it.getType(curTime);
        if (itemType === "P") player.powerStat++;
        else if (itemType === "S") player.speedStat++;
        else if (itemType === "D") player.fireRateStat++;
        bossDropItems.splice(i, 1);
        playTone(784, 0.2, "triangle", 150);
      }
    }

    if (player && player.isAlive && player.laserWeaponTimer > 0 && !isFrozen && curTime - player.lastLaserTime >= CONFIG.LASER_WEAPON_INTERVAL) {
      player.lastLaserTime = curTime;
      player.laserMuzzleFlashTime = curTime;
      const firePoints = [{ x: player.x - 26, y: player.y - 12 }];
      if (player.clonePlaneTimer > 0) firePoints.push({ x: player.x + 42 - 26, y: player.y - 12 });

      firePoints.forEach(fp => {
        const valid = enemies.filter(e => e.y > 0 && e.hp > 0);
        if (valid.length > 0) {
          valid.sort((a, b) => Math.hypot(a.x - fp.x, a.y - fp.y) - Math.hypot(b.x - fp.x, b.y - fp.y));
          const target = valid[0];
          activeLasers.push({ sx: fp.x, sy: fp.y, tx: target.x, ty: target.y, t: curTime });
          
          if (!target.hasShield) {
            target.hp = 0;
            const eIndex = enemies.indexOf(target);
            if (eIndex !== -1) enemies.splice(eIndex, 1);
            score += 1;
            const effectiveGauge = (player && player.shieldRemain > 0) ? (gaugePerKill * 0.3) : gaugePerKill;
            skillGauge += effectiveGauge;
            explosions.push(new ExplosionFX(target.x, target.y, "#00f5ff"));
            playExplosionSound();
          } else {
            explosions.push(new ExplosionFX(target.x, target.y, "#00f5ff"));
            playTone(850, 0.08, "triangle");
          }
        }
      });
    }
    activeLasers = activeLasers.filter(l => curTime - l.t < CONFIG.LASER_BEAM_LINGER_TIME);

    if (!isFrozen) {
      bullets.forEach(b => b.update(dt));
      bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < LOGICAL_WIDTH + 20);

      bossMissiles.forEach(m => m.update(dt));
      bossMissiles = bossMissiles.filter(m => m.y < LOGICAL_HEIGHT + 30);
    }

    for (let i = bossMissiles.length - 1; i >= 0; i--) {
      const m = bossMissiles[i];
      if (player && player.isAlive && Math.hypot(player.x - m.x, player.y - m.y) < player.radius + m.radius) {
        bossMissiles.splice(i, 1);
        const isBlockedByFront = player.frontShieldRemain > 0 && m.y <= player.y;
        if (player.shieldRemain <= 0 && !isBlockedByFront) {
          player.isAlive = false;
          explosions.push(new ExplosionFX(player.x, player.y, "#ff0080"));
          playExplosionSound();
          handleGameOver();
          break;
        }
      }
    }

    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (!isFrozen) e.update(dt, elapsed, speedScale, widthScale);
      if (e.y > LOGICAL_HEIGHT + 40) { enemies.splice(ei, 1); continue; }

      if (!isFrozen) {
        for (let bi = bullets.length - 1; bi >= 0; bi--) {
          const b = bullets[bi];
          if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
            if (b.isBlackHoleTrigger && !e.hasShield) {
              blackHoles.push(new BlackHole(e.x, e.y, e.radius));
            }
            if (e.hasShield) {
              bullets.splice(bi, 1);
              explosions.push(new ExplosionFX(e.x, e.y, "#00f5ff"));
              playTone(820, 0.05, "triangle");
              break;
            }
            e.hp -= b.dmg;
            bullets.splice(bi, 1);
            if (e.hp <= 0) {
              enemies.splice(ei, 1);
              score += 1;
              const effectiveGauge = (player && player.shieldRemain > 0) ? (gaugePerKill * 0.3) : gaugePerKill;
              skillGauge += effectiveGauge;
              explosions.push(new ExplosionFX(e.x, e.y, "#ffe600"));
              playExplosionSound();
              break;
            }
          }
        }
      }

      if (player && player.isAlive && Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
        const hitAngle = Math.atan2(e.y - player.y, e.x - player.x);
        const isFrontHit = player.frontShieldRemain > 0 && (hitAngle >= -Math.PI * 0.85 && hitAngle <= -Math.PI * 0.15);

        if (e.hasShield) {
          player.isAlive = false;
          explosions.push(new ExplosionFX(player.x, player.y, "#ff0080"));
          playExplosionSound();
          handleGameOver();
          break;
        }

        if (player.shieldRemain > 0 || isFrontHit) {
          enemies.splice(ei, 1);
          explosions.push(new ExplosionFX(e.x, e.y, "#32ff78"));
          playExplosionSound();
        } else {
          player.isAlive = false;
          explosions.push(new ExplosionFX(player.x, player.y, "#ff0080"));
          playExplosionSound();
          handleGameOver();
          break;
        }
      }
    }

    if (currentBoss && !isFrozen) {
      for (let bi = bullets.length - 1; bi >= 0; bi--) {
        const b = bullets[bi];
        if (Math.hypot(b.x - currentBoss.x, b.y - currentBoss.y) < b.radius + currentBoss.radius) {
          bullets.splice(bi, 1);
          currentBoss.hp--;
          if (currentBoss.hp <= 0) {
            score += 100;
            skillGauge += gaugePerKill * 3;
            bossDropItems.push(new BossDropItem(currentBoss.x, currentBoss.y));
            for (let k = 0; k < 4; k++) {
              explosions.push(new ExplosionFX(currentBoss.x + (Math.random()*40-20), currentBoss.y + (Math.random()*40-20), "#ff2d2d"));
            }
            currentBoss = null;
            playExplosionSound();
            break;
          }
        }
      }
    }

    // 스킬 90% 고슴도치 런처 왼쪽 위 등장
    const gw = 130, gh = 16, gx = LOGICAL_WIDTH - gw - 20, gy = LOGICAL_HEIGHT - 35;
    const gPct = Math.min(1.0, skillGauge / CONFIG.MAX_SKILL_GAUGE);

    if (gPct >= 0.90 && !hedgehogLauncher.active && !isNukingTransition) {
      hedgehogLauncher.active = true;
      hedgehogLauncher.emergeProgress = 0;
      hedgehogLauncher.baseX = gx + gw / 2;
      hedgehogLauncher.baseY = gy;
      hedgehogLauncher.targetX = gx - 45;
      hedgehogLauncher.targetY = gy - 65;
    }

    if (hedgehogLauncher.active) {
      if (hedgehogLauncher.emergeProgress < 1.0) {
        hedgehogLauncher.emergeProgress = Math.min(1.0, hedgehogLauncher.emergeProgress + dt);
      }
      const ep = hedgehogLauncher.emergeProgress;
      hedgehogLauncher.x = hedgehogLauncher.baseX + (hedgehogLauncher.targetX - hedgehogLauncher.baseX) * ep;
      hedgehogLauncher.y = hedgehogLauncher.baseY + (hedgehogLauncher.targetY - hedgehogLauncher.baseY) * ep;
    }

    // 100% 충전 시 전멸 발동
    if (skillGauge >= CONFIG.MAX_SKILL_GAUGE && !isNukingTransition) {
      skillGauge = 0.0;
      triggerSlotSequence();
    }

    activeLasers.forEach(l => {
      ctx.save();
      ctx.shadowColor = "#00f5ff";
      ctx.shadowBlur = 7.2;
      ctx.strokeStyle = "rgba(0, 245, 255, 0.4)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(l.sx, l.sy); ctx.lineTo(l.tx, l.ty);
      ctx.stroke();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(l.sx, l.sy); ctx.lineTo(l.tx, l.ty);
      ctx.stroke();
      ctx.restore();
    });

    nukeBeamBeams = nukeBeamBeams.filter(b => curTime - b.startTime < b.duration);
    nukeBeamBeams.forEach(b => {
      const alpha = Math.max(0, 1.0 - (curTime - b.startTime) / b.duration);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 14;

      ctx.strokeStyle = b.color;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(b.sx, b.sy); ctx.lineTo(b.tx, b.ty);
      ctx.stroke();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(b.sx, b.sy); ctx.lineTo(b.tx, b.ty);
      ctx.stroke();
      ctx.restore();
    });

    bullets.forEach(b => b.draw());
    bossMissiles.forEach(m => m.draw());
    bossDropItems.forEach(it => it.draw(curTime));
    // 체력이 남아있고 파괴되지 않은 적만 렌더링 (레이저 피격 즉시 화면에서 소멸)
    enemies.filter(e => !e.isDead && e.hp > 0).forEach(e => e.draw(curTime));
    blackHoles.forEach(b => b.draw());
    lightningBolts.forEach(l => l.draw());
    if (currentBoss) currentBoss.draw(curTime);
    if (meteorManager) {
      meteorManager.drawMeteors();
      meteorManager.drawWarning();
    }
    explosions.forEach(ex => ex.draw());
    if (player) player.draw(curTime);

    drawHedgehogLauncher(ctx, curTime);

    if (hedgehogLauncher.flashAlpha > 0) {
      ctx.save();
      ctx.fillStyle = `rgba(255, 255, 255, ${hedgehogLauncher.flashAlpha})`;
      ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      ctx.restore();
      hedgehogLauncher.flashAlpha = Math.max(0, hedgehogLauncher.flashAlpha - (dt / 0.3));
    }

    ctx.save();
    ctx.textAlign = "right";
    ctx.shadowColor = "#00f5ff";
    ctx.shadowBlur = 5;
    ctx.fillStyle = "#ffffff";
    ctx.font = `bold 15px ${FONT_FAMILY}`;
    ctx.fillText(`SCORE: ${score}`, LOGICAL_WIDTH - 20, 25);
    ctx.fillStyle = "#ffe600";
    ctx.font = `13px ${FONT_FAMILY}`;
    ctx.fillText(`TIME: ${Math.floor(elapsed)}s`, LOGICAL_WIDTH - 20, 45);
    ctx.restore();

    const baseBottomY = LOGICAL_HEIGHT - 12;
    ctx.textAlign = "left";
    ctx.fillStyle = "#607085";
    ctx.font = `bold 11px ${FONT_FAMILY}`;
    ctx.fillText(VERSION_STR, 10, baseBottomY);

    const renderBlinkingSkill = (label, remain, yOffset, baseCol) => {
      if (remain <= 0) return;
      let isBlink = (remain <= 5.0) && (Math.floor(curTime / 0.25) % 2 === 0);
      ctx.fillStyle = isBlink ? "#ffffff" : baseCol;
      ctx.fillText(`${label}: ${remain.toFixed(1)}s`, 10, baseBottomY - yOffset);
    };

    if (player) {
      ctx.font = `12px ${FONT_FAMILY}`;
      ctx.fillStyle = "#ff0080"; ctx.fillText(`POWER : Lv.${Math.round(player.powerStat)}`, 10, baseBottomY - 86);
      ctx.fillStyle = "#00f5ff"; ctx.fillText(`SPEED : Lv.${Math.round(player.speedStat)}`, 10, baseBottomY - 70);
      ctx.fillStyle = "#ffe600"; ctx.fillText(`RATE  : Lv.${Math.round(player.fireRateStat)}`, 10, baseBottomY - 54);

      renderBlinkingSkill("DOUBLE", player.clonePlaneTimer, 38, "#78a0ff");
      renderBlinkingSkill("LASER ", player.laserWeaponTimer, 24, "#00f5ff");
      renderBlinkingSkill("SHIELD", player.shieldRemain, 10, "#32ff78");
    }

    ctx.save();
    if (gPct >= 0.8) {
      ctx.shadowColor = "#ffe600";
      ctx.shadowBlur = 5;
    }
    ctx.fillStyle = "#1e2438";
    drawRoundRect(ctx, gx, gy, gw, gh, 4);
    ctx.fill();

    ctx.fillStyle = gaugeBoostTimer > 0 ? "#ffe600" : "#00f5ff";
    drawRoundRect(ctx, gx, gy, gw * gPct, gh, 4);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    ctx.textAlign = "left";
    ctx.fillStyle = gaugeBoostTimer > 0 ? "#ffe600" : "#00f5ff";
    ctx.font = `bold 12px ${FONT_FAMILY}`;
    ctx.fillText(gaugeBoostTimer > 0 ? "SKILL GAUGE [2X]" : "SKILL GAUGE", gx, gy - 6);

} else if (gameState === 2) { // 3. 업그레이드 슬롯 선택
    ctx.textAlign = "center";
    ctx.fillStyle = "#00f5ff";
    ctx.font = `bold 24px ${FONT_FAMILY}`;
    ctx.fillText("UPGRADE SELECTION", LOGICAL_WIDTH / 2, 44);

    ctx.fillStyle = "#e2e8f0";
    ctx.font = `bold 13px ${FONT_FAMILY}`;
    ctx.shadowColor = "#00f5ff";
    ctx.shadowBlur = 4;
    ctx.fillText("★ [ GUARANTEED : 100% INSTANT UPGRADE ] ★", LOGICAL_WIDTH / 2, 74);
    ctx.shadowBlur = 0;

    const cards = [
      { code: "POWER_UP", title: "POWER UP + 1", desc: `Current Lv.${player ? Math.round(player.powerStat) : 1}`, col: "#00f5ff", subCol: "#ff0080", x: 35, y: 95, w: 175, h: 80 },
      { code: "SPEED_UP", title: "SPEED UP + 1", desc: `Current Lv.${player ? Math.round(player.speedStat) : 1}`, col: "#00f5ff", subCol: "#00f5ff", x: 240, y: 95, w: 175, h: 80 },
      { code: "FIRE_RATE", title: "FIRE RATE + 1", desc: `Current Lv.${player ? Math.round(player.fireRateStat) : 1}`, col: "#64aaff", subCol: "#ffe600", x: 35, y: 195, w: 175, h: 80 },
      { code: "CLONE_SHIP", title: "CLONE SHIP", desc: "1 ~ 30s RANDOM", col: "#78a0ff", subCol: "#78a0ff", x: 240, y: 195, w: 175, h: 80 },
      { code: "LASER_WEAPON", title: "LASER GUN", desc: "1 ~ 30s RANDOM", col: "#32ff78", subCol: "#00f5ff", x: 35, y: 295, w: 175, h: 80 },
      { code: "SHIELD", title: "ENERGY SHIELD", desc: "1 ~ 30s RANDOM", col: "#32ff78", subCol: "#32ff78", x: 240, y: 295, w: 175, h: 80 }
    ];

// 반짝임 인덱스 업데이트 코드 삭제

    cards.forEach((c) => {
      ctx.save();
      ctx.fillStyle = "rgba(10, 16, 35, 0.85)";
      drawRoundRect(ctx, c.x, c.y, c.w, c.h, 10);
      ctx.fill();
      ctx.shadowColor = c.col;
      ctx.shadowBlur = 4;
      ctx.strokeStyle = c.col;
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold 15px ${FONT_FAMILY}`;
      ctx.fillText(c.title, c.x + c.w / 2, c.y + 35);

      ctx.fillStyle = c.subCol;
      ctx.font = `bold 13px ${FONT_FAMILY}`;
      ctx.fillText(c.desc, c.x + c.w / 2, c.y + 60);
      ctx.restore();
    });

    if (curTime - lastMultRollTime >= 0.048) {
      lastMultRollTime = curTime;
      currentMultIndex = (currentMultIndex + 1) % shuffledMultiplierPool.length;
    }
    const currentMultOption = shuffledMultiplierPool[currentMultIndex];

    const btnMult = { x: 35, y: 470, w: PERIMETER_W, h: PERIMETER_H };
    ctx.save();
    ctx.fillStyle = "rgba(20, 26, 52, 0.95)";
    drawRoundRect(ctx, btnMult.x, btnMult.y, btnMult.w, btnMult.h, 12);
    ctx.fill();
    ctx.strokeStyle = "#ffd700";
    ctx.lineWidth = 2.0;
    ctx.shadowColor = "#ffd700";
    ctx.shadowBlur = 5;
    ctx.stroke();

    ORBIT_STARS.forEach((st, idx) => {
      st.dist += st.speed * dt;
      const pt = getPerimeterPoint(btnMult.x, btnMult.y, st.dist);
      const pulse = Math.sin(curTime * 20.0 + idx) * 0.25 + 0.75;
      ctx.fillStyle = st.color;
      drawStarShape(ctx, pt.x, pt.y, 5, st.size * pulse, st.size * pulse * 0.45);
      ctx.fill();
    });

    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd700";
    ctx.font = `bold 12px ${FONT_FAMILY}`;
    ctx.fillText("★ [ RANDOM CHANCE : UP TO 3X MULTIPLIER ] ★", btnMult.x + btnMult.w / 2, btnMult.y + 24);

    ctx.fillStyle = currentMultOption.col;
    ctx.font = `bold 24px ${FONT_FAMILY}`;
    ctx.fillText(currentMultOption.label, btnMult.x + btnMult.w / 2, btnMult.y + 56);

    ctx.fillStyle = "#a5c0e0";
    ctx.font = `11px ${FONT_FAMILY}`;
    ctx.fillText("x1 (50%) / x2 (30%) / x3 (20%) CHANCE", btnMult.x + btnMult.w / 2, btnMult.y + 80);
    ctx.restore();

    if (randomPickShowcaseActive) {
      const showcaseElapsed = curTime - randomPickShowcaseStartTime;
      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

      const popW = 340, popH = 200;
      const popX = LOGICAL_WIDTH / 2 - popW / 2;
      const popY = LOGICAL_HEIGHT / 2 - popH / 2;

      ctx.save();
      ctx.fillStyle = "rgba(15, 25, 45, 0.98)";
      drawRoundRect(ctx, popX, popY, popW, popH, 14);
      ctx.fill();
      ctx.strokeStyle = "#ffd700";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.fillStyle = "#ffd700";
      ctx.font = `bold 18px ${FONT_FAMILY}`;
      ctx.fillText("★ BONUS MULTIPLIER WON! ★", LOGICAL_WIDTH / 2, popY + 45);

      ctx.fillStyle = randomPickResult.col;
      ctx.font = `bold 32px ${FONT_FAMILY}`;
      ctx.fillText(randomPickResult.label, LOGICAL_WIDTH / 2, popY + 105);

      ctx.fillStyle = "#00f5ff";
      ctx.font = `bold 14px ${FONT_FAMILY}`;
      ctx.fillText("STAT UPGRADED! RETURNING...", LOGICAL_WIDTH / 2, popY + 155);
      ctx.restore();

      if (showcaseElapsed >= 2.0) {
        randomPickShowcaseActive = false;
        gameState = 1;
      }
    }

    ctx.textAlign = "left";
    ctx.fillStyle = "#70809b";
    ctx.font = `bold 11px ${FONT_FAMILY}`;
    ctx.fillText(VERSION_STR, 10, LOGICAL_HEIGHT - 12);

  } else if (gameState === 5) { // 3-1. 시간 룰렛 미니게임
    const popW = 320, popH = 240;
    const popX = LOGICAL_WIDTH / 2 - popW / 2;
    const popY = LOGICAL_HEIGHT / 2 - popH / 2;

    ctx.save();
    ctx.fillStyle = "rgba(12, 18, 38, 0.95)";
    drawRoundRect(ctx, popX, popY, popW, popH, 12);
    ctx.fill();
    ctx.strokeStyle = "#00f5ff";
    ctx.lineWidth = 2;
    ctx.shadowColor = "#00f5ff";
    ctx.shadowBlur = 5;
    ctx.stroke();

    ctx.textAlign = "center";
    ctx.fillStyle = "#00f5ff";
    ctx.font = `bold 18px ${FONT_FAMILY}`;
    const skillTitle = minigameTargetOption === "LASER_WEAPON" ? "LASER WEAPON" : (minigameTargetOption === "SHIELD" ? "ENERGY SHIELD" : "CLONE SHIP");
    ctx.fillText(skillTitle, LOGICAL_WIDTH / 2, popY + 45);

    if (minigameSelectedTime === null) {
      minigameRollingTime = Math.floor(10 + Math.random() * 21);
      ctx.fillStyle = "#ffe600";
      ctx.font = `bold 56px ${FONT_FAMILY}`;
      ctx.fillText(`${minigameRollingTime}s`, LOGICAL_WIDTH / 2, popY + 125);

      ctx.fillStyle = "#ffffff";
      ctx.font = `13px ${FONT_FAMILY}`;
      ctx.fillText("TAP OR CLICK SCREEN TO STOP!", LOGICAL_WIDTH / 2, popY + 185);
    } else {
      ctx.fillStyle = "#32ff78";
      ctx.font = `bold 56px ${FONT_FAMILY}`;
      ctx.fillText(`${minigameSelectedTime}s`, LOGICAL_WIDTH / 2, popY + 125);

      ctx.fillStyle = "#32ff78";
      ctx.font = `bold 15px ${FONT_FAMILY}`;
      ctx.fillText("DURATION CONFIRMED!", LOGICAL_WIDTH / 2, popY + 185);

      if (curTime - minigameFinishTimestamp >= 1.2) {
        applyChosenSkill(minigameTargetOption, minigameSelectedTime);
        gameState = 1;
      }
    }
    ctx.restore();

  } else if (gameState === 3) { // 4. 게임 오버
    const popY = LOGICAL_HEIGHT * 0.3;
    ctx.save();
    ctx.fillStyle = "#121626";
    drawRoundRect(ctx, LOGICAL_WIDTH / 2 - 160, popY - 20, 320, 220, 14);
    ctx.fill();
    ctx.strokeStyle = "#ff0080";
    ctx.lineWidth = 2;
    ctx.shadowColor = "#ff0080";
    ctx.shadowBlur = 5;
    ctx.stroke();

    ctx.textAlign = "center";
    ctx.fillStyle = "#ff0080";
    ctx.font = `bold 24px ${FONT_FAMILY}`;
    ctx.fillText("GAME OVER", LOGICAL_WIDTH / 2, popY + 15);
    ctx.fillStyle = "#ffe600";
    ctx.font = `16px ${FONT_FAMILY}`;
    ctx.fillText(`FINAL SCORE: ${score}`, LOGICAL_WIDTH / 2, popY + 45);

    ctx.fillStyle = "#00f5ff";
    drawRoundRect(ctx, LOGICAL_WIDTH / 2 - 90, popY + 125, 180, 42, 8);
    ctx.fill();
    ctx.fillStyle = "#080c18";
    ctx.font = `bold 15px ${FONT_FAMILY}`;
    ctx.fillText("SUBMIT & RESTART", LOGICAL_WIDTH / 2, popY + 151);
    ctx.restore();

    ctx.textAlign = "left";
    ctx.fillStyle = "#70809b";
    ctx.font = `bold 11px ${FONT_FAMILY}`;
    ctx.fillText(VERSION_STR, 10, LOGICAL_HEIGHT - 12);
  }

  requestAnimationFrame(safeGameLoop);
}

function handleGameOver() {
  setTimeout(() => {
    gameState = 3;
    const isTop10Eligible = score > 0 && (top10List.length < 10 || score > top10List[top10List.length - 1].score);
    if (isTop10Eligible) {
      nameInputOverlay.style.display = "block";
      nameInput.value = "";
      nameInput.focus();
    } else {
      nameInputOverlay.style.display = "none";
    }
  }, 800);
}

requestAnimationFrame(safeGameLoop);
</script>
</body>
</html>
