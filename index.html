<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Flight: Overdrive - v20261005.006</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      background: #080814;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #gameCanvas {
      background: #080814;
      display: block;
      width: 100vw;
      height: 100vh;
      max-width: 450px;
      max-height: 800px;
      aspect-ratio: 450 / 800;
      box-shadow: 0 0 25px rgba(0, 245, 255, 0.2);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="450" height="800"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const CONFIG = {
      BASE_PLAYER_SPEED: 5.2,
      BASE_FIRE_INTERVAL: 0.405,
      FIRE_RATE_REDUCTION: 0.05,
      LASER_WEAPON_INTERVAL: 1.0,
      LASER_WEAPON_DURATION: 30.5,
      LASER_BEAM_LINGER_TIME: 0.2,
      CLONE_SHIP_DURATION: 30.0,
      SHIELD_DURATION: 30.0,
      MAX_SKILL_GAUGE: 100.0,
      GAUGE_PER_KILL: 14.0,
      SLOT_CYCLE_INTERVAL: 0.22,
      SLOT_AUTO_PICK_TIMEOUT: 5.0,
      SLOT_RESULT_DISPLAY_TIME: 2.0
    };

    const VERSION_STR = "v20261005.006";
    const STATE_SELECT = 0, STATE_BATTLE = 1, STATE_SLOT = 2, STATE_GAMEOVER = 3;
    let gameState = STATE_SELECT;

    // 슬롯 기본 옵션 및 가중치
    const RAW_SLOT_OPTIONS = [
      { code: "POWER_UP", label: "POWER UP (+1)", weight: 30 },
      { code: "SPEED_UP", label: "SPEED UP (+1)", weight: 30 },
      { code: "FIRE_RATE", label: "FIRING RATE (+1)", weight: 30 },
      { code: "SHIELD", label: "SHIELD (30s)", weight: 15 },
      { code: "LASER_WEAPON", label: "LASER WEAPON (30.5s)", weight: 15 },
      { code: "CLONE_SHIP", label: "CLONE SHIP (30s)", weight: 10 }
    ];

    let stars = Array.from({ length: 65 }, () => ({
      x: Math.random() * 450,
      y: Math.random() * 800,
      speed: 0.6 + Math.random() * 1.6,
      size: Math.random() < 0.6 ? 1 : 2,
      alpha: 0.3 + Math.random() * 0.7
    }));

    let player = null;
    let bullets = [], enemies = [], laserLines = [];
    let score = 0, skillGauge = 0, lastSpawnTime = 0;
    let slotActivePool = [], slotStartTime = 0, slotPickedItem = null, slotPickTime = 0, slotIsSelected = false;

    function resetBattle(pType) {
      player = {
        type: pType,
        x: 225,
        y: 650,
        tx: 225,
        ty: 650,
        r: 22,
        power: pType === 1 ? 3 : 1,
        speed: pType === 0 ? 3 : 1,
        fireRate: pType === 2 ? 3 : 1,
        cloneTimer: 0,
        laserTimer: 0,
        lastLaser: 0,
        shieldTimer: 0,
        lastShot: 0,
        isAlive: true
      };
      bullets = [];
      enemies = [];
      laserLines = [];
      score = 0;
      skillGauge = 0;
      lastSpawnTime = performance.now() / 1000;
      gameState = STATE_BATTLE;
    }

    function calculateSlotPool() {
      let pool = RAW_SLOT_OPTIONS.filter(opt => {
        if (opt.code === "CLONE_SHIP" && player.cloneTimer > 0) return false;
        if (opt.code === "POWER_UP" && player.power >= 10) return false;
        if (opt.code === "SPEED_UP" && player.speed >= 10) return false;
        if (opt.code === "FIRE_RATE" && player.fireRate >= 10) return false;
        return true;
      });

      if (pool.length === 0) {
        pool = [
          { code: "SHIELD", label: "SHIELD (30s)", weight: 50 },
          { code: "LASER_WEAPON", label: "LASER WEAPON (30.5s)", weight: 50 }
        ];
      }

      const totalWeight = pool.reduce((acc, cur) => acc + cur.weight, 0);
      pool.forEach(item => {
        item.prob = ((item.weight / totalWeight) * 100).toFixed(1);
      });
      return pool;
    }

    function openSlotMachine() {
      enemies = [];
      laserLines = [];
      slotActivePool = calculateSlotPool();
      slotStartTime = performance.now() / 1000;
      slotIsSelected = false;
      slotPickedItem = null;
      gameState = STATE_SLOT;
    }

    function pickRandomReward() {
      const totalWeight = slotActivePool.reduce((acc, cur) => acc + cur.weight, 0);
      let rand = Math.random() * totalWeight;
      for (let item of slotActivePool) {
        if (rand < item.weight) return item;
        rand -= item.weight;
      }
      return slotActivePool[0];
    }

    function applySlotReward(code) {
      if (code === "POWER_UP") player.power = Math.min(10, player.power + 1);
      else if (code === "SPEED_UP") player.speed = Math.min(10, player.speed + 1);
      else if (code === "FIRE_RATE") player.fireRate = Math.min(10, player.fireRate + 1);
      else if (code === "CLONE_SHIP") player.cloneTimer = CONFIG.CLONE_SHIP_DURATION;
      else if (code === "LASER_WEAPON") {
        player.laserTimer = CONFIG.LASER_WEAPON_DURATION;
        player.lastLaser = performance.now() / 1000;
      } else if (code === "SHIELD") player.shieldTimer = CONFIG.SHIELD_DURATION;
    }

    // 마우스 및 터치 이벤트
    function handlePointer(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (clientX - rect.left) * scaleX;
      const y = (clientY - rect.top) * scaleY;

      if (gameState === STATE_SELECT) {
        if (y >= 220 && y <= 300) resetBattle(0);
        else if (y >= 340 && y <= 420) resetBattle(1);
        else if (y >= 460 && y <= 540) resetBattle(2);
      } else if (gameState === STATE_BATTLE) {
        player.tx = x;
        player.ty = y - 60;
      } else if (gameState === STATE_SLOT) {
        if (!slotIsSelected && slotActivePool.length > 0) {
          slotIsSelected = true;
          slotPickTime = performance.now() / 1000;
          slotPickedItem = pickRandomReward();
        }
      } else if (gameState === STATE_GAMEOVER) {
        gameState = STATE_SELECT;
      }
    }

    canvas.addEventListener("mousedown", e => handlePointer(e.clientX, e.clientY));
    canvas.addEventListener("mousemove", e => {
      if (gameState === STATE_BATTLE && e.buttons === 1) handlePointer(e.clientX, e.clientY);
    });
    canvas.addEventListener("touchstart", e => {
      e.preventDefault();
      const touch = e.touches[0];
      handlePointer(touch.clientX, touch.clientY);
    }, { passive: false });
    canvas.addEventListener("touchmove", e => {
      e.preventDefault();
      const touch = e.touches[0];
      handlePointer(touch.clientX, touch.clientY);
    }, { passive: false });

    function drawPixelShip(cx, cy, color) {
      ctx.fillStyle = color;
      ctx.fillRect(cx - 4, cy - 18, 8, 36);
      ctx.fillRect(cx - 16, cy + 4, 32, 8);
      ctx.fillStyle = "#fff";
      ctx.fillRect(cx - 2, cy - 10, 4, 12);
    }

    let lastFrameTime = performance.now() / 1000;

    function gameLoop() {
      const now = performance.now() / 1000;
      const dt = Math.min(0.1, now - lastFrameTime);
      lastFrameTime = now;

      // 배경 업데이트
      stars.forEach(st => {
        st.y += st.speed;
        if (st.y > 800) { st.y = 0; st.x = Math.random() * 450; }
      });

      // 렌더링 기본 초기화
      ctx.fillStyle = "#080814";
      ctx.fillRect(0, 0, 450, 800);

      stars.forEach(st => {
        ctx.fillStyle = `rgba(180, 210, 255, ${st.alpha})`;
        ctx.fillRect(st.x, st.y, st.size, st.size);
      });

      if (gameState === STATE_SELECT) {
        ctx.fillStyle = "#00f5ff";
        ctx.font = "bold 26px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("NEON FLIGHT: OVERDRIVE", 225, 100);

        ctx.fillStyle = "#fff";
        ctx.font = "14px sans-serif";
        ctx.fillText("CHOOSE YOUR FIGHTER", 225, 140);

        const cards = [
          { name: "1. SPEED FIGHTER", y: 220, sub: "SPD 3 | PWR 1 | RATE 1" },
          { name: "2. POWER FIGHTER", y: 340, sub: "PWR 3 | SPD 1 | RATE 1" },
          { name: "3. TWIN FIGHTER",  y: 460, sub: "RATE 3 | PWR 1 | SPD 1" }
        ];

        cards.forEach(card => {
          ctx.fillStyle = "#151b2e";
          ctx.fillRect(40, card.y, 370, 80);
          ctx.strokeStyle = "#00f5ff";
          ctx.lineWidth = 2;
          ctx.strokeRect(40, card.y, 370, 80);

          ctx.fillStyle = "#fff";
          ctx.font = "bold 18px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(card.name, 225, card.y + 35);
          ctx.fillStyle = "#ffd200";
          ctx.font = "13px sans-serif";
          ctx.fillText(card.sub, 225, card.y + 60);
        });

      } else if (gameState === STATE_BATTLE) {
        // 타이머 감소
        if (player.cloneTimer > 0) player.cloneTimer = Math.max(0, player.cloneTimer - dt);
        if (player.laserTimer > 0) player.laserTimer = Math.max(0, player.laserTimer - dt);
        if (player.shieldTimer > 0) player.shieldTimer = Math.max(0, player.shieldTimer - dt);

        // 이동 처리
        const dx = player.tx - player.x;
        const dy = player.ty - player.y;
        const dist = Math.hypot(dx, dy);
        const moveStep = (CONFIG.BASE_PLAYER_SPEED + player.speed * 0.7) * 60 * dt;
        if (dist > 1) {
          player.x += (dx / dist) * Math.min(dist, moveStep);
          player.y += (dy / dist) * Math.min(dist, moveStep);
        }

        // 총알 발사
        const fireInterval = Math.max(0.08, CONFIG.BASE_FIRE_INTERVAL - player.fireRate * CONFIG.FIRE_RATE_REDUCTION);
        if (now - player.lastShot >= fireInterval) {
          player.lastShot = now;
          if (player.type === 2) {
            bullets.push({ x: player.x - 12, y: player.y - 18, vx: 0, vy: -15, dmg: player.power });
            bullets.push({ x: player.x + 12, y: player.y - 18, vx: 0, vy: -15, dmg: player.power });
          } else {
            bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -16, dmg: player.power });
          }
          if (player.cloneTimer > 0) {
            bullets.push({ x: player.x + 40, y: player.y - 20, vx: 0, vy: -16, dmg: player.power });
          }
        }

        // 레이저 발사
        if (player.laserTimer > 0 && now - player.lastLaser >= CONFIG.LASER_WEAPON_INTERVAL) {
          player.lastLaser = now;
          if (enemies.length > 0) {
            let target = enemies[0];
            let minDist = Math.hypot(target.x - player.x, target.y - player.y);
            enemies.forEach(e => {
              let d = Math.hypot(e.x - player.x, e.y - player.y);
              if (d < minDist) { minDist = d; target = e; }
            });

            laserLines.push({ sx: player.x, sy: player.y - 15, ex: target.x, ey: target.y, birth: now });
            enemies = enemies.filter(e => e !== target);
            score++;
            skillGauge += CONFIG.GAUGE_PER_KILL;
          }
        }

        // 스폰
        if (now - lastSpawnTime >= 0.75) {
          lastSpawnTime = now;
          enemies.push({
            x: 40 + Math.random() * 370,
            y: -30,
            speed: 3.2 + Math.random() * 1.6,
            hp: 3,
            r: 18
          });
        }

        // 탄환 업데이트
        bullets.forEach(b => { b.y += b.vy; });
        bullets = bullets.filter(b => b.y > -20);

        // 적 업데이트 및 피격
        enemies.forEach(e => {
          e.y += e.speed;
          bullets.forEach(b => {
            if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
              e.hp -= b.dmg;
              b.y = -100;
              if (e.hp <= 0) {
                score++;
                skillGauge += CONFIG.GAUGE_PER_KILL;
              }
            }
          });

          // 플레이어 충돌
          if (Math.hypot(player.x - e.x, player.y - e.y) < player.r + e.r) {
            if (player.shieldTimer > 0) {
              player.shieldTimer = 0;
              e.hp = 0;
            } else {
              gameState = STATE_GAMEOVER;
            }
          }
        });

        enemies = enemies.filter(e => e.hp > 0 && e.y < 840);

        // 총알 그리기
        ctx.fillStyle = "#ffe600";
        bullets.forEach(b => {
          ctx.beginPath();
          ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
          ctx.fill();
        });

        // 레이저 라인 그리기 (0.2초 잔존)
        laserLines = laserLines.filter(l => now - l.birth < CONFIG.LASER_BEAM_LINGER_TIME);
        laserLines.forEach(l => {
          const alpha = 1.0 - (now - l.birth) / CONFIG.LASER_BEAM_LINGER_TIME;
          ctx.strokeStyle = `rgba(0, 245, 255, ${alpha})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(l.sx, l.sy);
          ctx.lineTo(l.ex, l.ey);
          ctx.stroke();
        });

        // 적 그리기
        enemies.forEach(e => {
          ctx.fillStyle = "#ff2860";
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
          ctx.fill();
        });

        // 플레이어 그리기
        drawPixelShip(player.x, player.y, "#00f5ff");
        if (player.cloneTimer > 0) drawPixelShip(player.x + 40, player.y, "#00f5ff");
        if (player.shieldTimer > 0) {
          ctx.strokeStyle = "#32ff78";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.r + 10, 0, Math.PI * 2);
          ctx.stroke();
        }

        // HUD
        ctx.fillStyle = "#fff";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`SCORE: ${score}`, 20, 35);

        // 스킬 게이지 바
        ctx.fillStyle = "#505064";
        ctx.fillRect(280, 20, 150, 16);
        const gw = Math.min(1.0, skillGauge / CONFIG.MAX_SKILL_GAUGE) * 150;
        ctx.fillStyle = "#00f5ff";
        ctx.fillRect(280, 20, gw, 16);
        ctx.font = "11px sans-serif";
        ctx.fillText("SKILL GAUGE", 280, 50);

        if (skillGauge >= CONFIG.MAX_SKILL_GAUGE) {
          skillGauge = 0;
          openSlotMachine();
        }

      } else if (gameState === STATE_SLOT) {
        // 1) 슬롯머신 상단 옵션 및 실시간 확률 표기
        ctx.fillStyle = "#ff0080";
        ctx.font = "bold 24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("ALL ENEMIES CLEARED!", 225, 45);

        ctx.fillStyle = "#0f1426";
        ctx.fillRect(25, 75, 400, 195);
        ctx.strokeStyle = "#00f5ff";
        ctx.lineWidth = 1;
        ctx.strokeRect(25, 75, 400, 195);

        ctx.fillStyle = "#00f5ff";
        ctx.font = "bold 13px sans-serif";
        ctx.fillText("[ AVAILABLE OPTIONS & PROBABILITY ]", 225, 96);

        slotActivePool.forEach((item, idx) => {
          const rowY = 122 + idx * 24;
          const isSelectedTarget = slotIsSelected && slotPickedItem && slotPickedItem.code === item.code;

          ctx.font = isSelectedTarget ? "bold 13px sans-serif" : "12px sans-serif";
          ctx.fillStyle = isSelectedTarget ? "#ffe600" : "#b4c0dc";
          ctx.textAlign = "left";
          ctx.fillText((isSelectedTarget ? "▶ " : "• ") + item.label, 40, rowY);

          ctx.textAlign = "right";
          ctx.fillText(`(${item.prob}%)`, 410, rowY);
        });

        // 2) 슬롯 애니메이션 및 자동/수동 선택 로직
        const elapsed = now - slotStartTime;
        if (!slotIsSelected && elapsed >= CONFIG.SLOT_AUTO_PICK_TIMEOUT && slotActivePool.length > 0) {
          slotIsSelected = true;
          slotPickTime = now;
          slotPickedItem = pickRandomReward();
        }

        ctx.fillStyle = "#161c37";
        ctx.fillRect(45, 330, 360, 110);

        if (!slotIsSelected) {
          const curIdx = Math.floor(elapsed / CONFIG.SLOT_CYCLE_INTERVAL) % slotActivePool.length;
          const dispText = slotActivePool[curIdx].label;

          ctx.strokeStyle = "#ffe600";
          ctx.lineWidth = 3;
          ctx.strokeRect(45, 330, 360, 110);

          ctx.fillStyle = "#fff";
          ctx.font = "bold 20px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(dispText, 225, 395);

          ctx.fillStyle = "#00f5ff";
          ctx.font = "bold 15px sans-serif";
          ctx.fillText("TAP / CLICK ANYWHERE TO STOP!", 225, 470);

          const remain = Math.max(0, Math.ceil(CONFIG.SLOT_AUTO_PICK_TIMEOUT - elapsed));
          ctx.fillStyle = "#ffe600";
          ctx.font = "13px sans-serif";
          ctx.fillText(`AUTO-PICK IN ${remain}s, GAME STARTS`, 225, 500);
        } else {
          // 3) 선택 완료 상태 (2초 유지 후 복귀)
          ctx.strokeStyle = "#32ff78";
          ctx.lineWidth = 4;
          ctx.strokeRect(45, 330, 360, 110);

          ctx.fillStyle = "#fff";
          ctx.font = "bold 20px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(slotPickedItem.label, 225, 395);

          ctx.fillStyle = "#32ff78";
          ctx.font = "bold 22px sans-serif";
          ctx.fillText("SELECTED!", 225, 475);

          if (now - slotPickTime >= CONFIG.SLOT_RESULT_DISPLAY_TIME) {
            applySlotReward(slotPickedItem.code);
            gameState = STATE_BATTLE;
          }
        }

      } else if (gameState === STATE_GAMEOVER) {
        ctx.fillStyle = "#ff0080";
        ctx.font = "bold 32px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", 225, 320);

        ctx.fillStyle = "#ffe600";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText(`FINAL SCORE: ${score}`, 225, 370);

        ctx.fillStyle = "#00f5ff";
        ctx.font = "14px sans-serif";
        ctx.fillText("CLICK ANYWHERE TO RESTART", 225, 430);
      }

      ctx.fillStyle = "#37374b";
      ctx.font = "12px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(VERSION_STR, 10, 790);

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
