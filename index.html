function drawRoundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

// --- [Web Audio API 사운드 신시사이저 & BGM 엔진] ---
let audioCtx = null;

let bgmStep = 0;
let currentBgmMode = "select";
let inGameBgmTrack = 0;

function initAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      startBGMEngine();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}

function playTone(freq, duration, type="sine", sweep=0, vol=0.15) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    const now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(freq, now);
    if (sweep !== 0) osc.frequency.linearRampToValueAtTime(freq + sweep, now + duration);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  } catch(e){}
}

function playExplosionSound() {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const dur = 0.22;
    const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < buf.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / buf.length);
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    src.buffer = buf;
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(now);
  } catch(e){}
}

function startBGMEngine() {
  if (bgmInterval) return;
  const selectMelody = [261.63, 293.66, 329.63, 392.00];
  const inGameTrack1 = [130.81, 164.81, 196.00, 246.94, 261.63, 329.63];
  const inGameTrack2 = [146.83, 174.61, 220.00, 261.63, 293.66, 349.23];
  const inGameTrack3 = [110.00, 130.81, 146.83, 164.81, 220.00, 261.63];

  bgmInterval = setInterval(() => {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;

    if (currentBgmMode === "select") {
      if (bgmStep % 4 === 0) {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = "sine";
        const f = selectMelody[(bgmStep / 4) % selectMelody.length];
        osc.frequency.setValueAtTime(f, now);
        g.gain.setValueAtTime(0.03, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      }
    } else {
      let activeTrack = inGameBgmTrack === 0 ? inGameTrack1 : (inGameBgmTrack === 1 ? inGameTrack2 : inGameTrack3);
      if (bgmStep % 2 === 0) {
        const bOsc = audioCtx.createOscillator();
        const bG = audioCtx.createGain();
        bOsc.type = inGameBgmTrack === 1 ? "square" : "sawtooth";
        bOsc.frequency.setValueAtTime(activeTrack[0] / 2, now);
        bG.gain.setValueAtTime(0.045, now);
        bG.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        bOsc.connect(bG);
        bG.connect(audioCtx.destination);
        bOsc.start(now);
        bOsc.stop(now + 0.25);
      }
      const mOsc = audioCtx.createOscillator();
      const mG = audioCtx.createGain();
      mOsc.type = "sine";
      const mNote = activeTrack[(bgmStep * 3 + inGameBgmTrack) % activeTrack.length];
      mOsc.frequency.setValueAtTime(mNote, now);
      mG.gain.setValueAtTime(0.025, now);
      mG.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      mOsc.connect(mG);
      mG.connect(audioCtx.destination);
      mOsc.start(now);
      mOsc.stop(now + 0.16);
    }
    bgmStep = (bgmStep + 1) % 64;
  }, 125);
}

function drawMatrix(matrix, cx, cy, colorMap, psize=3) {
  const rows = matrix.length;
  const cols = matrix[0].length;
  const startX = Math.floor(cx - (cols * psize) / 2);
  const startY = Math.floor(cy - (rows * psize) / 2);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const v = matrix[r][c];
      if (v !== 0 && colorMap[v]) {
        ctx.fillStyle = colorMap[v];
        ctx.fillRect(startX + c * psize, startY + r * psize, psize, psize);
      }
    }
  }
}

// --- [엔티티 클래스] ---
class Star {
  constructor() {
    this.x = Math.random() * LOGICAL_WIDTH;
    this.y = Math.random() * LOGICAL_HEIGHT;
    this.speed = 0.6 + Math.random() * 1.6;
    this.size = this.speed < 1.3 ? 1 : 2;
    this.b = Math.floor(70 + Math.random() * 90);
  }
  update() {
    this.y += this.speed;
    if (this.y > LOGICAL_HEIGHT) { this.y = 0; this.x = Math.random() * LOGICAL_WIDTH; }
  }
  draw() {
    ctx.fillStyle = `rgb(${this.b}, ${this.b}, ${this.b + 50})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

class ExplosionFX {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color || "#ffe600";
    this.type = Math.floor(Math.random() * 5);
    this.life = 1.0;
    this.decay = 2.5 + Math.random() * 1.5;
    this.elements = [];

    if (this.type === 0) {
      for (let i = 0; i < 12; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 3 + Math.random() * 4;
        this.elements.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 3 + Math.random() * 3 });
      }
    } else if (this.type === 1) {
      this.elements.push({ r: 4, maxR: 32, width: 3 });
    } else if (this.type === 2) {
      const angles = [Math.PI/4, 3*Math.PI/4, 5*Math.PI/4, 7*Math.PI/4];
      angles.forEach(ang => {
        const spd = 4 + Math.random() * 3;
        this.elements.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 4 });
      });
    } else if (this.type === 3) {
      for (let i = 0; i < 16; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 5 + Math.random() * 5;
        this.elements.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 2 });
      }
    } else {
      for (let i = 0; i < 8; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 3;
        this.elements.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, s: 4 + Math.random() * 3 });
      }
    }
  }
  update(dt) {
    this.life -= this.decay * dt;
    if (this.type === 0 || this.type === 2 || this.type === 3) {
      this.elements.forEach(el => {
        el.x += el.vx * (dt * 60);
        el.y += el.vy * (dt * 60);
        el.r = Math.max(0, el.r - dt * 2);
      });
    } else if (this.type === 1) {
      this.elements[0].r += 65 * dt;
    } else if (this.type === 4) {
      this.elements.forEach(el => {
        el.x += el.vx * (dt * 60);
        el.y += el.vy * (dt * 60);
      });
    }
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, this.life));
    ctx.fillStyle = this.color;
    ctx.strokeStyle = this.color;

    if (this.type === 0 || this.type === 2 || this.type === 3) {
      this.elements.forEach(el => {
        if (el.r > 0) {
          ctx.beginPath();
          ctx.arc(el.x, el.y, el.r, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    } else if (this.type === 1) {
      const el = this.elements[0];
      ctx.lineWidth = el.width;
      ctx.beginPath();
      ctx.arc(this.x, this.y, el.r, 0, Math.PI * 2);
      ctx.stroke();
    } else if (this.type === 4) {
      this.elements.forEach(el => {
        ctx.fillRect(el.x - el.s / 2, el.y - el.s / 2, el.s, el.s);
      });
    }
    ctx.restore();
  }
}

// 6번 조건: 번개 볼트 이펙트 클래스
class LightningBolt {
  constructor(x, y, radius) {
    this.x = x;
    this.y = y;
    this.radius = radius;
    this.life = 0.45;
  }
  update(dt) {
    this.life -= dt;
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life / 0.45);
    ctx.strokeStyle = "#00f5ff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // 지그재그 번개선 4가닥
    for (let k = 0; k < 4; k++) {
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      let cx = this.x, cy = this.y;
      for (let s = 0; s < 4; s++) {
        cx += (Math.random() - 0.5) * this.radius * 0.7;
        cy += (Math.random() - 0.5) * this.radius * 0.7;
        ctx.lineTo(cx, cy);
      }
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.restore();
  }
}

class BossDropItem {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.radius = 16; this.speed = 2.2;
    this.spawnTime = performance.now() / 1000;
  }
  getType(curTime) {
    const elapsed = curTime - this.spawnTime;
    const idx = Math.floor(elapsed) % 3;
    return ["P", "S", "D"][idx];
  }
  update(dt) { this.y += this.speed * (dt * 60); }
  draw(curTime) {
    const type = this.getType(curTime);
    const pulse = Math.sin(curTime * 10) * 3;
    const r = this.radius + pulse;

    ctx.fillStyle = "rgba(255, 215, 0, 0.4)";
    ctx.beginPath();
    ctx.arc(this.x, this.y, r + 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = type === "P" ? "#ff0080" : (type === "S" ? "#00f5ff" : "#ffe600");
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 15px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(type, this.x, this.y);
  }
}

class Bullet {
  constructor(x, y, vx, vy, dmg, radius=4, color="#ffe600", splash=false) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.dmg = dmg; this.radius = radius; this.color = color;
    this.splash = splash;
  }
  update(dt) { this.x += this.vx * (dt * 60); this.y += this.vy * (dt * 60); }
  draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

    this.hp = maxHp;
    this.speed = baseSpeed * (0.75 + Math.random() * 0.7);
    this.patternType = ["STRAIGHT", "SINE", "SMOOTH_CURVE", "DIVE", "ZIGZAG"][Math.floor(Math.random() * 5)];
    this.sinePhase = Math.random() * Math.PI * 2;
    this.sineAmp = 55 + Math.random() * 65;
    this.sineFreq = 2.5 + Math.random() * 2.3;
    this.curveVx = (Math.random() < 0.5 ? -1 : 1) * (2.2 + Math.random() * 2.0);
    this.curveTimer = 0.4 + Math.random() * 0.6;
    this.diveTriggered = false;
    this.designId = designId;
    this.radius = maxHp <= 8 ? 20 : (maxHp <= 18 ? 25 : 30);
    this.hasShield = Math.random() < 0.03;
    this.animOffset = Math.random() * 10;
  }
  update(dt, elapsed, speedScale=1.0, widthScale=1.0) {
    const effSpeed = this.speed * speedScale;
    const step = dt * 60 * speedScale;

    this.x += this.vx * (dt * 60);
    this.vx *= 0.92;

    if (this.patternType === "DIVE") {
      if (!this.diveTriggered && this.y > 180) { this.diveTriggered = true; this.speed *= 1.8; }
      this.y += effSpeed * (dt * 60);
      this.x += Math.sin(elapsed * 5.0) * (1.5 * step * widthScale);
    } else if (this.patternType === "ZIGZAG") {
      this.y += (effSpeed * 0.9) * (dt * 60);
      this.x += (this.curveVx * widthScale) * step;
      if (this.x <= this.radius + 5 || this.x >= LOGICAL_WIDTH - this.radius - 5) this.curveVx *= -1;
    } else if (this.patternType === "SINE") {
      this.y += effSpeed * (dt * 60);
      this.x = this.originX + Math.sin(elapsed * this.sineFreq + this.sinePhase) * (this.sineAmp * widthScale);
    } else if (this.patternType === "SMOOTH_CURVE") {
      this.y += effSpeed * (dt * 60);
      this.curveTimer -= dt;
      if (this.curveTimer <= 0) { this.curveVx = (Math.random() * 7) - 3.5; this.curveTimer = 0.5 + Math.random() * 0.7; }
      this.x += (this.curveVx * widthScale) * step;
    } else {
      this.y += (effSpeed * 1.15) * (dt * 60);
    }
    this.x = Math.max(this.radius, Math.min(LOGICAL_WIDTH - this.radius, this.x));
  }
  draw(curTime) {
    const matrix = PIXEL_ENEMIES[this.designId % PIXEL_ENEMIES.length];
    const morphPulse = Math.sin((curTime + this.animOffset) * 6.0) * 0.35;
    const basePsize = this.maxHp <= 12 ? 4 : 5;
    const dynamicPsize = basePsize + morphPulse;

    const cmap = { 1: "#ff3c64", 2: "#00f5ff", 3: "#ffe600" };
    drawMatrix(matrix, this.x, this.y, cmap, dynamicPsize);

    if (this.hasShield) {
      const pulse = Math.sin(curTime * 12.0) * 3;
      ctx.strokeStyle = "#00f5ff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 8 + pulse, 0, Math.PI * 2);
      ctx.stroke();
    }

    const barW = Math.floor(this.radius * 1.4);
    const hpW = Math.floor(barW * Math.max(0, this.hp / this.maxHp));
    ctx.fillStyle = "#505064";
    ctx.fillRect(this.x - barW / 2, this.y - this.radius - 8, barW, 3);
    ctx.fillStyle = "#32ff78";
    ctx.fillRect(this.x - barW / 2, this.y - this.radius - 8, hpW, 3);
  }
}

class BossEnemy {
  constructor() {
    this.x = LOGICAL_WIDTH / 2;
    this.y = -80;
    this.targetY = 110;
    this.maxHp = 20;
    this.hp = 20;
    this.radius = 48;
    this.isFullyEntered = false;
    this.vx = 2.0;
    this.lastFireTime = 0.0;
  }
  update(dt, curTime, missiles) {
    if (!this.isFullyEntered) {
      this.y += 1.8 * (dt * 60);
      if (this.y >= this.targetY) { this.y = this.targetY; this.isFullyEntered = true; this.lastFireTime = curTime; }
    } else {
      this.x += this.vx * (dt * 60);
      if (this.x <= this.radius + 15 || this.x >= LOGICAL_WIDTH - this.radius - 15) this.vx *= -1;
      if (curTime - this.lastFireTime >= 3.0) {
        this.lastFireTime = curTime;
        missiles.push(new Bullet(this.x, this.y + 40, 0, 5.5, 1, 6, "#ff2d2d"));
        playTone(300, 0.15, "sawtooth", -150);
      }
    }
  }
  draw() {
    const cmap = { 1: "#b4143c", 2: "#ff3264", 3: "#ffe600", 4: "#ffffff" };
    drawMatrix(PIXEL_BOSS, this.x, this.y, cmap, 6);
    const barW = 160;
    const hpW = Math.floor(barW * Math.max(0, this.hp / this.maxHp));
    ctx.fillStyle = "#505064";
    ctx.fillRect(this.x - barW / 2, this.y - this.radius - 16, barW, 6);
    ctx.fillStyle = "#ff2d2d";
    ctx.fillRect(this.x - barW / 2, this.y - this.radius - 16, hpW, 6);
    ctx.fillStyle = "#ff2d2d";
    ctx.font = "11px monospace";
    ctx.textAlign = "center";
    ctx.fillText(`BOSS HP: ${this.hp}/20`, this.x, this.y - this.radius - 20);
  }
}

class Player {
  constructor(pType, name, speedStat, powerStat, fireRateStat) {
    this.pType = pType; this.name = name;
    this.speedStat = speedStat; this.powerStat = powerStat; this.fireRateStat = fireRateStat;
    this.clonePlaneTimer = 0.0; this.laserWeaponTimer = 0.0;
    this.lastLaserTime = 0.0;
    this.laserMuzzleFlashTime = 0.0;
    this.shotCount = 0;
    this.x = LOGICAL_WIDTH / 2; this.y = LOGICAL_HEIGHT * 0.8;
    this.targetX = this.x; this.targetY = this.y;
    this.radius = 22; this.shieldRemain = 0.0; this.lastShot = 0.0;
    this.isAlive = true;

    // 6번 조건: 스피드형 8/16렙 30초 주기 보호막 관리
    this.speedShieldCycleTimer = 0.0;

    // 6번 조건: 발사속도형 8/16렙 3초 주기 번개 관리
    this.lightningTimer = 0.0;
  }
  getRealSpeed() {
    if (this.name === "Speed") return CONFIG.BASE_PLAYER_SPEED + (this.speedStat * CONFIG.STAT_SPEED_FACTOR * 1.2);
    if (this.name === "Power") return (CONFIG.BASE_PLAYER_SPEED * 0.7) + (this.speedStat * CONFIG.STAT_SPEED_FACTOR * 0.7);
    return CONFIG.BASE_PLAYER_SPEED + (this.speedStat * CONFIG.STAT_SPEED_FACTOR);
  }
  getFireInterval() {
    const reduction = 1.0 / (1.0 + (this.fireRateStat - 1) * CONFIG.FIRE_RATE_REDUCTION);
    let base = CONFIG.BASE_FIRE_INTERVAL;
    if (this.name === "Speed" || this.name === "Power") base *= 1.30;
    if (this.name === "Legend") base *= 1.625;
    return Math.max(0.03, base * reduction);
  }
  update(dt, enemiesList, lightningList) {
    if (!this.isAlive) return;
    if (this.clonePlaneTimer > 0) this.clonePlaneTimer = Math.max(0, this.clonePlaneTimer - dt);
    if (this.laserWeaponTimer > 0) this.laserWeaponTimer = Math.max(0, this.laserWeaponTimer - dt);
    if (this.shieldRemain > 0) this.shieldRemain = Math.max(0, this.shieldRemain - dt);

    // 6번 조건: 스피드형 8렙(10초 보호막) / 16렙(20초 보호막) 30초 주기
    if (this.name === "Speed" && this.speedStat >= 8) {
      this.speedShieldCycleTimer += dt;
      if (this.speedShieldCycleTimer >= 30.0) {
        this.speedShieldCycleTimer = 0;
        const shDur = (this.speedStat >= 16) ? 20.0 : 10.0;
        this.shieldRemain = Math.max(this.shieldRemain, shDur);
        playTone(600, 0.25, "triangle", 200, 0.3);
      }
    }

    // 6번 조건: 발사속도형 8렙(3배 크기) / 16렙(5배 크기) 3초 주기 전방 번개 폭풍
    if (this.pType === 2 && this.fireRateStat >= 8) {
      this.lightningTimer += dt;
      if (this.lightningTimer >= 3.0) {
        this.lightningTimer = 0;
        const mult = (this.fireRateStat >= 16) ? 5.0 : 3.0;
        const lRadius = this.radius * mult;
        const lx = this.x + (Math.random() - 0.5) * 160;
        const ly = this.y - 140 - Math.random() * 120;

        lightningList.push(new LightningBolt(lx, ly, lRadius));
        playTone(850, 0.18, "sawtooth", -400, 0.25);

        // 번개 범위 내 적 즉각 파괴
        for (let ei = enemiesList.length - 1; ei >= 0; ei--) {
          const e = enemiesList[ei];
          if (Math.hypot(e.x - lx, e.y - ly) <= lRadius + e.radius) {
            e.hp = 0;
            enemiesList.splice(ei, 1);
            score++;
            skillGauge += CONFIG.BASE_GAUGE_PER_KILL;
            explosions.push(new ExplosionFX(e.x, e.y, "#00f5ff"));
          }
        }
      }
    }

    if (isNaN(this.targetX)) this.targetX = this.x;
    if (isNaN(this.targetY)) this.targetY = this.y;

    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.hypot(dx, dy);
    const maxStep = this.getRealSpeed() * 60 * dt;
    if (dist > 0.5) {
      if (dist <= maxStep) { this.x = this.targetX; this.y = this.targetY; }
      else { this.x += (dx / dist) * maxStep; this.y += (dy / dist) * maxStep; }
    }
    const maxLimitX = LOGICAL_WIDTH - this.radius - (this.clonePlaneTimer > 0 ? 46 : 10);
    this.x = Math.max(this.radius + 10, Math.min(maxLimitX, this.x));
    this.y = Math.max(this.radius + 10, Math.min(LOGICAL_HEIGHT - this.radius - 10, this.y));
  }
  _fire(px, py, dmg, isTriggerShot, bullets) {
    if (this.name === "Legend") {
      bullets.push(new Bullet(px, py - 22, 0, -17, dmg, 4, "#ffd700"));
      const rad = 3.43 * (Math.PI / 180);
      bullets.push(new Bullet(px, py - 22, -Math.sin(rad) * 17, -Math.cos(rad) * 17, dmg, 4, "#ffd700"));
      bullets.push(new Bullet(px, py - 22, Math.sin(rad) * 17, -Math.cos(rad) * 17, dmg, 4, "#ffd700"));
      playTone(900, 0.08, "triangle", -400);
    } else if (this.name === "Speed") {
      bullets.push(new Bullet(px, py - 22, 0, -17, dmg));
      if (isTriggerShot) {
        const mult = Math.floor(this.powerStat / 3);
        for (let i = 0; i <= mult; i++) {
          const rad = (10 + i * 2.5) * (Math.PI / 180);
          bullets.push(new Bullet(px, py - 22, -Math.sin(rad) * 17, -Math.cos(rad) * 17, dmg));
          bullets.push(new Bullet(px, py - 22, Math.sin(rad) * 17, -Math.cos(rad) * 17, dmg));
        }
      }
      playTone(850, 0.07, "square", -350);
    } else if (this.pType === 2) {
      let count = 2;
      const spacing = 28 / (count - 1);
      const startX = px - 14;
      for (let i = 0; i < count; i++) {
        bullets.push(new Bullet(startX + i * spacing, py - 20, 0, -15, dmg));
      }
      playTone(600, 0.05, "sine", -250);
    } else if (this.pType === 1) {
      // 6번 조건: 파워형 8렙(양쪽 50% 파워/크기 미사일) / 16렙(양쪽 100% 본체 동일 파워 미사일)
      const isSplash = (this.powerStat % 3 === 0) && isTriggerShot;
      bullets.push(new Bullet(px, py - 24, 0, -14, dmg * 1.5, isSplash ? 9 : 7, isSplash ? "#ff2d2d" : "#ff8c00", isSplash));

      if (this.powerStat >= 8) {
        const isFullPower = (this.powerStat >= 16);
        const subDmg = isFullPower ? dmg : (dmg * 0.5);
        const subRadius = isFullPower ? 6 : 3.5;
        bullets.push(new Bullet(px - 22, py - 14, -1.0, -13, subDmg, subRadius, "#ff3c5a"));
        bullets.push(new Bullet(px + 22, py - 14, 1.0, -13, subDmg, subRadius, "#ff3c5a"));
      }
      playTone(380, 0.12, "sawtooth", -150);
    } else {
      bullets.push(new Bullet(px, py - 22, 0, -17, dmg));
      playTone(700, 0.07, "square", -300);
    }
  }
  shoot(curTime, bullets) {
    if (!this.isAlive) return;
    if (curTime - this.lastShot >= this.getFireInterval()) {
      this.lastShot = curTime;
      this.shotCount++;
      const isTrigger = (this.name === "Speed") ? (this.shotCount % 4 === 0) : (this.shotCount % 5 === 0);
      const dmg = Math.max(1, this.powerStat);
      this._fire(this.x, this.y, dmg, isTrigger, bullets);
      if (this.clonePlaneTimer > 0) this._fire(this.x + 42, this.y, dmg, isTrigger, bullets);
    }
  }
  draw(curTime) {
    if (!this.isAlive) return;
    if (this.name === "Legend") {
      const auraR = this.radius + 10 + Math.sin(curTime * 8) * 4;
      ctx.fillStyle = "rgba(255, 215, 0, 0.3)";
      ctx.beginPath();
      ctx.arc(this.x, this.y, auraR, 0, Math.PI * 2);
      ctx.fill();
    }
    const drawShipAt = (cx, cy) => {
      let cmap = { 1: "#00f5ff", 2: "#ffffff", 3: "#0096ff", 4: "#ffe600" };
      if (this.name === "Legend") cmap = { 1: "#ffd700", 2: "#ffffff", 3: "#ff8c00", 4: "#ffe600" };
      else if (this.pType === 1) cmap = { 1: "#ff3c5a", 2: "#ffe600", 3: "#ffffff", 4: "#ff8c00" };
      else if (this.pType === 2) cmap = { 1: "#64aaff", 2: "#ffffff", 3: "#00f5ff", 4: "#ffe600" };
      drawMatrix(PIXEL_PLAYERS[this.pType], cx, cy, cmap, 4);

      if (this.laserWeaponTimer > 0) {
        ctx.fillStyle = "#00f5ff";
        ctx.fillRect(cx - 28, cy - 8, 4, 18);
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.moveTo(cx - 26, cy - 13);
        ctx.lineTo(cx - 29, cy - 8);
        ctx.lineTo(cx - 23, cy - 8);
        ctx.fill();

        const flashElapsed = curTime - this.laserMuzzleFlashTime;
        if (flashElapsed < 0.15) {
          const sparkR = 4 + Math.random() * 3;
          ctx.fillStyle = Math.floor(flashElapsed * 40) % 2 === 0 ? "#ffffff" : "#00f5ff";
          ctx.beginPath();
          ctx.arc(cx - 26, cy - 13, sparkR, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    };

    drawShipAt(this.x, this.y);
    if (this.clonePlaneTimer > 0) drawShipAt(this.x + 42, this.y);

    // 보호막 렌더링
    if (this.shieldRemain > 0) {
      const shieldPulse = Math.sin(curTime * 14.0) * 2.5;
      const shR = this.radius + 32 + shieldPulse;
      ctx.strokeStyle = "rgba(50, 255, 120, 0.85)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(this.x, this.y, shR, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = "rgba(50, 255, 120, 0.12)";
      ctx.beginPath();
      ctx.arc(this.x, this.y, shR, 0, Math.PI * 2);
      ctx.fill();

      if (this.clonePlaneTimer > 0) {
        ctx.beginPath();
        ctx.arc(this.x + 42, this.y, shR, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // 1번 & 6번 조건: 보호막 잔여시간 소숫점 한자리 표기
    let timerLines = [];
    if (this.laserWeaponTimer > 0) timerLines.push(`LASER ${Math.round(this.laserWeaponTimer)}s`);
    if (this.clonePlaneTimer > 0) timerLines.push(`CLONE ${Math.round(this.clonePlaneTimer)}s`);
    if (this.shieldRemain > 0) timerLines.push(`SHIELD ${this.shieldRemain.toFixed(1)}s`);

    if (timerLines.length > 0) {
      ctx.fillStyle = "#00f5ff";
      ctx.font = "bold 11px monospace";
      ctx.textAlign = "center";
      ctx.fillText(timerLines.join(" | "), this.x, this.y + this.radius + 24);
    }
  }
}

function applyChosenSkill(code, customDuration=null) {
  if (code === "POWER_UP") player.powerStat++;
  else if (code === "SPEED_UP") player.speedStat += (player.name === "Power" ? 0.7 : 1.0);
  else if (code === "FIRE_RATE") player.fireRateStat++;
  else if (code === "CLONE_SHIP") player.clonePlaneTimer = CONFIG.CLONE_SHIP_DURATION;
  else if (code === "LASER_WEAPON") {
    player.laserWeaponTimer = customDuration || 30.5;
    player.lastLaserTime = performance.now() / 1000;
  }
  else if (code === "SHIELD") {
    player.shieldRemain = customDuration || 30.0;
  }
}

function isEligibleForTop10(currScore) {
  if (top10List.length < 10) return true;
  return currScore > top10List[top10List.length - 1].score;
}

function getCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) return { x: LOGICAL_WIDTH / 2, y: LOGICAL_HEIGHT / 2 };
  const scaleX = LOGICAL_WIDTH / rect.width;
  const scaleY = LOGICAL_HEIGHT / rect.height;
  const x = Math.max(0, Math.min(LOGICAL_WIDTH, (clientX - rect.left) * scaleX));
  const y = Math.max(0, Math.min(LOGICAL_HEIGHT, (clientY - rect.top) * scaleY));
  return { x, y };
}

function handlePointerMove(clientX, clientY) {
  if (!isTouchActive || gameState !== 1 || !player) return;
  const coords = getCanvasCoords(clientX, clientY);
  player.targetX = coords.x;
  player.targetY = Math.max(player.radius + 10, Math.min(LOGICAL_HEIGHT - player.radius - 10, coords.y - 120));
}

function handlePointerDown(clientX, clientY) {
  initAudio();
  isTouchActive = true;
  const coords = getCanvasCoords(clientX, clientY);

  if (gameState === 0) {
    if (coords.y >= 165 && coords.y <= 240) startBattle(0);
    else if (coords.y >= 250 && coords.y <= 325) startBattle(1);
    else if (coords.y >= 335 && coords.y <= 410) startBattle(2);
    else if (coords.y >= 420 && coords.y <= 495) startBattle(3);
  } else if (gameState === 1 && player) {
    player.targetX = coords.x;
    player.targetY = Math.max(player.radius + 10, Math.min(LOGICAL_HEIGHT - player.radius - 10, coords.y - 120));
  } else if (gameState === 2 && !randomPickShowcaseActive) {
    const cards = [
      { code: "POWER_UP", x: 35, y: 110, w: 175, h: 90 },
      { code: "SPEED_UP", x: 240, y: 110, w: 175, h: 90 },
      { code: "FIRE_RATE", x: 35, y: 220, w: 175, h: 90 },
      { code: "CLONE_SHIP", x: 240, y: 220, w: 175, h: 90 },
      { code: "LASER_WEAPON", x: 35, y: 330, w: 175, h: 90 },
      { code: "SHIELD", x: 240, y: 330, w: 175, h: 90 }
    ];

    let clickedSkill = false;
    for (let c of cards) {
      if (coords.x >= c.x && coords.x <= c.x + c.w && coords.y >= c.y && coords.y <= c.y + c.h) {
        clickedSkill = true;
        if (c.code === "LASER_WEAPON" || c.code === "SHIELD") {
          minigameTargetOption = c.code;
          minigameSelectedTime = null;
          gameState = 5;
          playTone(600, 0.1, "sine");
        } else {
          applyChosenSkill(c.code);
          playSlotSelectedSound();
          gameState = 1;
        }
        break;
      }
    }

    // 3번 조건: 아래로 더 내린 랜덤 뽑기 버튼 (y: 470) 클릭 판정
    const btnMult = { x: 35, y: 470, w: 380, h: 95 };
    if (!clickedSkill && coords.x >= btnMult.x && coords.x <= btnMult.x + btnMult.w && coords.y >= btnMult.y && coords.y <= btnMult.y + btnMult.h) {
      const picked = shuffledMultiplierPool[currentMultIndex];
      // 4번 조건: 2초간 화면 중앙에 노출 및 실지 스킬 가산
      if (picked.type === "PWR") player.powerStat += picked.val;
      else if (picked.type === "SPD") player.speedStat += (player.name === "Power" ? picked.val * 0.7 : picked.val);
      else if (picked.type === "RATE") player.fireRateStat += picked.val;

      randomPickResult = picked;
      randomPickShowcaseActive = true;
      randomPickShowcaseStartTime = performance.now() / 1000;
      playSlotSelectedSound();
    }
  } else if (gameState === 5 && minigameSelectedTime === null) {
    minigameSelectedTime = minigameRollingTime;
    minigameFinishTimestamp = performance.now() / 1000;
    playSlotSelectedSound();
  } else if (gameState === 3) {
    const btnRect = { x: LOGICAL_WIDTH / 2 - 90, y: LOGICAL_HEIGHT * 0.3 + 125, w: 180, h: 42 };
    if (coords.x >= btnRect.x && coords.x <= btnRect.x + btnRect.w && coords.y >= btnRect.y && coords.y <= btnRect.y + btnRect.h) {
      const name = nameInput.value.trim() || "No Name";
      uploadScore(name, score);
      nameInputOverlay.style.display = "none";
      currentBgmMode = "select";
      gameState = 0;
    }
  }
}

function handlePointerUp() {
  isTouchActive = false;
  if (player) {
    player.targetX = player.x;
    player.targetY = player.y;
  }
}

window.addEventListener("keydown", e => {
  initAudio();
  keysPressed[e.key.toLowerCase()] = true;
  keysPressed[e.code] = true;
});
window.addEventListener("keyup", e => {
  keysPressed[e.key.toLowerCase()] = false;
  keysPressed[e.code] = false;
});

window.addEventListener("mousemove", e => { if (e.buttons === 1) handlePointerMove(e.clientX, e.clientY); });
window.addEventListener("mousedown", e => handlePointerDown(e.clientX, e.clientY));
window.addEventListener("mouseup", handlePointerUp);

canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  if (e.touches.length > 0) handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  if (e.touches.length > 0) handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener("touchend", e => {
  e.preventDefault();
  handlePointerUp();
}, { passive: false });

canvas.addEventListener("touchcancel", e => {
  e.preventDefault();
  handlePointerUp();
}, { passive: false });

// --- [메인 렌더링 루프] ---
let lastTime = performance.now();

function safeGameLoop(now) {
  try {
    const curTime = now / 1000;
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    // 2) 해상도 고선명 버퍼 스케일링 일괄 적용
    ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);

    stars.forEach(s => s.update());
    explosions.forEach(ex => ex.update(dt));
    explosions = explosions.filter(ex => ex.life > 0);
    lightningBolts.forEach(l => l.update(dt));
    lightningBolts = lightningBolts.filter(l => l.life > 0);

    // 1. SELECT STATE
    if (gameState === 0) {
      ctx.fillStyle = "#080814";
      ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      stars.forEach(s => s.draw());

      ctx.fillStyle = "#00f5ff";
      ctx.font = "bold 29px Arial";
      ctx.textAlign = "center";
      ctx.fillText("NEON FLIGHT: OVERDRIVE", LOGICAL_WIDTH / 2, 60);

      ctx.fillStyle = "#ffffff";
      ctx.font = "13px Arial";
      ctx.fillText("CHOOSE YOUR FIGHTER", LOGICAL_WIDTH / 2, 95);

      if (curTime - lastRandomSwitch >= 0.5) {
        lastRandomSwitch = curTime;
        randomCardDesign = Math.floor(Math.random() * 4);
      }
      if (curTime - lastRollTime >= 0.175) {
        lastRollTime = curTime;
        const bStats = generateBalancedStats();
        rollP = bStats.p;
        rollS = bStats.s;
        rollR = bStats.r;
      }

      const cards = [
        { name: "SPEED", p: 1, s: 5, r: 1, bg: "#193c5f", bdr: "#00f5ff", y: 165, img: 0, sub: "SPECIAL SKILLS AT LV.8 & 16" },
        { name: "POWER", p: 5, s: 1, r: 1, bg: "#5f1e2d", bdr: "#ff3c5a", y: 250, img: 1, sub: "SPECIAL SKILLS AT LV.8 & 16" },
        { name: "TWIN", p: 1, s: 1, r: 5, bg: "#28325f", bdr: "#78a0ff", y: 335, img: 2, sub: "SPECIAL SKILLS AT LV.8 & 16" },
        { name: "RANDOM", p: rollP, s: rollS, r: rollR, bg: "#461e5f", bdr: "#c832ff", y: 420, img: randomCardDesign, sub: "10% CHANCE OF LEGEND SHIP" }
      ];

      cards.forEach(c => {
        ctx.fillStyle = c.bg;
        drawRoundRect(ctx, 35, c.y, LOGICAL_WIDTH - 70, 75, 10);
        ctx.fill();
        ctx.strokeStyle = c.bdr;
        ctx.lineWidth = 2;
        ctx.stroke();

        drawMatrix(PIXEL_PLAYERS[c.img], 75, c.y + 37, { 1: c.bdr, 2: "#fff", 3: "#ffe600", 4: "#ff8c00" }, 3);

        ctx.textAlign = "left";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 15px Arial";
        ctx.fillText(c.name, 115, c.y + 19);

        ctx.font = "bold 9px Arial";
        ctx.fillStyle = "#00f5ff";
        ctx.fillText(c.sub, 115, c.y + 34);

        const maxVal = Math.max(c.p, c.s, c.r);
        const isMaxP = (c.p === maxVal);
        const isMaxS = (c.s === maxVal && !isMaxP);
        const isMaxR = (c.r === maxVal && !isMaxP && !isMaxS);

        let xOffset = 115;
        const renderStat = (label, val, isHigh) => {
          ctx.font = isHigh ? "bold 13px Arial" : "11px Arial";
          ctx.fillStyle = isHigh ? "#ffe600" : "#a0b0c8";
          const txtStr = `${label} ${val}`;
          ctx.fillText(txtStr, xOffset, c.y + 58);
          xOffset += ctx.measureText(txtStr).width + 8;

          ctx.font = "11px Arial";
          ctx.fillStyle = "#647082";
          ctx.fillText("|", xOffset, c.y + 58);
          xOffset += 10;
        };

        renderStat("PWR", c.p, isMaxP);
        renderStat("SPD", c.s, isMaxS);
        ctx.font = isMaxR ? "bold 13px Arial" : "11px Arial";
        ctx.fillStyle = isMaxR ? "#ffe600" : "#a0b0c8";
        ctx.fillText(`RATE ${c.r}`, xOffset, c.y + 58);
      });

      const t5Y = 515;
      ctx.fillStyle = "rgba(10, 15, 30, 0.65)";
      drawRoundRect(ctx, 35, t5Y, LOGICAL_WIDTH - 70, 120, 8);
      ctx.fill();
      ctx.strokeStyle = "rgba(0, 245, 255, 0.4)";
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = "#00f5ff";
      ctx.font = "bold 11px monospace";
      ctx.textAlign = "center";
      ctx.fillText("★ GLOBAL TOP 5 PLAYERS ★", LOGICAL_WIDTH / 2, t5Y + 18);

      const top5 = top10List.slice(0, 5);
      ctx.font = "11px monospace";
      if (top5.length === 0) {
        ctx.fillStyle = "#a0b0c8";
        ctx.fillText("WAITING FOR RECORDS...", LOGICAL_WIDTH / 2, t5Y + 65);
      } else {
        top5.forEach((item, idx) => {
          const rowY = t5Y + 36 + idx * 16;
          ctx.textAlign = "left";
          ctx.fillStyle = idx === 0 ? "#ffe600" : (idx < 3 ? "#00f5ff" : "#fff");
          ctx.fillText(`${idx + 1}. [${item.country || 'GL'}] ${item.name}`, 50, rowY);
          ctx.textAlign = "right";
          ctx.fillText(`${item.score} PTS`, LOGICAL_WIDTH - 50, rowY);
        });
      }

      ctx.textAlign = "left";
      ctx.fillStyle = "#46465a";
      ctx.font = "11px monospace";
      ctx.fillText(VERSION_STR, 10, LOGICAL_HEIGHT - 12);

    // 1-1. LEGEND SHOWCASE STATE
    } else if (gameState === 4) {
      ctx.fillStyle = "#080814";
      ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      stars.forEach(s => s.draw());

      const elapsedShowcase = curTime - legendShowcaseStartTime;
      const remainSec = Math.max(0, (3.0 - elapsedShowcase).toFixed(1));

      const cx = LOGICAL_WIDTH / 2;
      const cy = LOGICAL_HEIGHT / 2 - 40;
      const pulse = Math.sin(curTime * 8) * 10;
      ctx.fillStyle = "rgba(255, 215, 0, 0.25)";
      ctx.beginPath();
      ctx.arc(cx, cy, 75 + pulse, 0, Math.PI * 2);
      ctx.fill();

      drawMatrix(PIXEL_PLAYERS[4], cx, cy, { 1: "#ffd700", 2: "#ffffff", 3: "#ff8c00", 4: "#ffe600" }, 7);

      ctx.textAlign = "center";
      ctx.fillStyle = "#ffd700";
      ctx.font = "bold 20px Arial";
      ctx.fillText("CONGRATULATIONS!", cx, cy + 100);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 16px Arial";
      ctx.fillText("LEGEND SHIP UNLOCKED!", cx, cy + 130);

      ctx.fillStyle = "#00f5ff";
      ctx.font = "14px monospace";
      ctx.fillText(`GAME STARTS IN ${remainSec}s`, cx, cy + 170);

      if (elapsedShowcase >= 3.0) initBattleState();

    // 2. BATTLE STATE
    } else if (gameState === 1) {
      const elapsed = curTime - startTime;
      if (gaugeBoostTimer > 0) gaugeBoostTimer = Math.max(0, gaugeBoostTimer - dt);

      if (player && player.isAlive) {
        let kx = 0, ky = 0;
        if (keysPressed["arrowleft"] || keysPressed["a"] || keysPressed["keya"]) kx -= 1;
        if (keysPressed["arrowright"] || keysPressed["d"] || keysPressed["keyd"]) kx += 1;
        if (keysPressed["arrowup"] || keysPressed["w"] || keysPressed["keyw"]) ky -= 1;
        if (keysPressed["arrowdown"] || keysPressed["s"] || keysPressed["keys"]) ky += 1;

        if (kx !== 0 || ky !== 0) {
          const moveDist = player.getRealSpeed() * 60 * dt;
          player.targetX = Math.max(player.radius + 10, Math.min(LOGICAL_WIDTH - player.radius - 10, player.targetX + kx * moveDist));
          player.targetY = Math.max(player.radius + 10, Math.min(LOGICAL_HEIGHT - player.radius - 10, player.targetY + ky * moveDist));
        }
      }

      // 6번 조건 번개 엔진 연동
      player.update(dt, enemies, lightningBolts);
      player.shoot(curTime, bullets);

      let speedScale = 1.0;
      let widthScale = 1.0;
      if (elapsed < 60.0) {
        speedScale = 0.5;
        widthScale = 0.5;
      } else {
        const recoveredRatio = Math.min(1.0, 0.5 + ((elapsed - 60.0) / 30.0) * 0.2);
        speedScale = recoveredRatio;
        widthScale = recoveredRatio;
      }

      const hpScale = (elapsed < 60.0) ? 0.7 : 1.0;
      const earlyGaugeMultiplier = (elapsed < 60.0) ? 1.5 : 1.0;

      const steps30s = Math.floor(elapsed / 30);
      const baseGaugePerKill = Math.max(CONFIG.MIN_GAUGE_PER_KILL, CONFIG.BASE_GAUGE_PER_KILL * Math.pow(0.92, steps30s));
      const gaugePerKill = baseGaugePerKill * (gaugeBoostTimer > 0 ? 2 : 1) * earlyGaugeMultiplier;

      const timeFactor = Math.min(1.0, elapsed / 180.0);

      // 5번 조건: 초반 60초 동안 나타나는 적 비행기 수 50% 감소 (스폰 간격 2배 확대)
      const baseSpawnInterval = Math.max(CONFIG.MIN_SPAWN_INTERVAL, (CONFIG.MAX_SPAWN_INTERVAL - timeFactor * 0.16) * Math.pow(1 / 1.10, steps30s));
      const spawnInterval = (elapsed < 60.0) ? (baseSpawnInterval * 2.0) : baseSpawnInterval;

      if (curTime - lastSpawnTime > spawnInterval) {
        lastSpawnTime = curTime;
        const calculatedHp = Math.max(1, Math.round((2 + Math.random() * 3) * hpScale));
        enemies.push(new Enemy(calculatedHp, CONFIG.BASE_ENEMY_SPEED + timeFactor * 3.5, Math.floor(Math.random() * PIXEL_ENEMIES.length)));
      }

      if (!currentBoss && elapsed >= nextBossTargetTime) {
        currentBoss = new BossEnemy();
        nextBossTargetTime += 90.0;
      }
      if (currentBoss) currentBoss.update(dt, curTime, bossMissiles);

      // 보호막 리펄서 역장 물리
      if (player.isAlive && player.shieldRemain > 0) {
        const shieldFieldRadius = player.radius + 36;
        bossMissiles.forEach(m => {
          const mdx = m.x - player.x;
          const mdy = m.y - player.y;
          const mDist = Math.hypot(mdx, mdy);
          if (mDist < shieldFieldRadius + m.radius && mDist > 0) {
            const pushDir = mdx >= 0 ? 1 : -1;
            m.vx = (pushDir * 3.8);
            m.vy = Math.max(1.0, m.vy * 0.7);
          }
        });

        enemies.forEach(e => {
          const edx = e.x - player.x;
          const edy = e.y - player.y;
          const eDist = Math.hypot(edx, edy);
          if (eDist < shieldFieldRadius + e.radius && eDist > 0) {
            const pushDir = edx >= 0 ? 1 : -1;
            e.vx += pushDir * 2.8;
          }
        });
      }

      for (let i = bossDropItems.length - 1; i >= 0; i--) {
        const it = bossDropItems[i];
        it.update(dt);
        if (it.y > LOGICAL_HEIGHT + 30) {
          bossDropItems.splice(i, 1);
          continue;
        }
        if (player.isAlive && Math.hypot(player.x - it.x, player.y - it.y) < player.radius + it.radius) {
          const itemType = it.getType(curTime);
          if (itemType === "P") player.powerStat++;
          else if (itemType === "S") player.speedStat++;
          else if (itemType === "D") player.fireRateStat++;

          bossDropItems.splice(i, 1);
          playTone(784, 0.2, "triangle", 150);
        }
      }

      if (player.isAlive && player.laserWeaponTimer > 0 && curTime - player.lastLaserTime >= CONFIG.LASER_WEAPON_INTERVAL) {
        player.lastLaserTime = curTime;
        player.laserMuzzleFlashTime = curTime;
        
        const firePoints = [{ x: player.x - 26, y: player.y - 12 }];
        if (player.clonePlaneTimer > 0) firePoints.push({ x: player.x + 42 - 26, y: player.y - 12 });

        firePoints.forEach(fp => {
          const valid = enemies.filter(e => e.y > 0 && e.hp > 0);
          if (valid.length > 0) {
            valid.sort((a, b) => Math.hypot(a.x - fp.x, a.y - fp.y) - Math.hypot(b.x - fp.x, b.y - fp.y));
            const target = valid[0];
            activeLasers.push({ sx: fp.x, sy: fp.y, tx: target.x, ty: target.y, t: curTime });
            
            target.hp = 0;
            const eIndex = enemies.indexOf(target);
            if (eIndex !== -1) enemies.splice(eIndex, 1);

            score++;
            skillGauge += gaugePerKill;
            explosions.push(new ExplosionFX(target.x, target.y, "#00f5ff"));
            playExplosionSound();
          }
        });
      }
      activeLasers = activeLasers.filter(l => curTime - l.t < CONFIG.LASER_BEAM_LINGER_TIME);

      bullets.forEach(b => b.update(dt));
      bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < LOGICAL_WIDTH + 20);

      bossMissiles.forEach(m => m.update(dt));
      bossMissiles = bossMissiles.filter(m => m.y < LOGICAL_HEIGHT + 30);

      // 보스 미사일 충돌
      for (let i = bossMissiles.length - 1; i >= 0; i--) {
        const m = bossMissiles[i];
        if (player.isAlive && Math.hypot(player.x - m.x, player.y - m.y) < player.radius + m.radius) {
          bossMissiles.splice(i, 1);
          // 6번 조건: 보호막 활성 시 파괴되지 않고 보호
          if (player.shieldRemain <= 0) {
            player.isAlive = false;
            explosions.push(new ExplosionFX(player.x, player.y, "#ff0080"));
            playExplosionSound();
            handleGameOver();
            break;
          }
        }
      }

      // 적 기체 충돌
      for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        e.update(dt, elapsed, speedScale, widthScale);
        if (e.y > LOGICAL_HEIGHT + 40) { enemies.splice(ei, 1); continue; }

        for (let bi = bullets.length - 1; bi >= 0; bi--) {
          const b = bullets[bi];
          if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
            if (e.hasShield) {
              e.hasShield = false;
              bullets.splice(bi, 1);
              explosions.push(new ExplosionFX(e.x, e.y, "#00f5ff"));
              playTone(800, 0.05, "triangle");
              break;
            }
            e.hp -= b.dmg;
            bullets.splice(bi, 1);
            if (e.hp <= 0) {
              enemies.splice(ei, 1);
              score++;
              skillGauge += gaugePerKill;
              explosions.push(new ExplosionFX(e.x, e.y, "#ffe600"));
              playExplosionSound();
              break;
            }
          }
        }

        if (player.isAlive && Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
          // 6번 조건: 보호막 활성 시 내 비행기 파괴 방지
          if (player.shieldRemain > 0) {
            enemies.splice(ei, 1);
            explosions.push(new ExplosionFX(e.x, e.y, "#32ff78"));
            playExplosionSound();
          } else {
            player.isAlive = false;
            explosions.push(new ExplosionFX(player.x, player.y, "#ff0080"));
            playExplosionSound();
            handleGameOver();
            break;
          }
        }
      }

      if (currentBoss) {
        for (let bi = bullets.length - 1; bi >= 0; bi--) {
          const b = bullets[bi];
          if (Math.hypot(b.x - currentBoss.x, b.y - currentBoss.y) < b.radius + currentBoss.radius) {
            bullets.splice(bi, 1);
            currentBoss.hp--;
            if (currentBoss.hp <= 0) {
              score += 20;
              skillGauge += gaugePerKill * 3;
              bossDropItems.push(new BossDropItem(currentBoss.x, currentBoss.y));
              for (let k = 0; k < 4; k++) {
                explosions.push(new ExplosionFX(currentBoss.x + (Math.random()*40-20), currentBoss.y + (Math.random()*40-20), "#ff2d2d"));
              }
              currentBoss = null;
              playExplosionSound();
              break;
            }
          }
        }
      }

      if (skillGauge >= CONFIG.MAX_SKILL_GAUGE) {
        skillGauge = 0.0;
        triggerSlot();
      }

      ctx.fillStyle = "#080814";
      ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      stars.forEach(s => s.draw());

      ctx.fillStyle = "rgba(10, 15, 30, 0.25)";
      ctx.fillRect(10, 10, 155, 150);
      ctx.strokeStyle = "rgba(0, 245, 255, 0.2)";
      ctx.strokeRect(10, 10, 155, 150);
      ctx.fillStyle = "rgba(0, 245, 255, 0.7)";
      ctx.font = "10px monospace";
      ctx.textAlign = "left";
      ctx.fillText("== GLOBAL TOP 10 ==", 16, 24);
      top10List.forEach((item, idx) => {
        ctx.fillStyle = idx === 0 ? "rgba(255, 230, 0, 0.85)" : "rgba(255, 255, 255, 0.75)";
        ctx.fillText(`${idx+1}. [${item.country || 'GL'}] ${item.name} ${item.score}`, 14, 38 + idx * 12);
      });

      activeLasers.forEach(l => {
        ctx.strokeStyle = "#00f5ff";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(l.sx, l.sy);
        ctx.lineTo(l.tx, l.ty);
        ctx.stroke();
      });

      bullets.forEach(b => b.draw());
      bossMissiles.forEach(m => m.draw());
      bossDropItems.forEach(it => it.draw(curTime));
      enemies.forEach(e => e.draw(curTime));
      lightningBolts.forEach(l => l.draw());
      if (currentBoss) currentBoss.draw();
      explosions.forEach(ex => ex.draw());
      player.draw(curTime);

      ctx.textAlign = "right";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 15px Arial";
      ctx.fillText(`SCORE: ${score}`, LOGICAL_WIDTH - 20, 25);
      ctx.fillStyle = "#ffe600";
      ctx.font = "13px Arial";
      ctx.fillText(`TIME: ${Math.floor(elapsed)}s`, LOGICAL_WIDTH - 20, 45);

      const baseBottomY = LOGICAL_HEIGHT - 12;
      ctx.textAlign = "left";
      ctx.fillStyle = "#46465a";
      ctx.font = "11px monospace";
      ctx.fillText(VERSION_STR, 10, baseBottomY);

      ctx.font = "12px Arial";
      ctx.fillStyle = "#ff0080"; ctx.fillText(`POWER : Lv.${Math.round(player.powerStat)}`, 10, baseBottomY - 58);
      ctx.fillStyle = "#00f5ff"; ctx.fillText(`SPEED : Lv.${Math.round(player.speedStat)}`, 10, baseBottomY - 42);
      ctx.fillStyle = "#ffe600"; ctx.fillText(`RATE  : Lv.${Math.round(player.fireRateStat)}`, 10, baseBottomY - 26);
      ctx.fillStyle = player.shieldRemain > 0 ? "#32ff78" : "#808096";
      ctx.fillText(`SHIELD: ${player.shieldRemain > 0 ? player.shieldRemain.toFixed(1) + 's' : 'OFF'}`, 10, baseBottomY - 10);

      const gw = 130, gh = 16, gx = LOGICAL_WIDTH - gw - 20, gy = LOGICAL_HEIGHT - 35;
      const gPct = Math.min(1.0, skillGauge / CONFIG.MAX_SKILL_GAUGE);
      if (gPct >= 0.8) {
        ctx.fillStyle = "rgba(255, 230, 0, 0.3)";
        ctx.fillRect(gx - 4, gy - 4, gw + 8, gh + 8);
      }
      ctx.fillStyle = "#505064";
      ctx.fillRect(gx, gy, gw, gh);
      ctx.fillStyle = gaugeBoostTimer > 0 ? "#ffe600" : "#00f5ff";
      ctx.fillRect(gx, gy, gw * gPct, gh);

      ctx.textAlign = "left";
      ctx.fillStyle = gaugeBoostTimer > 0 ? "#ffe600" : "#00f5ff";
      ctx.font = "12px Arial";
      ctx.fillText(gaugeBoostTimer > 0 ? "SKILL GAUGE [2X]" : "SKILL GAUGE", gx, gy - 6);

    // 3. SLOT STATE (스킬 수동 선택 + 3) 아래로 내린 룰렛 버튼 & 별 10개)
    } else if (gameState === 2) {
      ctx.fillStyle = "#080814";
      ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      stars.forEach(s => s.draw());
      explosions.forEach(ex => ex.draw());

      ctx.textAlign = "center";
      ctx.fillStyle = "#00f5ff";
      ctx.font = "bold 22px Arial";
      ctx.fillText("CHOOSE YOUR UPGRADE", LOGICAL_WIDTH / 2, 45);

      ctx.fillStyle = "#ffe600";
      ctx.font = "13px Arial";
      ctx.fillText("SELECT AN OPTION OR CHANCE MULTIPLIER", LOGICAL_WIDTH / 2, 68);

      const cards = [
        { code: "POWER_UP", title: "POWER UP", desc: `Current Lv.${Math.round(player.powerStat)}`, col: "#ff0080", x: 35, y: 95, w: 175, h: 80 },
        { code: "SPEED_UP", title: "SPEED UP", desc: `Current Lv.${Math.round(player.speedStat)}`, col: "#00f5ff", x: 240, y: 95, w: 175, h: 80 },
        { code: "FIRE_RATE", title: "FIRE RATE", desc: `Current Lv.${Math.round(player.fireRateStat)}`, col: "#ffe600", x: 35, y: 195, w: 175, h: 80 },
        { code: "CLONE_SHIP", title: "CLONE SHIP", desc: "Clone (30s)", col: "#78a0ff", x: 240, y: 195, w: 175, h: 80 },
        { code: "LASER_WEAPON", title: "LASER GUN", desc: "Time Roulette", col: "#00f5ff", x: 35, y: 295, w: 175, h: 80 },
        { code: "SHIELD", title: "ENERGY SHIELD", desc: "Time Roulette", col: "#32ff78", x: 240, y: 295, w: 175, h: 80 }
      ];

      cards.forEach(c => {
        ctx.fillStyle = "rgba(20, 25, 45, 0.85)";
        drawRoundRect(ctx, c.x, c.y, c.w, c.h, 10);
        ctx.fill();
        ctx.strokeStyle = c.col;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px Arial";
        ctx.fillText(c.title, c.x + c.w / 2, c.y + 35);

        ctx.fillStyle = c.col;
        ctx.font = "12px Arial";
        ctx.fillText(c.desc, c.x + c.w / 2, c.y + 60);
      });

      // 3) 아래로 내린 룰렛 박스 (y: 470)
      if (curTime - lastMultRollTime >= 0.20) {
        lastMultRollTime = curTime;
        currentMultIndex = (currentMultIndex + 1) % shuffledMultiplierPool.length;
      }
      const currentMultOption = shuffledMultiplierPool[currentMultIndex];

      const btnMult = { x: 35, y: 470, w: 380, h: 95 };
      ctx.fillStyle = "rgba(25, 30, 60, 0.95)";
      drawRoundRect(ctx, btnMult.x, btnMult.y, btnMult.w, btnMult.h, 12);
      ctx.fill();
      ctx.strokeStyle = "#ffd700";
      ctx.lineWidth = 3;
      ctx.stroke();

      // 3) 랜덤 뽑기 네모 외곽 10개 반짝이 별 렌더링
      STAR_OFFSETS.forEach((st, idx) => {
        const tw = Math.sin((curTime + st.delay) * 8.0) * 0.5 + 0.5;
        const starX = btnMult.x + st.x;
        const starY = btnMult.y + st.y;
        const currentSize = st.s * (0.6 + tw * 0.6);

        ctx.save();
        ctx.fillStyle = idx % 2 === 0 ? "#ffd700" : "#00f5ff";
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(starX, starY, currentSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      ctx.textAlign = "center";
      ctx.fillStyle = "#ffd700";
      ctx.font = "bold 12px Arial";
      ctx.fillText("CHANCE: x1, x2, x3 MULTIPLIER", btnMult.x + btnMult.w / 2, btnMult.y + 24);

      ctx.fillStyle = currentMultOption.col;
      ctx.font = "bold 26px Arial";
      ctx.fillText(currentMultOption.label, btnMult.x + btnMult.w / 2, btnMult.y + 58);

      ctx.fillStyle = "#a0b0c8";
      ctx.font = "11px Arial";
      ctx.fillText("TAP OR CLICK TO GRAB THIS BONUS!", btnMult.x + btnMult.w / 2, btnMult.y + 82);

      // 4) 랜덤 뽑기 당첨 시 2초간 화면 중앙 노출 연출
      if (randomPickShowcaseActive) {
        const showcaseElapsed = curTime - randomPickShowcaseStartTime;
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        const popW = 340, popH = 200;
        const popX = LOGICAL_WIDTH / 2 - popW / 2;
        const popY = LOGICAL_HEIGHT / 2 - popH / 2;

        ctx.fillStyle = "rgba(15, 25, 45, 0.98)";
        drawRoundRect(ctx, popX, popY, popW, popH, 14);
        ctx.fill();
        ctx.strokeStyle = "#ffd700";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffd700";
        ctx.font = "bold 18px Arial";
        ctx.fillText("★ BONUS MULTIPLIER WON! ★", LOGICAL_WIDTH / 2, popY + 45);

        ctx.fillStyle = randomPickResult.col;
        ctx.font = "bold 32px Arial";
        ctx.fillText(randomPickResult.label, LOGICAL_WIDTH / 2, popY + 105);

        ctx.fillStyle = "#00f5ff";
        ctx.font = "bold 14px Arial";
        ctx.fillText("STAT UPGRADED! RETURNING...", LOGICAL_WIDTH / 2, popY + 155);

        if (showcaseElapsed >= 2.0) {
          randomPickShowcaseActive = false;
          gameState = 1; // 2초 후 실지 게임으로 복귀
        }
      }

      ctx.textAlign = "left";
      ctx.fillStyle = "#46465a";
      ctx.font = "11px monospace";
      ctx.fillText(VERSION_STR, 10, LOGICAL_HEIGHT - 12);

    // 3-1. TIMED MINIGAME STATE
    } else if (gameState === 5) {
      ctx.fillStyle = "#080814";
      ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      stars.forEach(s => s.draw());

      const popW = 320, popH = 240;
      const popX = LOGICAL_WIDTH / 2 - popW / 2;
      const popY = LOGICAL_HEIGHT / 2 - popH / 2;

      ctx.fillStyle = "rgba(15, 20, 38, 0.95)";
      drawRoundRect(ctx, popX, popY, popW, popH, 12);
      ctx.fill();
      ctx.strokeStyle = "#00f5ff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.fillStyle = "#00f5ff";
      ctx.font = "bold 18px Arial";
      ctx.fillText(`${minigameTargetOption === "LASER_WEAPON" ? "LASER WEAPON" : "ENERGY SHIELD"}`, LOGICAL_WIDTH / 2, popY + 45);

      if (minigameSelectedTime === null) {
        minigameRollingTime = Math.floor(20 + Math.random() * 41);
        ctx.fillStyle = "#ffe600";
        ctx.font = "bold 56px Arial";
        ctx.fillText(`${minigameRollingTime}s`, LOGICAL_WIDTH / 2, popY + 125);

        ctx.fillStyle = "#ffffff";
        ctx.font = "13px Arial";
        ctx.fillText("TAP OR CLICK SCREEN TO STOP!", LOGICAL_WIDTH / 2, popY + 185);
      } else {
        ctx.fillStyle = "#32ff78";
        ctx.font = "bold 56px Arial";
        ctx.fillText(`${minigameSelectedTime}s`, LOGICAL_WIDTH / 2, popY + 125);

        ctx.fillStyle = "#32ff78";
        ctx.font = "bold 15px Arial";
        ctx.fillText("DURATION CONFIRMED!", LOGICAL_WIDTH / 2, popY + 185);

        if (curTime - minigameFinishTimestamp >= 1.2) {
          applyChosenSkill(minigameTargetOption, minigameSelectedTime);
          gameState = 1;
        }
      }

    // 4. GAMEOVER STATE
    } else if (gameState === 3) {
      ctx.fillStyle = "#080814";
      ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      stars.forEach(s => s.draw());

      const popY = LOGICAL_HEIGHT * 0.3;
      ctx.fillStyle = "#14192d";
      drawRoundRect(ctx, LOGICAL_WIDTH / 2 - 160, popY - 20, 320, 220, 14);
      ctx.fill();
      ctx.strokeStyle = "#ff0080";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.fillStyle = "#ff0080";
      ctx.font = "bold 24px Arial";
      ctx.fillText("GAME OVER", LOGICAL_WIDTH / 2, popY + 15);
      ctx.fillStyle = "#ffe600";
      ctx.font = "bold 16px Arial";
      ctx.fillText(`FINAL SCORE: ${score}`, LOGICAL_WIDTH / 2, popY + 45);

      ctx.fillStyle = "#00f5ff";
      drawRoundRect(ctx, LOGICAL_WIDTH / 2 - 90, popY + 125, 180, 42, 8);
      ctx.fill();
      ctx.fillStyle = "#14192d";
      ctx.font = "bold 15px Arial";
      ctx.fillText("SUBMIT & RESTART", LOGICAL_WIDTH / 2, popY + 151);

      ctx.textAlign = "left";
      ctx.fillStyle = "#46465a";
      ctx.font = "11px monospace";
      ctx.fillText(VERSION_STR, 10, LOGICAL_HEIGHT - 12);
    }
  } catch(err){}

  requestAnimationFrame(safeGameLoop);
}

function handleGameOver() {
  setTimeout(() => {
    if (isEligibleForTop10(score)) {
      gameState = 3;
      nameInputOverlay.style.display = "block";
      nameInput.value = "";
      nameInput.focus();
    } else {
      currentBgmMode = "select";
      gameState = 0;
    }
  }, 800);
}

requestAnimationFrame(safeGameLoop);
</script>
</body>
</html>
