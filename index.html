let audioCtx = null;

let bgmStep = 0;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    startBGM();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type="sine", sweep=0, vol=0.15) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    const now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(freq, now);
    if (sweep !== 0) osc.frequency.linearRampToValueAtTime(freq + sweep, now + duration);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  } catch(e){}
}

function playExplosionSound() {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const dur = 0.25;
    const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < buf.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / buf.length);
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    src.buffer = buf;
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(now);
  } catch(e){}
}

function startBGM() {
  if (bgmInterval) return;
  const notes = [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63];
  const bassNotes = [65.41, 73.42, 82.41, 98.00];

  bgmInterval = setInterval(() => {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;

    if (bgmStep % 4 === 0) {
      const bOsc = audioCtx.createOscillator();
      const bGain = audioCtx.createGain();
      bOsc.type = "sawtooth";
      bOsc.frequency.setValueAtTime(bassNotes[(bgmStep / 4) % bassNotes.length], now);
      bGain.gain.setValueAtTime(0.05, now);
      bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      bOsc.connect(bGain);
      bGain.connect(audioCtx.destination);
      bOsc.start(now);
      bOsc.stop(now + 0.35);
    }

    if (bgmStep % 2 === 0) {
      const mOsc = audioCtx.createOscillator();
      const mGain = audioCtx.createGain();
      mOsc.type = "sine";
      const noteIdx = (bgmStep * 3 + 2) % notes.length;
      mOsc.frequency.setValueAtTime(notes[noteIdx], now);
      mGain.gain.setValueAtTime(0.035, now);
      mGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      mOsc.connect(mGain);
      mGain.connect(audioCtx.destination);
      mOsc.start(now);
      mOsc.stop(now + 0.2);
    }

    bgmStep = (bgmStep + 1) % 64;
  }, 130);
}

function drawMatrix(matrix, cx, cy, colorMap, psize=3) {
  const rows = matrix.length;
  const cols = matrix[0].length;
  const startX = Math.floor(cx - (cols * psize) / 2);
  const startY = Math.floor(cy - (rows * psize) / 2);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const v = matrix[r][c];
      if (v !== 0 && colorMap[v]) {
        ctx.fillStyle = colorMap[v];
        ctx.fillRect(startX + c * psize, startY + r * psize, psize, psize);
      }
    }
  }
}

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);

  }
}

class ExplosionFX {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color || "#ffe600";
    this.type = Math.floor(Math.random() * 5);
    this.life = 1.0;
    this.decay = 2.5 + Math.random() * 1.5;
    this.elements = [];

    if (this.type === 0) {
      for (let i = 0; i < 12; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 3 + Math.random() * 4;
        this.elements.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 3 + Math.random() * 3 });
      }
    } else if (this.type === 1) {
      this.elements.push({ r: 4, maxR: 32, width: 3 });
    } else if (this.type === 2) {
      const angles = [Math.PI/4, 3*Math.PI/4, 5*Math.PI/4, 7*Math.PI/4];
      angles.forEach(ang => {
        const spd = 4 + Math.random() * 3;
        this.elements.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 4 });
      });
    } else if (this.type === 3) {
      for (let i = 0; i < 16; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 5 + Math.random() * 5;
        this.elements.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 2 });
      }
    } else {
      for (let i = 0; i < 8; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 3;
        this.elements.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, s: 4 + Math.random() * 3 });
      }
    }
  }
  update(dt) {
    this.life -= this.decay * dt;
    if (this.type === 0 || this.type === 2 || this.type === 3) {
      this.elements.forEach(el => {
        el.x += el.vx * (dt * 60);
        el.y += el.vy * (dt * 60);
        el.r = Math.max(0, el.r - dt * 2);
      });
    } else if (this.type === 1) {
      this.elements[0].r += 65 * dt;
    } else if (this.type === 4) {
      this.elements.forEach(el => {
        el.x += el.vx * (dt * 60);
        el.y += el.vy * (dt * 60);
      });
    }
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, this.life));
    ctx.fillStyle = this.color;
    ctx.strokeStyle = this.color;

    if (this.type === 0 || this.type === 2 || this.type === 3) {
      this.elements.forEach(el => {
        if (el.r > 0) {
          ctx.beginPath();
          ctx.arc(el.x, el.y, el.r, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    } else if (this.type === 1) {
      const el = this.elements[0];
      ctx.lineWidth = el.width;
      ctx.beginPath();
      ctx.arc(this.x, this.y, el.r, 0, Math.PI * 2);
      ctx.stroke();
    } else if (this.type === 4) {
      this.elements.forEach(el => {
        ctx.fillRect(el.x - el.s / 2, el.y - el.s / 2, el.s, el.s);
      });
    }
    ctx.restore();
  }
}

class BossDropItem {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radius = 16;
    this.speed = 2.2;
    this.spawnTime = performance.now() / 1000;
  }
  getType(curTime) {
    const elapsed = curTime - this.spawnTime;
    const idx = Math.floor(elapsed) % 3;
    return ["P", "S", "D"][idx];
  }
  update(dt) {
    this.y += this.speed * (dt * 60);
  }
  draw(curTime) {
    const type = this.getType(curTime);
    const pulse = Math.sin(curTime * 10) * 3;
    const r = this.radius + pulse;

    ctx.fillStyle = "rgba(255, 215, 0, 0.4)";
    ctx.beginPath();
    ctx.arc(this.x, this.y, r + 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = type === "P" ? "#ff0080" : (type === "S" ? "#00f5ff" : "#ffe600");
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 15px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(type, this.x, this.y);
  }
}

    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

  }
}

    } else {
      this.y += (effSpeed * 1.15) * (dt * 60);
    }

      const pulse = Math.sin(curTime * 12.0) * 3;
      ctx.strokeStyle = "#00f5ff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 8 + pulse,
